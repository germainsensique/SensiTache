<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SensiTâche</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="theme-color" content="#121317">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SensiTâche">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://alcdn.msauth.net/browser/3.7.1/js/msal-browser.min.js" async defer></script>
<style>
  :root{
    --bg-app:#121317; --bg-panel:#1A1C22; --bg-panel-2:#22242B; --bg-main:#16171C; --bg-card:#1E2027;
    --bg-canvas:#23262E; --grid-dot:#3B3F4A;
    --border:#2C2F38; --border-light:#383B45; --border-soft:#2C2F38;
    --text:#ECEBE6; --text-dim:#9A9DA8; --text-main:#ECEBE6; --text-sub:#9198A5;
    --accent:#E4E4E4; --accent-dark:#C7C7C7;
    --flame:#E0555F; --urgent:#E8813A; --knowledge:#1FA971; --recur:#7A5CFA; --clock:#3AA0D6; --followup:#8B8FA3;
    --green:#1FA971; --orange:#E07B39; --grey-arrow:#9A9DA8; --danger:#E0555F;
    color-scheme: dark;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg-main);color:var(--text-main);overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  #app{height:100%;display:flex;}

  .btn{background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-soft); padding:7px 13px; border-radius:7px; font-size:13.5px; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{background:#262A34;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--bg-app);}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.danger{background:transparent;border-color:var(--border-soft);color:var(--danger);}
  .btn.danger:hover{background:rgba(224,85,95,.1); border-color:var(--danger);}
  .btn.ghost{background:transparent;border-color:transparent;}
  .btn.ghost:hover{background:#262A34;}
  .btn.small{padding:4px 9px;font-size:12px;border-radius:6px;}
  .btn.chip{border-radius:20px;}
  .btn.chip.on.flame{background:rgba(224,85,95,.2);border-color:var(--flame);color:#F0838C;}
  .btn.chip.on.urgent{background:rgba(232,129,58,.2);border-color:var(--urgent);color:#F0A46B;}
  .btn.chip.on.knowledge{background:rgba(31,169,113,.2);border-color:var(--knowledge);color:#5FD9A4;}
  .btn.chip.on.quick{background:rgba(58,160,214,.2);border-color:var(--clock);color:#7CC6E8;}
  .btn.chip.on.followup{background:rgba(139,143,163,.2);border-color:var(--followup);color:#C4C8D4;}

  /* ---------- Sidebar (dark, on the app) ---------- */
  .sidebar{width:230px; flex-shrink:0; background:var(--bg-app); color:var(--text); display:flex; flex-direction:column; padding:16px 10px;}
  .brand{font-size:15.5px; font-weight:700; padding:6px 10px 14px; letter-spacing:.2px;}
  .brand span.brand-accent{color:var(--accent);}
  .side-section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); padding:14px 10px 6px;}
  .ws-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;color:var(--text-dim);}
  .ws-item:hover{background:var(--bg-panel-2); color:var(--text);}
  .ws-item.active{background:var(--accent); color:var(--bg-app);}
  .ws-item .wsname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ws-item .wsicon{flex-shrink:0;font-size:14px;width:18px;text-align:center;cursor:pointer;border-radius:4px;}
  .ws-item .wsicon:hover{background:rgba(255,255,255,.12);}
  .ws-item .wsdel{opacity:0;font-size:11px;}
  .ws-item:hover .wsdel{opacity:.7;}
  .side-footer{margin-top:auto; display:flex; flex-direction:column; gap:6px;}
  .sidebtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text-dim);background:transparent;border:none;text-align:left;}
  .sidebtn:hover{background:var(--bg-panel-2); color:var(--text);}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:10px; padding:14px 26px 0;}
  .topbar h1{font-size:19px; margin:0; font-weight:700; grid-column:2; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tabs{display:flex; gap:4px; padding:14px 26px 0; border-bottom:1px solid var(--border-soft);}
  .tab{padding:9px 14px; font-size:13.5px; color:var(--text-sub); border-bottom:2px solid transparent; cursor:pointer;}
  .tab:hover{color:var(--text-main);}
  .tab.active{color:var(--accent); border-color:var(--accent); font-weight:600;}
  .main-content{flex:1; overflow-y:auto; padding:20px 26px 60px;}

  /* ---------- Task list ---------- */
  .newtask-row{display:flex; gap:8px; margin-bottom:18px;}
  .newtask-row input{flex:1; border:1px solid var(--border-soft); border-radius:8px; padding:10px 14px; font-size:14px; background:var(--bg-card);}
  .task-group-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-sub); margin:20px 0 8px; display:flex; align-items:center; gap:6px;}
  .task-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:9px; margin-bottom:6px; cursor:pointer;}
  .task-row:hover{border-color:#454956;}
  .task-check{width:19px;height:19px;border-radius:50%;border:2px solid #4A4E5A;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg-panel-2);}
  .task-check:hover{border-color:var(--accent);}
  .task-check.checked{background:var(--accent); border-color:var(--accent);}
  .task-title{flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .badges{display:flex; gap:5px; align-items:center; flex-shrink:0;}
  .badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .badge svg{width:13px;height:13px;}
  .badge.flame{background:rgba(224,85,95,.18); color:#F0838C;}
  .badge.urgent{background:rgba(232,129,58,.18); color:#F0A46B;}
  .badge.clock{background:rgba(58,160,214,.18); color:var(--clock);}
  .badge.recur{background:rgba(122,92,250,.18); color:var(--recur);}
  .badge.quick{background:rgba(58,160,214,.18); color:var(--clock);}
  .badge.followup{background:rgba(139,143,163,.18); color:var(--followup);}
  .badge.knowledge{background:rgba(31,169,113,.18); color:#5FD9A4;}
  .badge.proc{background:rgba(255,255,255,.12); color:var(--accent);}
  .badge.attach{background:var(--bg-panel-2); color:var(--text-sub); font-size:10px; font-weight:700; width:auto; padding:0 6px;}
  .assignee-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-sub); flex-shrink:0; width:86px;}
  .avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;flex-shrink:0;}
  .empty-hint{color:var(--text-sub); font-size:13.5px; padding:30px 4px;}

  .collab-group{margin-bottom:26px;}
  .collab-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:14px;}

  .kb-card{background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .kb-card h4{margin:0 0 4px; font-size:14.5px;}
  .kb-card p{margin:0; font-size:12.5px; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  .archive-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:9px;margin-bottom:6px;}
  .archive-row .task-title{text-decoration:line-through; color:var(--text-sub);}
  .archive-meta{font-size:11.5px; color:var(--text-sub); width:150px; flex-shrink:0;}

  /* ---------- Task drawer ---------- */
  .overlay-bg{position:fixed; inset:0; background:rgba(10,11,14,.35); z-index:60; display:none;}
  .overlay-bg.show{display:block;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:460px; max-width:92vw; background:var(--bg-main); z-index:61; box-shadow:-10px 0 30px rgba(0,0,0,.25); transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column;}
  .drawer.fullscreen{width:100vw; max-width:100vw;}
  .drawer.fullscreen .drawer-body{max-width:820px; margin:0 auto; width:100%;}
  .drawer.fullscreen #taskDescInput{min-height:220px; font-size:14.5px;}
  #inlineProcessPreview{margin:4px 0 20px; border:1px solid var(--border-soft); border-radius:10px; overflow:hidden; background:var(--bg-canvas); cursor:pointer;}
  #inlineProcessPreview .ipp-label{padding:8px 12px; font-size:12px; color:var(--text-sub); border-top:1px solid var(--border-soft);}
  #inlineProcessPreview svg{display:block; width:100%; max-height:380px;}
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--border-soft);}
  .drawer-body{flex:1; overflow-y:auto; padding:16px 20px 60px;}
  #taskTitleInput{width:100%; border:none; background:transparent; font-size:20px; font-weight:700; padding:4px 0; margin-bottom:6px;}
  #taskTitleInput:focus{outline:none;}
  #taskDescInput{width:100%; min-height:70px; border:1px solid var(--border-soft); border-radius:8px; padding:9px 11px; font-size:13.5px; resize:vertical; background:var(--bg-card); margin-bottom:16px;}
  .field-row{margin-bottom:16px;}
  .field-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-sub); margin-bottom:7px; display:flex; align-items:center; gap:6px;}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap;}
  select.fieldselect{width:100%; border:1px solid var(--border-soft); border-radius:8px; padding:9px 11px; font-size:13.5px; background:var(--bg-card); color:var(--text-main);}
  input.fieldinput{width:100%; border:1px solid var(--border-soft); border-radius:8px; padding:9px 11px; font-size:13.5px; background:var(--bg-card); color:var(--text-main);}
  .recur-row{display:flex; gap:8px;}
  .recur-row select{flex:1;}
  .attach-list{display:flex; flex-direction:column; gap:6px;}
  .attach-item{display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:8px; padding:7px 10px; font-size:12.5px;}
  .attach-item .aicon{width:22px;height:22px;border-radius:6px;background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;}
  .attach-item .aname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drawer-footer{padding:12px 20px; border-top:1px solid var(--border-soft); display:flex; justify-content:space-between; gap:8px;}

  /* ---------- Modals (collaborator create, workspace) ---------- */
  .modal-overlay{position:fixed; inset:0; background:transparent; z-index:150; display:flex; align-items:center; justify-content:center;}
  .modal{background:var(--bg-card); border-radius:12px; padding:22px; width:340px; max-width:90vw;}
  .modal h2{margin:0 0 12px; font-size:16px;}
  .modal input{width:100%; border:1px solid var(--border-soft); border-radius:8px; padding:9px 11px; font-size:13.5px; margin-bottom:10px; background:var(--bg-app); color:var(--text-main);}
  .modal .swrow{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .colordot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .colordot.sel{border-color:var(--text-main);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px;}

  /* ================= PROCESS EDITOR (embedded per task) ================= */
  .proc-overlay{position:fixed; inset:0; background:var(--bg-app); z-index:120; display:none; flex-direction:column;}
  .proc-overlay.show{display:flex;}
  .proc-topbar{display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--bg-panel); border-bottom:1px solid var(--border); flex-wrap:wrap; color:var(--text);}
  .proc-topbar .divider{width:1px;height:22px;background:var(--border-light);margin:0 4px;}
  .proc-body{flex:1; display:flex; min-height:0;}
  .proc-toolbar{width:64px; background:var(--bg-panel); border-right:1px solid var(--border); flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:6px;}
  .proc-toolbar .tbtn{width:48px;height:48px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;}
  .proc-toolbar .tbtn svg{width:19px;height:19px;}
  .proc-toolbar .tbtn:hover{background:var(--bg-panel-2); color:var(--text);}
  .proc-toolbar .tbtn.active{background:var(--accent); color:var(--bg-app);}
  .proc-toolbar .tsep{width:32px;height:1px;background:var(--border-light);margin:6px 0;}
  .proc-canvas-scroll{flex:1; overflow:auto; position:relative; background:var(--bg-canvas); background-image:radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px); background-size:22px 22px; touch-action:pan-x pan-y;}
  #procBoard{position:relative; transform-origin:0 0;}
  #procArrowSvg{position:absolute; top:0; left:0; overflow:visible; z-index:2;}
  .proc-shapes-layer{position:absolute; top:0; left:0; z-index:3;}
  .pshape{position:absolute; display:flex; filter:drop-shadow(0 2px 6px rgba(0,0,0,.28)); touch-action:none; transition:filter .12s;}
  .pshape:hover{filter:drop-shadow(0 3px 10px rgba(0,0,0,.38));}
  .pshape.rect .pshapeBg{border-radius:10px;}
  .pshape.diamond .pshapeBg{clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);}
  .pshapeBg{position:absolute; inset:0; background:#FFD966; border:1.5px solid rgba(0,0,0,.14); background-image:linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.05));}
  .pshape.selected .pshapeBg{outline:2.5px solid var(--accent); outline-offset:2px; box-shadow:0 0 0 5px rgba(122,140,255,.18);}
  .pshape.multiselected .pshapeBg{outline:2.5px solid #FF4D8D; outline-offset:2px; box-shadow:0 0 0 5px rgba(255,77,141,.16);}
  .pshapeContent{position:relative; z-index:1; width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px 16px; font-size:13.5px; font-weight:500; line-height:1.3; color:#1B1D23; overflow:auto; outline:none; word-break:break-word;}
  .pshape.diamond .pshapeContent{padding:10px 34px;}
  .pshapeContent[contenteditable="true"]{cursor:text; background:rgba(255,255,255,.35); border-radius:4px;}
  .presizeHandle{position:absolute;width:14px;height:14px;right:-6px;bottom:-6px;background:var(--accent);border:2px solid var(--bg-app);border-radius:3px;z-index:4;cursor:nwse-resize;display:none;touch-action:none;}
  .pshape.selected .presizeHandle{display:block;}
  .panchor{position:absolute;width:13px;height:13px;background:#fff;border:2px solid var(--bg-app);border-radius:50%;z-index:5;opacity:.45;transition:opacity .1s, transform .1s;cursor:crosshair;touch-action:none;}
  .panchor:hover{transform:scale(1.35); background:var(--bg-app);}
  .pshape:hover .panchor, .pshape.selected .panchor, .panchor.forceShow{opacity:1;}
  .panchor.top{top:-6px;left:calc(50% - 6px);} .panchor.bottom{bottom:-6px;left:calc(50% - 6px);}
  .panchor.left{left:-6px;top:calc(50% - 6px);} .panchor.right{right:-6px;top:calc(50% - 6px);}
  .collabtag{position:absolute; top:-10px; left:6px; z-index:5; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; color:#fff; white-space:nowrap;}
  .desctag{position:absolute; top:-10px; right:6px; z-index:5; width:19px; height:19px; border-radius:50%; background:var(--bg-panel); border:1.5px solid rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; font-size:10px; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .durtag{position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); z-index:5; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--bg-panel); border:1.5px solid rgba(0,0,0,.18); color:var(--text); white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .pfloat-toolbar{position:absolute;z-index:6;background:var(--bg-panel);border:1px solid var(--border-light);border-radius:10px;padding:6px;display:flex;gap:5px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #procLassoBox{position:absolute;z-index:6;border:1.5px dashed var(--accent);background:rgba(122,140,255,.12);border-radius:3px;pointer-events:none;}
  .proc-side{width:280px;flex-shrink:0;background:var(--bg-panel);border-left:1px solid var(--border);overflow:hidden;color:var(--text);}
  .proc-side.collapsed{width:0;border-left:none;}
  .proc-side-toggle{width:20px;flex-shrink:0;background:var(--bg-panel);border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
  .proc-side-toggle:hover{color:var(--text);background:var(--bg-panel-2);}
  .proc-side-inner{width:280px;padding:16px;overflow-y:auto;height:100%;}
  .proc-side h3{font-size:13px;margin:0 0 12px;font-weight:600;}
  .plegend-item{background:var(--bg-panel-2);border:1px solid var(--border-light);border-radius:8px;padding:10px;margin-bottom:8px;}
  .plegend-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .plegend-item input[type=text]{flex:1;background:transparent;border:1px solid transparent;color:var(--text);font-size:13px;font-weight:600;padding:4px 6px;border-radius:5px;min-width:0;}
  .plegend-item input[type=text]:hover,.plegend-item input[type=text]:focus{border-color:var(--border-light);outline:none;}
  .plegend-item textarea{width:100%;background:var(--bg-app);border:1px solid var(--border-light);color:var(--text-dim);font-size:12px;border-radius:6px;padding:6px 8px;resize:vertical;min-height:36px;}
  .swatch-input{width:28px;height:28px;padding:0;border:1px solid var(--border-light);border-radius:6px;background:none;}
  .plegend-item .swatch-input{width:24px;height:24px;border-radius:5px;}

  @media (pointer:coarse){
    .panchor{width:20px;height:20px;opacity:.4;}
    .panchor.top{top:-9px;left:calc(50% - 10px);} .panchor.bottom{bottom:-9px;left:calc(50% - 10px);}
    .panchor.left{left:-9px;top:calc(50% - 10px);} .panchor.right{right:-9px;top:calc(50% - 10px);}
    .presizeHandle{width:20px;height:20px;right:-9px;bottom:-9px;display:block;}
  }

  @media (min-width: 861px){
    .two-col-layout{ display:flex; gap:20px; align-items:flex-start; }
    .task-col{ flex:1; min-width:0; }
  }

  @media (max-width: 860px){
    .sidebar{position:fixed; z-index:70; height:100%; width:min(82vw,300px); transform:translateX(-100%); transition:transform .15s;}
    .sidebar.show{transform:translateX(0);}
    #btnToggleSidebar{visibility:visible;}
    .drawer{width:100vw;}
    .drawer-head{flex-wrap:wrap;gap:8px;}
    .proc-topbar{overflow-x:auto;flex-wrap:nowrap;}
    .proc-topbar > *{flex-shrink:0;}
    #procNameInput{max-width:110px;}
    .proc-toolbar{width:100%;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);order:2;padding:6px 8px;overflow-x:auto;}
    .proc-body{flex-direction:column;}
    .proc-canvas-scroll{order:1;}
    .proc-side{position:fixed;top:0;right:0;bottom:0;width:86vw;max-width:320px;z-index:130;box-shadow:-8px 0 24px rgba(0,0,0,.4);transform:translateX(0);transition:transform .15s;}
    .proc-side.collapsed{width:86vw;max-width:320px;transform:translateX(100%);border-left:1px solid var(--border);}
    .proc-side-inner{width:100%;}
    .proc-side-toggle{position:fixed;top:50%;right:0;transform:translateY(-50%);width:22px;height:60px;border-radius:8px 0 0 8px;box-shadow:-4px 0 10px rgba(0,0,0,.3);z-index:131;}
    .topbar, .tabs{padding-left:14px;padding-right:14px;}
    .topbar h1{font-size:16px;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;}
    .tabs .tab{flex-shrink:0;padding:9px 11px;}
    .main-content{padding:14px 14px 90px;}

<script>
(function(){
"use strict";

/* =========================================================
   STORAGE
========================================================= */
const STORAGE_KEY = "sensitache.data.v1";
const PALETTE = ["#5B6CFF","#E8813A","#1FA971","#E0555F","#3AA0D6","#7A5CFA","#D9A017","#C2547A"];

/* backup/sync state declared early: saveData() below can fire during the
   very first app initialization (before any of the later code runs), so
   these must exist before that point to avoid a "used before declaration" error */
let backupDebounceTimer = null;
const BACKUPS_KEY = "sensitache.backupsList";
let backupRecurrenceMin = Number(localStorage.getItem("sensitache.backupRecurrenceMin")) || 30;
let backupRetentionCount = Number(localStorage.getItem("sensitache.backupRetentionCount")) || 10;
let backupTimerHandle = null;
let corbeilleRetentionDays = Number(localStorage.getItem("sensitache.corbeilleRetentionDays")) || 0; // 0 = never auto-delete
let deferredInstallPrompt = null;
const DRIVE_FILENAME = "sensitache-sauvegarde-drive.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_DEFAULT_ACCOUNT = "germain.sensique@gmail.com";
let driveClientId = localStorage.getItem("sensitache.driveClientId") || "575977443231-sojgu8ar97bgq618b4bjri90on89e300.apps.googleusercontent.com";
let driveAccessToken = null;
let driveTokenExpiry = 0;
let driveFileId = localStorage.getItem("sensitache.driveFileId") || null;
let driveTokenClient = null;
let driveLastSyncAt = localStorage.getItem("sensitache.driveLastSync") ? Number(localStorage.getItem("sensitache.driveLastSync")) : null;
let driveLastSyncError = null;

/* Microsoft 365 / Exchange Online (Outlook) — read-only via Microsoft
   Graph, for a mailbox read day-to-day through an app like "Nine". */
let msalClientId = localStorage.getItem("sensitache.msalClientId") || "";
let msalInstance = null;
let msGraphToken = null;
let msTokenExpiry = 0;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ console.warn("lecture impossible", e); return null; }
}
function saveData(){
  lastLocalEditAt = Date.now();
  // The process editor mutates PROC (=t.process) directly in many places
  // without always touching the owning task's own updatedAt. Since sync
  // merge picks the whole task object with the greatest updatedAt (see
  // mergeData's task union), a process/legend edit that never bumps the
  // task's updatedAt can be silently discarded by a later merge pulling in
  // an older-but-"newer-stamped" copy of the same task. Stamping the owner
  // here, on every save while a process is open, keeps that edit tagged as
  // the freshest copy no matter which field inside PROC changed.
  // (try : au tout premier démarrage d'un nouvel appareil, saveData() est
  // appelé avant que PROC et d'autres variables plus bas soient déclarées.)
  try{
    if(PROC){
      const procOwner = DATA.tasks.find(x=> x.process === PROC);
      if(procOwner) procOwner.updatedAt = Date.now();
    }
  }catch(e){}
  try{ syncStampLocalChanges(); }catch(e){ /* pas encore initialisé au tout premier démarrage */ }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){ alert("Impossible d'enregistrer (stockage plein ?). Exporte ta sauvegarde régulièrement.\n"+e.message); }
  try{ scheduleAutoBackup(); }catch(e){}
  try{ collabMeetingOnSave(); }catch(e){}
}
function uid(p){ return (p||"id")+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
// Pointer-based drag-reorder (subtasks, task list, tabs) all share this: if
// a pointerup ever fails to fire cleanly (common on mobile — an interrupted
// touch, a scroll taking over mid-gesture), the old listeners could stay
// attached to document and fire later on an unrelated click, corrupting
// whatever list is being reordered at that point. Every drag start now
// force-cleans any previous session first, and always listens for
// pointercancel too, so a leak can never survive past the next drag.
let __activeDragCleanup = null;
function startDragSession(cleanupFn){
  if(__activeDragCleanup){ try{ __activeDragCleanup(); }catch(e){} }
  __activeDragCleanup = cleanupFn;
}
function endDragSession(){ __activeDragCleanup = null; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Same fix as todayStr(): .toISOString() converts to UTC, which silently
// shifts a local midnight Date back a day for any timezone ahead of UTC
// (like France). Every date-arithmetic helper must format via local getters
// instead, or recurrences compute one day early.
function dateToStr(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let DATA = loadData();
if(!DATA){
  const meId = uid("collab");
  DATA = {
    currentUserId: meId,
    collaborators: [{id:meId, name:"Moi", color:PALETTE[0], updatedAt:Date.now()}],
    workspaces: [{id:uid("ws"), name:"Général", updatedAt:Date.now()}],
    tasks: [],
    tombstones: {workspaces:{}, tasks:{}, collaborators:{}}
  };
  saveData();
}
// migration: older saves may not have a tombstones table or workspace timestamps yet
if(!DATA.tombstones) DATA.tombstones = {workspaces:{}, tasks:{}, collaborators:{}};
(DATA.workspaces||[]).forEach(w=>{ if(!w.updatedAt) w.updatedAt = Date.now(); });
(DATA.collaborators||[]).forEach(c=>{ if(!c.updatedAt) c.updatedAt = Date.now(); });

(DATA.tasks||[]).forEach(t=>{

/* ---- undo ---- */
let undoStack = [], undoTimes = [];
function snapshot(){
  undoStack.push(JSON.stringify(DATA)); undoTimes.push(Date.now());
  if(undoStack.length>25){ undoStack.shift(); undoTimes.shift(); }
}
function undo(){
  if(undoStack.length===0){ alert("Rien à annuler."); return; }
  const snapTs = undoTimes.pop() || 0;
  const snap = JSON.parse(undoStack.pop());
  try{ syncStampLocalChanges(); }catch(e){}
  // N'annule que ce qui a été fait SUR CET APPAREIL depuis ce point : les
  // modifications reçues de l'autre appareil entre-temps sont conservées,
  // et ce qui est rétabli est daté maintenant pour l'emporter à la synchro
  // (sinon la synchro suivante défaisait l'annulation).
  const cur = DATA, now = Date.now();
  const touched = id=> (typeof syncLocalTouch!=="undefined" && (syncLocalTouch.get(id)||0) >= snapTs);
  const snapMap = new Map((snap.tasks||[]).map(t=>[t.id, t]));
  const curMap = new Map((cur.tasks||[]).map(t=>[t.id, t]));
  const tomb = cur.tombstones || {workspaces:{}, tasks:{}, collaborators:{}};
  const tasks = [];
  new Set([...snapMap.keys(), ...curMap.keys()]).forEach(id=>{
    const sv = snapMap.get(id), cv = curMap.get(id);
    if(touched(id)){
      if(sv){ if(!cv){ sv.updatedAt = now; sv._stampedAt = now; delete tomb.tasks[id]; } tasks.push(sv); }
      else tomb.tasks[id] = now;               // créée ici après ce point → retirée
    } else if(cv) tasks.push(cv);              // pas touchée ici → on garde l'état actuel
  });
  // Espaces et collaborateurs : on rétablit ceux qui avaient été supprimés,
  // sans jamais retirer ceux apparus entre-temps (ils peuvent venir de l'autre appareil).
  const restoreKind = (kind)=>{
    tomb[kind] = tomb[kind] || {};
    const curIds = new Set((cur[kind]||[]).map(x=>x.id));
    const list = (snap[kind]||[]).map(x=>{ if(!curIds.has(x.id)){ x.updatedAt = now; delete tomb[kind][x.id]; } return x; });
    const snapIds = new Set(list.map(x=>x.id));
    (cur[kind]||[]).forEach(x=>{ if(!snapIds.has(x.id)) list.push(x); });
    return list;
  };
  DATA = Object.assign({}, snap, {
    currentUserId: cur.currentUserId,
    tasks,
    workspaces: restoreKind("workspaces"),
    collaborators: restoreKind("collaborators"),
    tombstones: tomb
  });
  saveData(); renderSidebar(); renderMain();
}

function renderSidebar(){
  const list = document.getElementById("wsList");
  list.innerHTML = "";
  DATA.workspaces.forEach(ws=>{
    const row = document.createElement("div");
    row.className = "ws-item" + (ws.id===currentWsId ? " active":"");
    row.innerHTML = `<span class="wsicon" data-icon="${ws.id}" title="Changer l'icône">${ws.icon||"📁"}</span><span class="wsname">${escapeHtml(ws.name)}</span><span class="wsdel" data-rename="${ws.id}" title="Renommer">✎</span><span class="wsdel" data-del="${ws.id}" title="Supprimer">✕</span>`;
    row.addEventListener("click", (e)=>{
      if(e.target.dataset.del || e.target.dataset.rename || e.target.dataset.icon) return;
      currentWsId = ws.id; openTaskId=null; currentTab="tasks"; renderSidebar(); renderMain();
      closeSidebarMobile();
    });
    row.querySelector("[data-icon]").addEventListener("click", (e)=>{
      e.stopPropagation();
      showWorkspaceIconPicker(ws);
    });
    row.querySelector("[data-rename]").addEventListener("click", (e)=>{
      e.stopPropagation();
      const n = prompt("Nouveau nom de l'espace de travail :", ws.name);
      if(!n || !n.trim()) return;
      ws.name = n.trim();
      ws.updatedAt = Date.now();
      saveData(); renderSidebar(); renderMain();
    });
    row.querySelector("[data-del]").addEventListener("click", (e)=>{
      e.stopPropagation();
      if(!confirm("Supprimer l'espace « "+ws.name+" » et toutes ses tâches ?")) return;
      snapshot();
      const now = Date.now();
      const removedIds = new Set(DATA.tasks.filter(t=>t.workspaceId===ws.id).map(t=>t.id));
      removedIds.forEach(id=> DATA.tombstones.tasks[id] = now);
      DATA.tasks.filter(t=>t.workspaceId===ws.id).forEach(cleanupTaskAttachments);
      DATA.tasks = DATA.tasks.filter(t=>t.workspaceId!==ws.id);
      cleanupLinkedShapeRefs(removedIds);
      DATA.tombstones.workspaces[ws.id] = now;
      DATA.workspaces = DATA.workspaces.filter(w=>w.id!==ws.id);
      if(currentWsId===ws.id) currentWsId = DATA.workspaces[0] ? DATA.workspaces[0].id : null;
      saveData(); renderSidebar(); renderMain();
    });
    list.appendChild(row);
  });
}

async function refreshStorageUsageLine(textBytes){
  const el = document.getElementById("storageUsageLine");
  if(!el) return;
  if(navigator.storage && navigator.storage.estimate){
    try{
      const {usage, quota} = await navigator.storage.estimate();
      const pct = quota ? Math.round((usage/quota)*100) : null;
      const color = pct>85 ? "var(--danger)" : (pct>60 ? "var(--flame)" : "var(--text-sub)");
      el.style.color = color;
      el.textContent = "💾 Espace total utilisé : "+formatBytes(usage)+(quota?" sur "+formatBytes(quota)+" disponibles ("+pct+"%)":"")+" — dont "+formatBytes(textBytes)+" de données texte (tâches, processus).";
    }catch(e){
      el.textContent = "💾 Données texte (tâches, processus) : "+formatBytes(textBytes)+". Espace total (avec pièces jointes) indisponible sur ce navigateur.";
    }
  } else {
    el.textContent = "💾 Données texte (tâches, processus) : "+formatBytes(textBytes)+". Ce navigateur ne permet pas de mesurer l'espace total (pièces jointes incluses).";
  }
}

function renderTabsBar(){
  const wrap = document.getElementById("tabsInner");
  wrap.innerHTML = "";

    const def = TAB_DEFS[id]; if(!def) return;
    const tab = document.createElement("div");
    tab.className = "tab" + (id===currentTab ? " active" : "");
    tab.dataset.tab = id;
    if(def.title) tab.title = def.title;
    tab.innerHTML = `<span class="tab-handle" style="cursor:grab;touch-action:none;padding:0 3px;opacity:.55;">⠿</span><span class="tab-label" style="display:inline-flex;align-items:center;">${def.icon || escapeHtml(def.label)}</span>`;
    tab.addEventListener("click", ()=>{
      if(tab.dataset.justDragged==="1"){ tab.dataset.justDragged=""; return; }
      currentTab = id;
      document.querySelectorAll(".tab").forEach(x=> x.classList.toggle("active", x===tab));
      renderMain();
    });
    const handle = tab.querySelector(".tab-handle");
    handle.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation();
      let dragOverTab = null;
      tab.style.opacity = "0.4";
      const move = (ev)=>{
        const tabs = Array.from(wrap.querySelectorAll(".tab"));
        dragOverTab = tabs.find(x=>{
          const r = x.getBoundingClientRect();
          return ev.clientX >= r.left && ev.clientX <= r.right;
        }) || null;
        tabs.forEach(x=> x.style.borderLeft = (x===dragOverTab && x!==tab) ? "2px solid var(--accent)" : "");
      };
      const up = ()=>{
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        tab.style.opacity = "";
        Array.from(wrap.querySelectorAll(".tab")).forEach(x=> x.style.borderLeft = "");
        if(dragOverTab && dragOverTab!==tab){
          const fromIdx = tabOrder.indexOf(id);
          const toIdx = tabOrder.indexOf(dragOverTab.dataset.tab);
          if(fromIdx>-1 && toIdx>-1){
            tabOrder.splice(fromIdx,1);
            tabOrder.splice(toIdx,0,id);
            localStorage.setItem("sensitache.tabOrder", JSON.stringify(tabOrder));
            tab.dataset.justDragged = "1";
            renderTabsBar();
          }
        }
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
    wrap.appendChild(tab);
  });
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function cleanupTaskAttachments(task){
  (task.attachments||[]).forEach(a=>{
    attachDeleteLocal(a.id);
    deleteAttachmentFromDrive(a.driveFileId);
  });
}
function purgeOldTrash(){
  if(!corbeilleRetentionDays || corbeilleRetentionDays<=0) return 0;
  const cutoff = Date.now() - corbeilleRetentionDays*24*60*60*1000;
  const toDelete = DATA.tasks.filter(t=> t.done && t.doneAt && t.doneAt < cutoff);
  if(toDelete.length===0) return 0;
  const idsToDelete = new Set(toDelete.map(t=>t.id));
  toDelete.forEach(t=>{ cleanupTaskAttachments(t); DATA.tombstones.tasks[t.id] = Date.now(); });
  DATA.tasks = DATA.tasks.filter(t=> !idsToDelete.has(t.id));
  cleanupLinkedShapeRefs(idsToDelete);
  return toDelete.length;
}
function cleanupLinkedShapeRefs(deletedIdsSet){
  DATA.tasks.forEach(t=>{
    if(t.process && t.process.shapes){
      t.process.shapes.forEach(s=>{ if(s.linkedTaskId && deletedIdsSet.has(s.linkedTaskId)) s.linkedTaskId = null; });
    }
  });
}
function wsTasks(){ return DATA.tasks.filter(t=>t.workspaceId===currentWsId); }
function activeTasks(){ return wsTasks().filter(t=>!t.done); }
function doneTasks(){ return wsTasks().filter(t=>t.done); }
function recurrenceNotDueYet(t){
  // true once a recurring task has just been checked off and is waiting for its next occurrence
  return !!(t.recurrence && t.recurrence.freq && t.recurrence.nextDue && !recurrenceIsDue(t));
}
function recurrenceIsDue(t){
  if(!t.recurrence || !t.recurrence.freq || !t.recurrence.nextDue) return false;
  const target = new Date(t.recurrence.nextDue+"T"+(t.recurrence.time||"00:00")+":00");
  return new Date() >= target;
}
function myVisibleTasks(){
  // "Ma liste de tâches" : uniquement mes tâches actives, hors Base de connaissances,
  // hors récurrences dont la prochaine échéance n'est pas encore arrivée,
  // et hors rappels dont la date n'est pas encore arrivée (le rappel agit comme un filtre, pas juste un tri)
  const today = todayStr();
  return activeTasks().filter(t=> !t.knowledge && (t.assignedTo||[]).includes(DATA.currentUserId) && !recurrenceNotDueYet(t) && !(t.reminderDate && t.reminderDate>today));
}
function recurringTasks(){ return activeTasks().filter(t=> t.recurrence && t.recurrence.freq); }
function sortCategory(t){
  const today = todayStr();
  if(t.reminderDate && t.reminderDate<=today) return 1;
  if(recurrenceIsDue(t)) return 2;
  if(t.followUp) return 7;
  if(t.today) return 3;
  if(t.urgent) return 4;
  if(t.quick) return 5;
  return 6;
}
const CATEGORY_LABEL = {1:"Rappel", 2:"Récurrence", 3:"Aujourd'hui", 4:"Urgent", 5:"Rapide", 6:"Non prioritaire", 7:"À suivre (sans action)"};
function addDays(dateStr, n){ const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return dateToStr(d); }
function addYears(dateStr, n){ const d=new Date(dateStr+"T00:00:00"); d.setFullYear(d.getFullYear()+n); return dateToStr(d); }
function nthWeekdayOfMonth(year, month, weekday, nth){
  nth = Number(nth);
  if(nth===-1){
    const d = new Date(year, month+1, 0); // last day of month
    while(d.getDay()!==weekday) d.setDate(d.getDate()-1);
    return d;
  }
  const first = new Date(year, month, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  const day = 1 + offset + (nth-1)*7;
  const d = new Date(year, month, day);
  if(d.getMonth()!==month) return null; // e.g. no 5th Monday this month
  return d;
}
function nextWeekdayOnOrAfter(dateStr, weekday){
  const d = new Date(dateStr+"T00:00:00");
  while(d.getDay()!==Number(weekday)) d.setDate(d.getDate()+1);
  return dateToStr(d);
}
function nextMonthlyOccurrenceOnOrAfter(dateStr, weekday, nth){
  const start = new Date(dateStr+"T00:00:00");
  let year=start.getFullYear(), month=start.getMonth();
  for(let i=0;i<24;i++){
    const candidate = nthWeekdayOfMonth(year, month, Number(weekday), nth);
    if(candidate && candidate.getTime()>=start.getTime()) return dateToStr(candidate);
    month++; if(month>11){ month=0; year++; }
  }
  return dateStr;
}
function advanceMonthlyByWeekday(currentDateStr, weekday, nth){
  const d = new Date(currentDateStr+"T00:00:00");
  let year=d.getFullYear(), month=d.getMonth();
  for(let i=0;i<24;i++){
    month++; if(month>11){ month=0; year++; }
    const candidate = nthWeekdayOfMonth(year, month, Number(weekday), nth);
    if(candidate) return dateToStr(candidate);
  }
  return currentDateStr;
}
function fixedDayOfMonth(year, month, mode){
  return mode==="first" ? new Date(year, month, 1) : new Date(year, month+1, 0);
}
function nextMonthlyFixedDayOnOrAfter(dateStr, mode){
  const start = new Date(dateStr+"T00:00:00");
  let year=start.getFullYear(), month=start.getMonth();
  for(let i=0;i<24;i++){
    const candidate = fixedDayOfMonth(year, month, mode);
    if(candidate.getTime()>=start.getTime()) return dateToStr(candidate);
    month++; if(month>11){ month=0; year++; }
  }
  return dateStr;
}
function advanceMonthlyFixedDay(currentDateStr, mode){
  const d = new Date(currentDateStr+"T00:00:00");
  let year=d.getFullYear(), month=d.getMonth()+1;
  if(month>11){ month=0; year++; }
  return dateToStr(fixedDayOfMonth(year, month, mode));
}
function computeInitialNextDue(r){
  const start = r.startDate || todayStr();
  if(r.freq==="weekly") return nextWeekdayOnOrAfter(start, r.weekday);
  if(r.freq==="monthly"){
    if(r.monthlyMode==="first"||r.monthlyMode==="last") return nextMonthlyFixedDayOnOrAfter(start, r.monthlyMode);
    return nextMonthlyOccurrenceOnOrAfter(start, r.weekday, r.weekOfMonth);
  }
  return start; // daily & yearly start right on the chosen date
}
function advanceRecurrence(r){
  const base = r.nextDue || r.startDate || todayStr();
  if(r.freq==="daily") return addDays(base,1);
  if(r.freq==="weekly") return addDays(base,7);
  if(r.freq==="monthly"){
    if(r.monthlyMode==="first"||r.monthlyMode==="last") return advanceMonthlyFixedDay(base, r.monthlyMode);
    return advanceMonthlyByWeekday(base, r.weekday, r.weekOfMonth);
  }
  if(r.freq==="yearly") return addYears(base,1);
  return base;
}
const FR_WEEKDAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const NTH_LABEL = {1:"1er",2:"2ème",3:"3ème",4:"4ème","-1":"dernier"};
function describeRecurrence(r){
  if(!r || !r.freq) return "";
  const at = r.time ? " à "+r.time : "";
  if(r.freq==="daily") return "Tous les jours"+at;
  if(r.freq==="weekly") return "Toutes les semaines, le "+FR_WEEKDAYS[r.weekday]+at;
  if(r.freq==="monthly"){
    if(r.monthlyMode==="first") return "Tous les mois, le 1er jour du mois"+at;
    if(r.monthlyMode==="last") return "Tous les mois, le dernier jour du mois"+at;
    return "Tous les mois, le "+NTH_LABEL[r.weekOfMonth]+" "+FR_WEEKDAYS[r.weekday]+at;
  }
  if(r.freq==="yearly"){
    const d = new Date((r.startDate||todayStr())+"T00:00:00");
    return "Tous les ans, le "+d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+at;
  }
  return "";
}

/* ---------- TASKS TAB ---------- */
function renderTasksTab(el){
  el.innerHTML = `<div id="taskGroups"></div>`;
  renderTasksGroupedList();
}
function renderTasksGroupedList(){
  const groupsEl = document.getElementById("taskGroups");
  const tasks = myVisibleTasks();
  if(tasks.length===0){
    groupsEl.className = "";
    groupsEl.innerHTML = "<div class=\"empty-hint\">Aucune tache active qui te soit affectee pour le moment. Regarde aussi l onglet Collaboration.</div>";
    return;
  }
  const buckets = {1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
  tasks.forEach(t=> buckets[sortCategory(t)].push(t));
  Object.keys(buckets).forEach(k=>{
    if(Number(k)===7){
      buckets[k].sort((a,b)=>{
        if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if(a.dueDate) return -1;
        if(b.dueDate) return 1;
        return (b.updatedAt||0)-(a.updatedAt||0);
      });
    } else {
      buckets[k].sort((a,b)=>{
        const ao=a.sortOrder, bo=b.sortOrder;
        if(ao!==undefined && bo!==undefined) return ao-bo;
        if(ao!==undefined) return -1;
        if(bo!==undefined) return 1;
        return (b.updatedAt||0)-(a.updatedAt||0);
      });
    }
  });

  if(isPhoneSize()){
    groupsEl.className = "";
    groupsEl.innerHTML = "";
    [3,7,4,1,2,5,6].forEach(cat=>{
      const list = buckets[cat];
      if(list.length===0) return;
      const label = document.createElement("div");
      label.className = "task-group-label"; label.textContent = CATEGORY_LABEL[cat];
      groupsEl.appendChild(label);
      list.forEach(t=> groupsEl.appendChild(renderTaskRow(t, cat===7 ? undefined : list)));
    });
  } else {
    groupsEl.className = "two-col-layout";
    groupsEl.innerHTML = `<div id="taskColLeft" class="task-col"></div><div id="taskColRight" class="task-col"></div>`;
    const left = document.getElementById("taskColLeft");
    const right = document.getElementById("taskColRight");
    function fillCol(container, cat, label, noDrag){
      const list = buckets[cat];
      if(list.length===0) return;
      if(label){
        const l = document.createElement("div");
        l.className = "task-group-label"; l.textContent = label;
        container.appendChild(l);
      }
      list.forEach(t=> container.appendChild(renderTaskRow(t, noDrag ? undefined : list)));
    }
    fillCol(left, 3, "Aujourd'hui");
    fillCol(left, 1, "Planifié");
    fillCol(left, 5, "Rapide");
    fillCol(right, 7, "À suivre (sans action)", true);
    fillCol(right, 4, "Urgences");
    fillCol(right, 2, "Récurrence");
    fillCol(right, 6, "Non prioritaire");
  }
}

function runTaskSearch(query){
  const groupsEl = document.getElementById("taskGroups");
  query = (query||"").trim().toLowerCase();
  if(!query){
    groupsEl.innerHTML = '<div class="empty-hint">Tape pour rechercher parmi toutes tes tâches de cet espace, y compris celles déjà archivées.</div>';
    return;
  }
  const results = wsTasks().filter(t=>
    (t.title||"").toLowerCase().includes(query) || (t.description||"").toLowerCase().includes(query)
  ).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  groupsEl.innerHTML = "";
  if(results.length===0){
    groupsEl.innerHTML = '<div class="empty-hint">Aucun résultat pour « '+escapeHtml(query)+' ».</div>';
    return;
  }

  label.className = "task-group-label";
  label.textContent = results.length+" résultat"+(results.length>1?"s":"");
  groupsEl.appendChild(label);
  results.forEach(t=> groupsEl.appendChild(renderSearchResultRow(t)));
}

function isDraftTaskEmpty(t){
  const hasTitle = t.title && t.title.trim();
  const hasDesc = t.description && t.description.trim();
  const hasFlags = t.today || t.urgent || t.quick || t.knowledge || t.followUp;
  const hasDates = t.reminderDate || t.dueDate;
  const hasRecur = !!t.recurrence;
  const hasSub = t.subtasks && t.subtasks.length>0;
  const hasAttach = t.attachments && t.attachments.length>0;
  const hasProcess = !!t.process;
  const assign = (t.assignedTo||[]).slice().sort();
  const defaultAssign = JSON.stringify(assign) === JSON.stringify([DATA.currentUserId]) || assign.length===0;
  return !hasTitle && !hasDesc && !hasFlags && !hasDates && !hasRecur && !hasSub && !hasAttach && !hasProcess && defaultAssign;
}
const PRIORITY_COLOR = {1:"var(--clock)", 2:"var(--recur)", 3:"var(--flame)", 4:"var(--urgent)", 5:"var(--clock)", 6:"rgba(255,255,255,.18)", 7:"var(--followup)"};
function renderTaskRow(t, bucketList, forCollabId){
  const row = document.createElement("div");
  row.className = "task-row";
  row.style.borderLeft = "4px solid " + PRIORITY_COLOR[sortCategory(t)];
  const today = todayStr();
  let badges = "";
  if(t.reminderDate) badges += `<span class="badge clock" title="Rappel : ${t.reminderDate}">${iconSvg("clock")}</span>`;
  if(t.recurrence) badges += `<span class="badge recur" title="Récurrence">${iconSvg("recur")}</span>`;
  if(t.today) badges += `<span class="badge flame" title="Aujourd'hui">${iconSvg("flame")}</span>`;
  if(t.urgent) badges += `<span class="badge urgent" title="Urgent">${iconSvg("target")}</span>`;
  if(t.quick) badges += `<span class="badge quick" title="Rapide">${iconSvg("bolt")}</span>`;

  if(t.attachments && t.attachments.length) badges += `<span class="badge attach" title="Documents joints">${t.attachments.length}📎</span>`;
  if(t.dueDate){
    const overdue = t.dueDate < todayStr();
    badges += `<span class="badge" style="background:${overdue?'rgba(224,85,95,.2)':'rgba(255,255,255,.08)'};color:${overdue?'#F0838C':'var(--text-sub)'};" title="Date butoir : ${t.dueDate}">${iconSvg("flag")} ${t.dueDate}</span>`;
  }
  const nextSub = forCollabId
    ? ((t.subtasks||[]).find(s=> !s.done && s.assignedTo===forCollabId) || nextUndoneSubtask(t))
    : nextUndoneSubtask(t);
  row.innerHTML = `
    ${bucketList ? '<span class="task-handle" style="cursor:grab;color:var(--text-sub);touch-action:none;padding:2px 4px;flex-shrink:0;">⠿</span>' : ''}

    <div class="task-title">${escapeHtml(t.title)}${nextSub ? ` <span class="subtask-inline" style="font-weight:400;color:var(--text-sub);font-size:12.5px;">— <span class="subtask-inline-check" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" style="pointer-events:none;">${escapeHtml(nextSub.text)}${nextSub.dueDate ? ` <span style="color:${(!nextSub.done && nextSub.dueDate<todayStr())?'var(--danger)':'var(--text-sub)'};">📅 ${formatSubDue(nextSub.dueDate)}</span>` : ""}</span></span>` : ""}</div>
    <div class="badges">${badges}</div>
  `;
  if(bucketList){
    const handle = row.querySelector(".task-handle");
    handle.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation();
      const parent = row.parentElement;
      let dragOverRow = null;
      row.style.opacity = "0.5";
      const move = (ev)=>{
        const rows = Array.from(parent.querySelectorAll(".task-row"));
        dragOverRow = rows.find(r=>{
          const rect = r.getBoundingClientRect();
          return ev.clientY >= rect.top && ev.clientY <= rect.bottom;
        }) || null;
        rows.forEach(r=> r.style.borderTop = (r===dragOverRow && r!==row) ? "2px solid var(--accent)" : "");
      };
      const up = ()=>{
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        document.removeEventListener("pointercancel", up);
        endDragSession();
        row.style.opacity = "";
        Array.from(parent.querySelectorAll(".task-row")).forEach(r=> r.style.borderTop = "");
        if(dragOverRow && dragOverRow!==row){
          const overId = dragOverRow.dataset.taskId;
          const fromIdx = bucketList.findIndex(x=>x.id===t.id);
          const toIdx = bucketList.findIndex(x=>x.id===overId);
          if(fromIdx>-1 && toIdx>-1){
            const [moved] = bucketList.splice(fromIdx,1);
            bucketList.splice(toIdx,0,moved);
            bucketList.forEach((x,i)=>{ x.sortOrder = i; x.updatedAt = Date.now(); });
            saveData(); renderMain();
          }
        }
      };
      startDragSession(up);
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    });
  }
  row.dataset.taskId = t.id;
  if(nextSub){
    row.querySelector(".subtask-inline-check").addEventListener("click", (e)=>{
      e.stopPropagation();
      nextSub.done = true; nextSub.doneAt = Date.now();
      t.updatedAt = Date.now(); saveData(); renderMain();
    });
  }
  row.querySelector("[data-check]").addEventListener("click", (e)=>{ e.stopPropagation(); toggleTaskDone(t); });
  row.addEventListener("click", ()=> openTaskDrawer(t.id));
  return row;
}
function toggleTaskDone(t){
  snapshot();
  if(!t.done && t.recurrence && t.recurrence.freq){
    // recurring task: log completion, reschedule instead of archiving
    t.recurrence.nextDue = advanceRecurrence(t.recurrence);
    t.recurrence.lastCompletedAt = Date.now();
    t.updatedAt = Date.now();
  } else {
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    t.updatedAt = Date.now();
  }
  saveData(); renderMain();
}

function buildCollabGroup(c, list, opts){

  </div>`;

function assigneeNamesForTask(t){

function wrapBullet(text, width){
  width = width || 78;
  const prefixFirst = "    · ";
  const prefixRest = "      ";
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  words.forEach(w=>{
    const test = current ? current + " " + w : w;
    if(current && (prefixRest.length + test.length) > width){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if(current) lines.push(current);
  if(lines.length===0) return "";
  return lines.map((l,i)=> (i===0?prefixFirst:prefixRest) + l).join("\n");
}
function buildCollabEmailText(opts){
  opts = opts || {};
  // onlyCollab : ne garder que les tâches et sous-tâches du collaborateur choisi.
  const onlyCid = opts.onlyCollab && opts.collabId ? opts.collabId : null;
  const frDate = d=> String(d).split("-").reverse().join("/");
  const entries = Array.from(collabEmailSelected).map(id=>{
    const cur = DATA.tasks.find(t=>t.id===id);
    if(cur) return {t:cur, status: cur.done ? "done" : "active"};
    if(collabMeetingSnapshots[id]) return {t:collabMeetingSnapshots[id], status:"deleted"};
    return null;
  }).filter(Boolean).filter(e=> !onlyCid || (e.t.assignedTo||[]).includes(onlyCid) || (e.t.subtasks||[]).some(s=> s.assignedTo===onlyCid));
  const groups = { p1: [], p2: [], p3: [] };
  entries.forEach(e=>{
    if(e.t.today) groups.p1.push(e);
    else if(e.t.urgent) groups.p2.push(e);
    else groups.p3.push(e);
  });
  // Mise en forme explicite : chaque information est étiquetée (Objet,
  // Affecté à, Dernier délai, Description, Sous-tâches) pour qu'on sache
  // toujours de quoi il s'agit et qui en est responsable.
  const wrapWith = (text, first, rest, width)=>{
    width = width || 78;
    const words = String(text).split(/\s+/).filter(Boolean);
    const out = []; let cur = "";
    words.forEach(w=>{
      const test = cur ? cur+" "+w : w;
      const pre = out.length ? rest : first;
      if(cur && (pre.length + test.length) > width){ out.push(cur); cur = w; }
      else cur = test;
    });
    if(cur) out.push(cur);
    return out.map((l,i)=> (i===0?first:rest)+l).join("\n");
  };
  const lineFor = ({t, status})=>{
    const names = assigneeNamesForTask(t).join(", ");
    const out = [];
    out.push(wrapWith("Objet : " + t.title, "- ", "  "));
    out.push("    Affecté à : " + (names || "non affecté"));
    if(status==="done") out.push("    Statut : ✅ terminée");
    else if(status==="deleted") out.push("    Statut : ❌ abandonnée");
    else if(t.dueDate) out.push("    Dernier délai : " + frDate(t.dueDate));
    if(t.description && t.description.trim()){
      out.push("    Description :");
      t.description.trim().split("\n").filter(l=>l.trim()!=="").forEach(l=> out.push(wrapWith(l.trim(), "      ", "      ")));
    }
    const subs = (t.subtasks||[]).filter(s=> !s.done || (collabMeetingStartedAt && s.doneAt && s.doneAt >= collabMeetingStartedAt))
      .filter(s=> !onlyCid || subtaskIsFor(s, t, onlyCid));
    if(subs.length){
      out.push("    Sous-tâches :");
      subs.forEach(s=>{
        const sc = s.assignedTo ? DATA.collaborators.find(c=>c.id===s.assignedTo) : null;
        out.push(wrapWith((s.done ? "✓ " : "") + s.text + (s.done ? " — fait" : ""), "      · ", "        "));
        if(!s.done){
          const meta = [];
          meta.push("Affecté à : " + (sc ? sc.name : (names || "non affecté")));
          if(s.dueDate) meta.push("Dernier délai : " + frDate(s.dueDate));
          out.push("        " + meta.join(" — "));
        }
      });
    }
    return out.join("\n");
  };
  const sections = [];
  if(groups.p1.length) sections.push("Priorité 1 :\n\n" + groups.p1.map(lineFor).join("\n\n"));
  if(groups.p2.length) sections.push("Priorité 2 :\n\n" + groups.p2.map(lineFor).join("\n\n"));
  if(groups.p3.length) sections.push("Priorité 3 :\n\n" + groups.p3.map(lineFor).join("\n\n"));
  const when = collabMeetingStartedAt ? " du " + new Date(collabMeetingStartedAt).toLocaleDateString("fr-FR") : "";
  const intro = "Bonjour,\n\nTu trouveras ci-dessous le compte rendu de notre échange"+when+" :\n\n";
  if(!sections.length) return intro + "(Aucune tâche de cette sélection ne concerne ce collaborateur.)";
  return intro + sections.join("\n\n");
}
// Collaborateurs concernés par la sélection de la réunion (hors « Moi »),
// du plus représenté au moins représenté.
function collabMeetingPeople(){
  const count = new Map();
  Array.from(collabEmailSelected).forEach(id=>{
    const t = DATA.tasks.find(x=>x.id===id) || collabMeetingSnapshots[id];
    if(!t) return;
    const ids = new Set(t.assignedTo||[]);
    (t.subtasks||[]).forEach(s=>{ if(s.assignedTo) ids.add(s.assignedTo); });
    ids.forEach(cid=>{ if(cid!==DATA.currentUserId) count.set(cid, (count.get(cid)||0)+1); });
  });
  return Array.from(count.entries()).sort((a,b)=> b[1]-a[1]).map(([cid])=> collabById(cid)).filter(Boolean);
}
// Une sous-tâche « appartient » au collaborateur si elle lui est affectée, ou
// si elle n'est affectée à personne et que la tâche est à lui.
function subtaskIsFor(s, t, cid){
  return s.assignedTo ? s.assignedTo===cid : (t.assignedTo||[]).includes(cid);
}
function buildCollabEmailSubject(opts){
  opts = opts || {};
  const day = collabMeetingStartedAt ? new Date(collabMeetingStartedAt) : new Date();
  const ds = dateToStr(day).split("-").reverse().join("/");
  const c = opts.collabId ? collabById(opts.collabId) : null;
  const theme = (collabEmailTheme||"").trim();
  return "Échange " + (c ? c.name : "équipe") + (theme ? " – " + theme : "") + " – " + ds;
}

/* ---------- RECURRENCE TAB ---------- */
function renderRecurrenceTab(el){
  const tasks = recurringTasks().sort((a,b)=> (a.recurrence.nextDue||"").localeCompare(b.recurrence.nextDue||""));
  if(tasks.length===0){ el.innerHTML = '<div class="empty-hint">Aucune tâche récurrente pour l’instant. Ouvre une tâche et règle le champ Récurrence.</div>'; return; }
  el.innerHTML = "";
  tasks.forEach(t=>{
    const due = recurrenceIsDue(t);
    const row = document.createElement("div");
    row.className = "task-row";
    row.innerHTML = `
      <div class="task-check" data-check title="${due ? "Marquer l’occurrence du jour comme faite" : "Pas encore due"}" style="${due?'':'opacity:.35;cursor:default;'}"></div>
      <span class="badge recur" title="Récurrence">${iconSvg("recur")}</span>
      <div class="task-title">${escapeHtml(t.title)}</div>
      <div class="badges">
        <span style="font-size:11px;color:${due?'var(--recur)':'var(--text-sub)'};font-weight:${due?'700':'400'};">${describeRecurrence(t.recurrence)} · prochaine le ${t.recurrence.nextDue}${t.recurrence.time?" à "+t.recurrence.time:""}</span>
      </div>
      <div class="assignee-chip" style="width:auto;">
        <div style="display:flex;align-items:center;">${assigneeAvatarsHtml(t)}</div>
      </div>
    `;
    row.querySelector("[data-check]").addEventListener("click", (e)=>{
      e.stopPropagation();
      if(due) toggleTaskDone(t);
    });
    row.addEventListener("click", ()=> openTaskDrawer(t.id));
    el.appendChild(row);
  });
}

/* ---------- TRAJECTOIRE TAB (timeline des tâches avec date limite) ---------- */
function formatDueDateFr(dateStr){
  const parts = String(dateStr||"").split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return dateStr||"";
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  return dt.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
let trajectoireFilterId = "all";
function renderTrajectoireTab(el){
  // Éléments de la frise : les tâches avec date butoir ET les sous-tâches
  // avec date limite (affectées à leur propre responsable, sinon à ceux de
  // la tâche). Tous restent visibles une fois cochés.
  const items = [];
  wsTasks().forEach(t=>{
    if(t.dueDate) items.push({kind:"task", t, date:t.dueDate, done:!!t.done, title:t.title, who:(t.assignedTo||[])});
    (t.subtasks||[]).forEach(sub=>{
      if(!sub.dueDate) return;
      items.push({kind:"sub", t, s:sub, date:sub.dueDate, done:!!sub.done, title:sub.text||"(sous-tâche sans titre)", who: sub.assignedTo ? [sub.assignedTo] : (t.assignedTo||[])});
    });
  });
  if(!items.length){
    el.innerHTML = '<div class="empty-hint">Aucune tâche ni sous-tâche avec une date limite pour le moment. Règle une date sur une tâche ou une sous-tâche pour la voir apparaître ici — elle y restera même une fois cochée comme terminée.</div>';
    return;
  }
  const people = DATA.collaborators.slice().sort((a,b)=> a.name.localeCompare(b.name));
  if(trajectoireFilterId!=="all" && !people.some(p=>p.id===trajectoireFilterId)) trajectoireFilterId = "all";

  el.innerHTML = "";
  const filterBar = document.createElement("div");
  filterBar.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin:2px 2px 14px;";
  el.appendChild(filterBar);
  const chipsData = [{id:"all", name:"Tous", color:"var(--accent)"}].concat(people);
  chipsData.forEach(p=>{
    const chip = document.createElement("div");
    const active = p.id===trajectoireFilterId;
    chip.style.cssText = `display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid ${active?'transparent':'var(--border-soft)'};background:${active? (p.color||'var(--accent)') : 'var(--bg-panel-2)'};color:${active?'#fff':'var(--text-sub)'};`;
    chip.textContent = p.name;
    chip.addEventListener("click", ()=>{ trajectoireFilterId = p.id; renderTrajectoireTab(el); });
    filterBar.appendChild(chip);
  });

  const shown = (trajectoireFilterId==="all" ? items : items.filter(it=> it.who.includes(trajectoireFilterId)))
    .slice().sort((a,b)=> a.date.localeCompare(b.date) || (a.kind===b.kind ? 0 : (a.kind==="task" ? -1 : 1)));

  if(!shown.length){
    const empty = document.createElement("div");
    empty.className = "empty-hint";
    empty.textContent = "Aucune tâche ni sous-tâche avec une date limite pour cette personne.";
    el.appendChild(empty);
    return;
  }

  const avatarsFor = ids=>{
    const cs = ids.map(id=> collabById(id)).filter(Boolean);
    if(!cs.length) return `<span class="avatar" style="background:#666">?</span>`;
    return cs.slice(0,3).map((c,i)=> `<span class="avatar" style="background:${c.color};${i>0?'margin-left:-7px;':''}border:2px solid var(--bg-card);" title="${escapeHtml(c.name)}">${escapeHtml(c.name.slice(0,2).toUpperCase())}</span>`).join("")
      + (cs.length===1 ? `<span style="font-size:11px;color:var(--text-sub);margin-left:6px;">${escapeHtml(cs[0].name)}</span>` : "");
  };

  const today = todayStr();
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:relative;padding-left:26px;margin:4px 2px;";
  wrap.innerHTML = '<div data-trajLine style="position:absolute;left:9px;top:2px;bottom:2px;width:2px;background:var(--border-soft);"></div><div data-trajList></div>';
  el.appendChild(wrap);
  const list = wrap.querySelector("[data-trajList]");
  let todayMarked = false;
  shown.forEach(it=>{
    if(!todayMarked && it.date >= today){
      todayMarked = true;
      const marker = document.createElement("div");
      marker.style.cssText = "position:relative;margin:2px 0 12px;font-size:11px;font-weight:700;color:var(--accent);";
      marker.innerHTML = '<div style="position:absolute;left:-26px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg-app);"></div>Aujourd\'hui';
      list.appendChild(marker);
    }
    const isSub = it.kind==="sub";
    const overdue = !it.done && it.date < today;
    const dotColor = it.done ? "var(--knowledge)" : (overdue ? "var(--danger)" : "var(--accent)");
    const row = document.createElement("div");
    row.style.cssText = "position:relative;padding:9px 12px;margin-bottom:10px;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-panel-2);cursor:pointer;"+(isSub?"margin-left:14px;border-style:dashed;":"");
    row.innerHTML = `
      <div style="position:absolute;left:${isSub?-40:-26}px;top:16px;width:${isSub?8:10}px;height:${isSub?8:10}px;border-radius:50%;background:${isSub?'var(--bg-app)':dotColor};border:${isSub?'2px solid '+dotColor:'none'};box-shadow:0 0 0 3px var(--bg-app);"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="min-width:0;">
          <div style="font-size:11px;font-weight:700;color:${overdue?'var(--danger)':'var(--text-sub)'};text-transform:capitalize;">${formatDueDateFr(it.date)}${overdue?' · en retard':''}</div>
          ${isSub ? `<div style="font-size:10.5px;color:var(--text-sub);margin-top:2px;">↳ Sous-tâche de « ${escapeHtml(it.t.title)} »</div>` : ""}
          <div style="font-size:${isSub?13:13.5}px;margin-top:2px;${it.done?'text-decoration:line-through;color:var(--text-sub);':''}">${escapeHtml(it.title)}</div>
          <div style="margin-top:5px;display:flex;align-items:center;">${avatarsFor(it.who)}</div>
        </div>
        <div class="task-check${it.done?' checked':''}" data-check style="flex-shrink:0;" title="${it.done?'Terminée — touche pour rouvrir':'Marquer comme terminée'}">${it.done?'✓':''}</div>
      </div>
    `;
    row.querySelector("[data-check]").addEventListener("click", (e)=>{
      e.stopPropagation();
      if(isSub){
        it.s.done = !it.s.done; it.s.doneAt = it.s.done ? Date.now() : null;
        it.t.updatedAt = Date.now(); saveData(); renderMain();
      } else toggleTaskDone(it.t);
    });
    row.addEventListener("click", ()=> openTaskDrawer(it.t.id));
    list.appendChild(row);
  });
}

========================================================= */
function openTaskDrawer(id){
  openTaskId = id;
  localStorage.setItem("sensitache.openTaskId", id);
  history.pushState({sensitacheModal:"drawer"}, "", location.href);
  const t = DATA.tasks.find(x=>x.id===id); if(!t) return;
  document.getElementById("overlayBg").classList.add("show");
  document.getElementById("drawer").classList.add("show");
  document.getElementById("taskTitleInput").value = t.title;
  document.getElementById("taskDescInput").value = t.description||"";
  renderTaskDescLinks(t);
  document.getElementById("chipToday").classList.toggle("on", !!t.today);
  document.getElementById("chipUrgent").classList.toggle("on", !!t.urgent);
  document.getElementById("chipQuick").classList.toggle("on", !!t.quick);
  document.getElementById("chipFollowUp").classList.toggle("on", !!t.followUp);
  document.getElementById("chipKnowledge").classList.toggle("on", !!t.knowledge);
  document.getElementById("reminderInput").value = t.reminderDate||"";
  document.getElementById("dueDateInput").value = t.dueDate||"";
  document.getElementById("recurFreq").value = t.recurrence ? t.recurrence.freq : "";
  document.getElementById("recurStartDate").value = t.recurrence ? (t.recurrence.startDate||"") : "";
  document.getElementById("recurTime").value = t.recurrence ? (t.recurrence.time||"09:00") : "";
  document.getElementById("recurWeekday").value = t.recurrence && t.recurrence.weekday!==undefined ? t.recurrence.weekday : new Date().getDay();
  document.getElementById("recurWeekOfMonth").value = t.recurrence && t.recurrence.weekOfMonth!==undefined ? t.recurrence.weekOfMonth : "1";
  document.getElementById("recurMonthlyMode").value = t.recurrence && t.recurrence.monthlyMode ? t.recurrence.monthlyMode : "weekday";
  updateRecurFieldVisibility(t.recurrence ? t.recurrence.freq : "", t.recurrence ? t.recurrence.monthlyMode : "weekday");
  updateRecurInfo(t);
  const meta = [];
  if(t.recurrence && t.recurrence.lastCompletedAt) meta.push("Dernière fois faite le "+new Date(t.recurrence.lastCompletedAt).toLocaleDateString("fr-FR"));
  document.getElementById("taskMeta").textContent = meta.join(" · ");

  renderAssignChips(t);

  renderAttachList(t);
  renderSubtaskList(t);
  renderProcessLinkRow(t);
  document.getElementById("drawer").classList.remove("fullscreen");
  setFullscreenIcon(false);
  removeInlineProcessPreview();
}
function closeDrawer(){
  const t = curTask();
  if(t && t.isDraft){
    if(isDraftTaskEmpty(t)){
      DATA.tasks = DATA.tasks.filter(x=>x.id!==t.id);
      DATA.tombstones.tasks[t.id] = Date.now();
      saveData();
    } else {
      delete t.isDraft;
      if(!t.assignedTo || t.assignedTo.length===0){ t.assignedTo = [DATA.currentUserId]; }
      t.updatedAt = Date.now(); saveData();
    }
  } else if(t && (!t.assignedTo || t.assignedTo.length===0)){ t.assignedTo = [DATA.currentUserId]; t.updatedAt = Date.now(); saveData(); }
  document.getElementById("overlayBg").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawer").classList.remove("fullscreen");
  removeInlineProcessPreview();
  openTaskId = null;
  localStorage.removeItem("sensitache.openTaskId");
  if(history.state && history.state.sensitacheModal==="drawer"){ suppressNextPopstate = true; history.back(); }
  renderMain();
}
function removeInlineProcessPreview(){
  const ex = document.getElementById("inlineProcessPreview");
  if(ex) ex.remove();
}

function renderInlineProcessPreview(t){
  removeInlineProcessPreview();
  if(!t || !t.process || !t.process.shapes || t.process.shapes.length===0) return;
  const shapes = t.process.shapes;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  shapes.forEach(s=>{ minX=Math.min(minX,s.x); minY=Math.min(minY,s.y); maxX=Math.max(maxX,s.x+s.w); maxY=Math.max(maxY,s.y+s.h); });
  const pad=30, bw=(maxX-minX)+pad*2, bh=(maxY-minY)+pad*2;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox", (minX-pad)+" "+(minY-pad)+" "+bw+" "+bh);
  const colorMap = {positive:"#1FA971", negative:"#E07B39", neutral:"#9A9DA8"};
  (t.process.arrows||[]).forEach(arrow=>{
    const fs = shapes.find(s=>s.id===arrow.from.shapeId), ts = shapes.find(s=>s.id===arrow.to.shapeId);
    if(!fs||!ts) return;
    const p0 = procAnchorPoint(fs, arrow.from.side), p1 = procAnchorPoint(ts, arrow.to.side);
    const pts = procRouteOrthogonal(p0, procSideDir[arrow.from.side], p1, procSideDir[arrow.to.side]);
    const path = document.createElementNS(svgNS,"path");
    path.setAttribute("d", procPointsToPath(pts));
    path.setAttribute("fill","none");
    path.setAttribute("stroke", colorMap[arrow.kind||"neutral"]);
    path.setAttribute("stroke-width","2");
    svg.appendChild(path);
  });
  shapes.forEach(s=>{
    const g = document.createElementNS(svgNS,"g");
    if(s.type==="rect"){
      const rect = document.createElementNS(svgNS,"rect");
      rect.setAttribute("x",s.x); rect.setAttribute("y",s.y); rect.setAttribute("width",s.w); rect.setAttribute("height",s.h);
      rect.setAttribute("rx","8"); rect.setAttribute("fill", s.color||"#FFD966"); rect.setAttribute("stroke","rgba(0,0,0,.25)"); rect.setAttribute("stroke-width","1.5");
      g.appendChild(rect);
    } else {
      const cx=s.x+s.w/2, cy=s.y+s.h/2;
      const poly = document.createElementNS(svgNS,"polygon");
      poly.setAttribute("points", cx+","+s.y+" "+(s.x+s.w)+","+cy+" "+cx+","+(s.y+s.h)+" "+s.x+","+cy);
      poly.setAttribute("fill", s.color||"#FFD966"); poly.setAttribute("stroke","rgba(0,0,0,.25)"); poly.setAttribute("stroke-width","1.5");
      g.appendChild(poly);
    }
    const fo = document.createElementNS(svgNS,"foreignObject");
    fo.setAttribute("x", s.x+8); fo.setAttribute("y", s.y+6); fo.setAttribute("width", Math.max(0,s.w-16)); fo.setAttribute("height", Math.max(0,s.h-12));
    const div = document.createElement("div");
    div.setAttribute("xmlns","http://www.w3.org/1999/xhtml");
    div.style.cssText = "font-size:11px;color:#1B1D23;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;overflow:hidden;";
    div.innerHTML = s.content||"";
    fo.appendChild(div);
    g.appendChild(fo);
    svg.appendChild(g);
  });
  const wrap = document.createElement("div");
  wrap.id = "inlineProcessPreview";
  wrap.appendChild(svg);
  const label = document.createElement("div");
  label.className = "ipp-label";
  label.textContent = "🧩 " + (t.process.name||"Processus") + " — cliquer pour ouvrir";
  wrap.appendChild(label);
  wrap.addEventListener("click", ()=> openProcessEditor(t));
  document.getElementById("taskDescInput").insertAdjacentElement("afterend", wrap);
}

/* ---------- ATTACHMENTS ---------- */
function detectAttachType(name){
  const ext = (name.split(".").pop()||"").toLowerCase();
  if(["eml","msg"].includes(ext)) return "email";
  if(["jpg","jpeg","png","gif","webp","svg"].includes(ext)) return "image";
  if(ext==="pdf") return "pdf";
  if(["html","htm"].includes(ext)) return "app";
  return "other";
}
/* Photos from a phone camera are often 3-8 Mo — far too heavy to pile up in
   the ~5-10 Mo localStorage quota shared by the whole app. Automatically
   resizing and re-compressing to a reasonable size (typically 10-20x
   smaller) fixes the root cause instead of just warning about it. */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.8;
  return new Promise((resolve)=>{
    if(file.type==="image/svg+xml"){ // vector, nothing to gain from rasterizing — keep as-is
      const r = new FileReader(); r.onload = ()=> resolve(r.result); r.onerror = ()=> resolve(null); r.readAsDataURL(file); return;
    }
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width, height} = img;
      if(width>maxDim || height>maxDim){
        if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
        else{ width = Math.round(width*maxDim/height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objUrl);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objUrl); resolve(null); };
    img.src = objUrl;
  });
}
function estimateDataUrlBytes(dataUrl){
  const i = dataUrl.indexOf("base64,");
  const b64 = i>=0 ? dataUrl.slice(i+7) : "";
  return Math.round(b64.length*0.75);
}
function formatBytes(n){
  if(n < 1024*1024) return Math.round(n/1024)+" Ko";
  return (n/(1024*1024)).toFixed(1)+" Mo";
}

/* =========================================================================
   ATTACHMENT STORAGE — IndexedDB instead of localStorage
   localStorage tops out around 5-10 Mo for the WHOLE app, shared with every
   task, process and backup. Photos/PDFs alone can blow through that in a
   few dozen tasks. IndexedDB has a much larger quota (typically hundreds of
   Mo or more, tied to actual free disk space rather than a small fixed
   cap), so the actual file content lives there — the task itself only
   keeps a lightweight {id, name, type, driveFileId} reference, which is
   what actually gets saved to localStorage/Drive/backups. Each file is
   also uploaded to Drive as its own file so it survives even if this
   browser's IndexedDB is ever cleared, and so other devices can fetch it
   on demand. ---------------------------------------------------------- */
const ATTACH_DB_NAME = "sensitache-files";
const ATTACH_STORE = "attachments";
function attachDbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(ATTACH_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(ATTACH_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function attachPut(id, dataUrl){
  try{
    const db = await attachDbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(ATTACH_STORE,"readwrite");
      tx.objectStore(ATTACH_STORE).put(dataUrl, id);
      tx.oncomplete = ()=>resolve(true); tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.warn("IndexedDB indisponible pour stocker la pièce jointe :", e); return false; }
}
async function attachGetLocal(id){
  try{
    const db = await attachDbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(ATTACH_STORE,"readonly");
      const req = tx.objectStore(ATTACH_STORE).get(id);
      req.onsuccess = ()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function attachDeleteLocal(id){
  try{
    const db = await attachDbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(ATTACH_STORE,"readwrite");
      tx.objectStore(ATTACH_STORE).delete(id);
      tx.oncomplete = ()=>resolve(); tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* non-critical */ }
}
async function blobToDataUrl(blob){
  return new Promise(resolve=>{
    const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>resolve(null); r.readAsDataURL(blob);
  });
}
async function uploadAttachmentToDrive(attMeta, dataUrl, task){
  if(!(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry)) return;
  try{
    const token = await driveGetToken();
    const blob = await (await fetch(dataUrl)).blob();
    const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
      method:"POST", headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify({name:"sensitache-attachment-"+attMeta.id+"-"+attMeta.name})
    });
    const created = await createRes.json();
    if(!created.id) return;
    await fetch("https://www.googleapis.com/upload/drive/v3/files/"+created.id+"?uploadType=media", {
      method:"PATCH", headers:{Authorization:"Bearer "+token, "Content-Type": blob.type||"application/octet-stream"},
      body: blob
    });
    attMeta.driveFileId = created.id;
    if(task) task.updatedAt = Date.now();
    saveData();
  }catch(e){ console.warn("Échec de l'envoi de la pièce jointe vers Drive :", e); }
}
async function deleteAttachmentFromDrive(driveFileId){
  if(!driveFileId || !(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry)) return;
  try{
    const token = await driveGetToken();
    await fetch("https://www.googleapis.com/drive/v3/files/"+driveFileId, {method:"DELETE", headers:{Authorization:"Bearer "+token}});
  }catch(e){ /* non-critical */ }
}
/* Resolve an attachment's actual content: local IndexedDB cache first (instant),
   falling back to downloading it from Drive if it's not on this device yet
   (e.g. added from another device), caching it locally once fetched. */
async function getAttachmentDataUrl(a){
  if(a.dataUrl) return a.dataUrl; // legacy attachments saved before this change — content is already inline
  const cached = await attachGetLocal(a.id);
  if(cached) return cached;
  if(a.driveFileId && driveClientId && driveAccessToken && Date.now() < driveTokenExpiry){
    try{
      const token = await driveGetToken();
      const res = await fetch("https://www.googleapis.com/drive/v3/files/"+a.driveFileId+"?alt=media", {headers:{Authorization:"Bearer "+token}});
      if(res.ok){
        const blob = await res.blob();
        const dataUrl = await blobToDataUrl(blob);
        if(dataUrl) attachPut(a.id, dataUrl);
        return dataUrl;
      }
    }catch(e){ /* fall through to null below */ }
  }
  return null;
}
document.getElementById("btnAddAttach").addEventListener("click", ()=> document.getElementById("attachInput").click());
document.getElementById("attachInput").addEventListener("change", (e)=>{
  const t = curTask(); if(!t) return;
  const files = Array.from(e.target.files);
  let remaining = files.length;
  if(remaining===0) return;
  files.forEach(async file=>{
    let dataUrl;
    if(file.type.startsWith("image/")){
      dataUrl = await compressImageFile(file);
    }
    if(!dataUrl){
      // not an image, or compression failed — fall back to the raw file,
      // but warn first if it's large since we can't shrink a PDF/email here
      if(file.size > 3*1024*1024 && !confirm("« "+file.name+" » fait "+formatBytes(file.size)+" — c'est assez volumineux. L'ajouter quand même ?")){
        remaining--;
        if(remaining===0) { saveData(); renderAttachList(t); }
        return;
      }
      dataUrl = await new Promise(resolve=>{
        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>resolve(null); r.readAsDataURL(file);
      });
    }
    if(dataUrl){
      const attMeta = {id:uid("att"), name:file.name, type:detectAttachType(file.name), driveFileId:null};
      await attachPut(attMeta.id, dataUrl); // real content -> IndexedDB (large quota)
      t.attachments.push(attMeta); // only this small reference -> localStorage/Drive sync
      t.updatedAt = Date.now();
      uploadAttachmentToDrive(attMeta, dataUrl, t); // fire-and-forget copy on Drive too
    }
    remaining--;
    if(remaining===0){ saveData(); renderAttachList(t); }
  });
  e.target.value="";
});
