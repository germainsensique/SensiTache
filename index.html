/* =========================================================================
   MAIL — READ-ONLY, VOICE READING (Microsoft 365 / Outlook / Exchange)
   Reads each email's from/to/cc, subject and body aloud via the browser's
   built-in speech synthesis, with the signature/quoted-thread trimmed off,
   then offers to dictate a reply (using the phone's own keyboard
   microphone — nothing built here does speech-to-text) and save it
   straight into a task.
========================================================================= */
// Cuts off the signature block and any quoted earlier thread, so only the
// actual new message content gets read aloud / attached to a task.
const MAIL_HEADER_LINE_RE = /^(De|From|Envoyé|Sent|Date|À|A|To|Cc|Objet|Subject)\s*:\s*(.*)$/i;
// ---------- Nettoyage d'un message : citations + signatures ----------
// Formules de politesse qui ouvrent une signature (ligne seule, courte).
const MAIL_SIGNOFF_RE = /^(cordialement|bien cordialement|tr[eè]s cordialement|cdlt|bien [àa] (vous|toi)|bien [àa] vous tous|sinc[eè]rement|salutations|meilleures salutations|salutations distingu[ée]es|bonne (journ[ée]e|soir[ée]e|fin de journ[ée]e|semaine|fin de semaine|continuation)|belle (journ[ée]e|soir[ée]e)|merci( beaucoup| encore| d'avance| par avance| [àa] (toi|vous))?|a\+|@\+|a bient[ôo]t|amicalement|bises|regards|best regards|kind regards|best|thanks( and regards)?|thank you|many thanks|cheers)\s*[,.!]*\s*$/i;
// Lignes de "bruit" typiques d'une signature ou d'un pied de mail, à retirer où qu'elles soient.
const MAIL_NOISE_LINE_RES = [
  /^\[?cid:[^\]]*\]?$/i,                                   // images intégrées [cid:image001.png@...]
  /^<?image\d*\.(png|jpe?g|gif)>?$/i,
  /^\[(https?:\/\/|mailto:)[^\]]*\]$/i,                      // liens entre crochets laissés par Outlook
  /^(https?:\/\/|www\.)\S+$/i,                               // URL seule
  /^(mailto:)?[\w.+-]+@[\w-]+\.[\w.-]+$/i,                   // adresse mail seule
  /^(t[ée]l(\.|[ée]phone)?|tel|mob(ile)?|portable|port\.?|gsm|fax|phone|cell|direct|standard|office|m|t|p|f)\s*[.:]?\s*[+(\d][\d\s().+-]{6,}$/i,
  /^[+(]?\d[\d\s().-]{8,}\d$/,                               // numéro de téléphone seul
  /^envoy[ée] (de|depuis|à partir de) (mon|ma|votre|outlook|nine|gmail|yahoo|l'application)/i,
  /^(sent from|get outlook for|obtenir outlook pour|t[ée]l[ée]charger outlook)/i,
  /^(pensez|merci de penser|please consider|think) .*(environnement|imprimer|print|environment)/i,
  /^(suivez-nous|follow us|retrouvez-nous|rejoignez-nous)/i,
  /^(linkedin|twitter|facebook|instagram|youtube)\b/i
];
// Début d'un avertissement légal/confidentialité : tout ce qui suit est coupé.
const MAIL_DISCLAIMER_RE = /(ce (message|courriel|mail|e-?mail)( et (toutes )?(les|ses) pi[eè]ces jointes)? (est|sont|peut|contient|pourrait)|this (e-?mail|message|communication)( and any (attachments?|files))? (is|are|may|contains)|confidentiel(le)?s? et (sont |est )?(destin|[ée]tabli)|strictly confidential|intended (only|solely) for|if you (are not|have received) th|si vous (avez re[çc]u|n'[êe]tes pas le destinataire)|disclaimer|avis de confidentialit[ée]|mention l[ée]gale)/i;
// Indices qu'une ligne fait partie d'un bloc de coordonnées.
const MAIL_SIG_HINT_RE = /(\+33|\+\d{2}\s?\d|\b0[1-9]([\s.]?\d{2}){4}\b|@[\w-]+\.\w|https?:\/\/|www\.|\b\d{5}\s+[A-ZÉÈ][\w-]+|\b(rue|avenue|av\.|boulevard|bd|chemin|all[ée]e|place|cedex|bp)\b|\b(directeur|directrice|responsable|manager|chef de|charg[ée]e? d|assistante?|ing[ée]nieur|consultant|pr[ée]sident|g[ée]rant|coordinat|technicien|commercial|comptable|d[ée]l[ée]gu[ée]|head of|director|officer)\b|\b(sas|sarl|s\.a\.|sa|gmbh|ltd|inc|group[e]?)\b)/i;
function mailLooksLikeSignatureBlock(lines){
  const nonEmpty = lines.map(l=>l.trim()).filter(Boolean);
  if(!nonEmpty.length) return true;
  if(nonEmpty.length > 14) return false;               // trop long pour une signature
  if(nonEmpty.some(l=> l.length > 110)) return false;  // une vraie phrase de contenu
  // Un vrai contenu contient des phrases qui se terminent par . ? ! sur des lignes longues.
  const proseLines = nonEmpty.filter(l=> l.length > 60 && /[.?!]$/.test(l));
  return proseLines.length === 0;
}
function cleanMessageLines(lines){
  lines = lines.map(l=> l.replace(/ /g," "));
  // Séparateurs visuels ("_____", "-----", "=====").
  lines = lines.filter(l=> !/^\s*([_=*~-])\1{4,}\s*$/.test(l));
  // Lignes d'intro de citation "Le X a écrit :" / "On X wrote:".
  lines = lines.filter(l=> !/^le .+ a [ée]crit\s*:?\s*$/i.test(l.trim()) && !/^on .+ wrote:\s*$/i.test(l.trim()));
  // Dé-citation des "> " pour lire la conversation comme de la prose.
  lines = lines.map(l=> l.replace(/^(\s*>)+\s?/, ""));
  // Bruit (images, URL seules, téléphones, "Envoyé depuis mon iPhone"...).
  lines = lines.filter(l=>{ const t = l.trim(); return !t || !MAIL_NOISE_LINE_RES.some(re=> re.test(t)); });

  // Avertissement légal : on coupe tout à partir de là (s'il est dans la 2e moitié).
  for(let k=0; k<lines.length; k++){
    if(MAIL_DISCLAIMER_RE.test(lines[k]) && k >= Math.floor(lines.length*0.3)){ lines = lines.slice(0,k); break; }
  }
  while(lines.length && lines[lines.length-1].trim()==="") lines.pop();

  // Délimiteur de signature standard "-- ".
  const dashIdx = lines.findIndex(l=> /^--\s*$/.test(l));
  if(dashIdx > 0) lines = lines.slice(0, dashIdx);

  // Formule de politesse suivie d'un bloc qui ressemble à une signature :
  // on coupe à partir de la formule (nom, fonction, société, adresse...).
  // On cherche la dernière formule dans les ~20 dernières lignes.
  const searchFrom = Math.max(0, lines.length-20);
  for(let k=lines.length-1; k>=searchFrom; k--){
    const t = lines[k].trim();
    if(t && MAIL_SIGNOFF_RE.test(t) && mailLooksLikeSignatureBlock(lines.slice(k+1))){
      // "Merci" seul en toute fin sans rien après : on le garde (c'est du contenu),
      // sauf s'il est suivi d'un nom/bloc.
      const after = lines.slice(k+1).filter(l=> l.trim());
      if(/^merci/i.test(t) && after.length===0) break;
      lines = lines.slice(0,k);
      break;
    }
  }
  while(lines.length && lines[lines.length-1].trim()==="") lines.pop();

  // Pas de formule mais un bloc de coordonnées en fin (nom / fonction /
  // société / adresse / tél) : on remonte depuis la fin tant que les lignes
  // sont courtes et sans phrase, et on coupe si on y trouve des coordonnées.
  let k = lines.length-1, hints = 0, start = lines.length;
  while(k >= 0 && lines.length-k <= 10){
    const t = lines[k].trim();
    if(t){
      if(t.length > 70 || /[.?!:]$/.test(t) && t.length > 35) break;
      if(MAIL_SIG_HINT_RE.test(t)) hints++;
    }
    start = k; k--;
  }
  // Il faut du contenu avant, et au moins 1 indice de coordonnées dans le bloc.
  const blockLines = lines.slice(start).filter(l=> l.trim()).length;
  if(hints >= 1 && blockLines >= 2 && start > 0 && lines.slice(0,start).some(l=> l.trim())){
    // Si juste au-dessus du bloc il y a un prénom/nom seul (1-3 mots), il part avec.
    lines = lines.slice(0, start);
  }
  while(lines.length && lines[lines.length-1].trim()==="") lines.pop();
  // Nom seul en toute dernière ligne après une phrase (ex. "Brigitte") : c'est la signature.
  if(lines.length >= 2){
    const last = lines[lines.length-1].trim();
    if(/^[A-ZÉÈÀÂÎÔÛÇ][\wÀ-ÿ'-]+(\s+[A-ZÉÈÀÂÎÔÛÇ][\wÀ-ÿ'-]+){0,2}\.?$/.test(last) && last.length <= 30){
      lines = lines.slice(0,-1);
      while(lines.length && lines[lines.length-1].trim()==="") lines.pop();
      // ...et la formule juste au-dessus, s'il y en a une.
      if(lines.length && MAIL_SIGNOFF_RE.test(lines[lines.length-1].trim()) && !/^merci/i.test(lines[lines.length-1].trim())) lines = lines.slice(0,-1);
    }
  }

  return lines.join("\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
// Version "texte aplati" : chaque message du fil est nettoyé séparément
// (donc chaque signature intermédiaire est retirée, pas seulement la dernière),
// puis on les remet bout à bout.
function stripEmailSignature(text){
  if(!text) return "";
  return splitMailThreadMessages(text, "").map(m=> m.body).filter(Boolean).join("\n\n");
}
// Découpe un fil de mails (forward Outlook/Nine avec plusieurs messages
// chaînés par des blocs "De :/Envoyé :/Objet :" ou des lignes "Le X a
// écrit :") en messages individuels {from, date, body}, du plus récent
// (en tête) au plus ancien — pour compter les messages et permettre d'en
// choisir un précis à écouter, plutôt qu'un seul bloc de texte aplati.
function splitMailThreadMessages(rawBody, topFrom){
  const text = String(rawBody||"").replace(/\r\n/g,"\n");
  if(!text.trim()) return [{from:topFrom||"", date:"", body:""}];
  const lines = text.split("\n");
  const leWroteRe = /^le (.+) a écrit\s*:?\s*$/i;
  const onWroteRe = /^on (.+) wrote:\s*$/i;
  const sepRe = /^_{5,}$|^-{5,}$/;

  const boundaries = []; // {headerLine, contentStart, from, date}
  let i = 0;
  while(i < lines.length){
    const trimmed = lines[i].trim();
    if(sepRe.test(trimmed)){ i++; continue; }
    if(MAIL_HEADER_LINE_RE.test(trimmed)){
      const headerLine = i;
      let from="", date="";
      while(i<lines.length && MAIL_HEADER_LINE_RE.test(lines[i].trim())){
        const hm = lines[i].trim().match(MAIL_HEADER_LINE_RE);
        const field = hm[1].toLowerCase();
        const val = hm[2].trim();
        if(field==="de"||field==="from") from = mailDisplayName(val) || val;
        else if(field==="envoyé"||field==="sent"||field==="date") date = val;
        i++;
      }
      boundaries.push({headerLine, contentStart:i, from, date});
      continue;
    }
    const leM = trimmed.match(leWroteRe) || trimmed.match(onWroteRe);
    if(leM){
      boundaries.push({headerLine:i, contentStart:i+1, from: leM[1].trim(), date:""});
      i++;
      continue;
    }
    i++;
  }

  if(boundaries.length===0){
    return [{from:topFrom||"", date:"", body:cleanMessageLines(lines)}];
  }

  const segs = [];
  const firstBody = cleanMessageLines(lines.slice(0, boundaries[0].headerLine));
  if(firstBody) segs.push({from:topFrom||"", date:"", body:firstBody});
  for(let b=0; b<boundaries.length; b++){
    const start = boundaries[b].contentStart;
    const end = (b+1<boundaries.length) ? boundaries[b+1].headerLine : lines.length;
    const body = cleanMessageLines(lines.slice(start, end));
    if(body || boundaries[b].from) segs.push({from: boundaries[b].from, date: boundaries[b].date, body});
  }
  return segs.length ? segs : [{from:topFrom||"", date:"", body:cleanMessageLines(lines)}];
}
function cleanMailSubject(subject){
  // Ce compte ne reçoit que des mails transférés — enlève le "Tr :"/"Fwd:"
  // que Nine ajoute, pour ne lire/afficher que le vrai objet du message.
  if(!subject) return subject;
  let s = subject.trim();
  const prefixRe = /^(tr|trans|transfert|fwd?|re)\s*:\s*/i;
  let prev;
  do{ prev = s; s = s.replace(prefixRe, "").trim(); }while(s !== prev && s);
  return s || subject.trim();
}
function mailDisplayName(headerValue){
  // "Jean Dupont <jean@x.com>" → "Jean Dupont" ; falls back to the raw value.
  if(!headerValue) return "";
  const m = headerValue.match(/^"?([^"<]+)"?\s*<[^>]+>/);
  return m ? m[1].trim() : headerValue.trim();
}
/* Microsoft Graph (Exchange Online / Outlook / Microsoft 365) — normalized
   to a {from,to,cc,subject,body,unread,source} shape for the list/listen/
   reply/save-as-task UI below. */
function msalEnsureInstance(){
  if(!window.msal){
    throw new Error("La librairie Microsoft ne s'est pas chargée (connexion internet ? bloqueur de scripts ?).");
  }
  if(!msalClientId){
    throw new Error("Renseigne d'abord ton identifiant client Azure.");
  }
  if(!msalInstance || msalInstance.__clientId !== msalClientId){
    msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: msalClientId,
        authority: "https://login.microsoftonline.com/common",
        redirectUri: window.location.origin + window.location.pathname
      }
    });
    msalInstance.__clientId = msalClientId;
  }
  return msalInstance;
}
async function msalRequestToken(){
  const inst = msalEnsureInstance();
  if(inst.initialize) await inst.initialize();
  let resp;
  try{
    resp = await inst.loginPopup({ scopes:["Mail.Read"] });
  }catch(e){
    // Already signed in on a previous visit — try a silent refresh before
    // giving up and asking to sign in again.
    const accounts = inst.getAllAccounts();
    if(accounts.length){
      resp = await inst.acquireTokenSilent({ scopes:["Mail.Read"], account: accounts[0] });
    } else {
      throw e;
    }
  }
  msGraphToken = resp.accessToken;
  msTokenExpiry = resp.expiresOn ? resp.expiresOn.getTime() - 60000 : (Date.now() + 3000*1000);
  return msGraphToken;
}
function msIsConnected(){ return !!(msGraphToken && Date.now() < msTokenExpiry); }
function msDisplayName(recipient){
  if(!recipient || !recipient.emailAddress) return "";
  return recipient.emailAddress.name || recipient.emailAddress.address || "";
}
async function msFetchRecent(count){
  const url = "https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages"
    + "?$top="+(count||10)+"&$orderby=receivedDateTime desc"
    + "&$select=subject,from,toRecipients,ccRecipients,body,isRead,receivedDateTime";
  const res = await fetch(url, {headers:{Authorization:"Bearer "+msGraphToken}});
  if(!res.ok) throw new Error("Impossible de lister les mails Outlook ("+res.status+").");
  const data = await res.json();
  return (data.value||[]).map(m=>{
    const bodyRaw = m.body ? m.body.content : "";
    const isHtml = m.body && m.body.contentType==="html";
    const bodyText = isHtml ? htmlToTextKeepLinks(bodyRaw) : bodyRaw;
    return {
      id: "ms_"+m.id,
      source: "outlook",
      from: msDisplayName(m.from),
      to: (m.toRecipients||[]).map(msDisplayName).filter(Boolean).join(", "),
      cc: (m.ccRecipients||[]).map(msDisplayName).filter(Boolean).join(", "),
      subject: m.subject || "(sans objet)",
      date: m.receivedDateTime,
      unread: !m.isRead,
      body: stripEmailSignature(bodyText),
      links: extractLinks(bodyText, isHtml ? bodyRaw : ""),
      threadMessages: splitMailThreadMessages(bodyText, msDisplayName(m.from))
    };
  });
}

  "google français","google francais","ines","inès","fr-fr-x-fra","fr-fr-x-frc","fr-fr-x-vlf"];
const MALE_VOICE_HINTS = ["henri","paul","thomas","nicolas","rémi","remi","alain","claude","jérôme","jerome","yves",
  "maurice","antoine","jean","fabrice","gérard","gerard","daniel","alexandre","lucien","sébastien","sebastien",

function mailVoiceText(v){ return ((v.name||"")+" "+(v.voiceURI||"")).toLowerCase(); }

function mailVoiceScore(v){

// Liste proposée : français de France uniquement, sans les voix identifiées

function mailAllowedVoices(){
  const voices = mailVoicesCache.length ? mailVoicesCache : mailRefreshVoices();
  let list = voices.filter(v=> mailIsFrFr(v) && !mailIsMaleVoice(v));
  if(!list.length) list = voices.filter(mailIsFrFr);
  return list.slice().sort((a,b)=> mailVoiceScore(b)-mailVoiceScore(a));

function mailPickDefaultVoice(){
  const allowed = mailAllowedVoices();

let mailCurrentUtterance = null;
let mailSpeakKeepAlive = null;
let mailSpeakGeneration = 0;
function mailClearKeepAlive(){
  if(mailSpeakKeepAlive){ clearInterval(mailSpeakKeepAlive); mailSpeakKeepAlive = null; }
}
// Le moteur de synthèse vocale d'Android refuse tout net (erreur
// "synthesis-failed", sans le moindre son) au-delà d'une certaine longueur
// de texte par appel — ça correspond bien au cas signalé : "Tester la voix"
// (texte court) marche, "Écouter" un mail (texte souvent long, surtout un
// fil de conversation lu en entier) échoue. On découpe donc le texte en
// morceaux raisonnables, coupés sur des fins de phrase, et on les enchaîne.
// Petits morceaux (quelques phrases) : c'est ce qui marche le plus
// sûrement sur Android, et ça évite aussi le bug de Chrome qui coupe une
// lecture longue au bout de ~15s — sans avoir besoin de l'astuce
// pause()/resume(), qui sur Android ARRÊTE carrément la lecture (c'était la
// cause de la coupure entre deux morceaux).
const MAIL_SPEECH_CHUNK_MAX = 260;
function mailSplitTextForSpeech(text){
  // Les adresses web ne sont pas lues à voix haute (illisibles) : on dit juste « lien ».
  text = String(text||"").replace(/<?\b(?:https?:\/\/|www\.)[^\s<>]+>?/gi, " lien ").replace(/\(\s*lien\s*\)?/g, " lien ");
  // Un retour à la ligne sans ponctuation devient une petite pause (". ").
  text = String(text||"").replace(/([^.!?…,;:\s])[ \t]*\n+\s*/g, "$1. ").replace(/\s*\n+\s*/g, " ").replace(/\s{2,}/g," ").trim();
  if(!text) return [];
  // Découpe en phrases, puis regroupe les phrases jusqu'à la taille max.
  const sentences = text.match(/[^.!?…]+[.!?…]*\s*/g) || [text];
  const chunks = [];
  let cur = "";
  sentences.forEach(s=>{
    s = s.trim(); if(!s) return;
    // Phrase à elle seule trop longue : on la coupe sur des espaces.
    while(s.length > MAIL_SPEECH_CHUNK_MAX){
      let cut = s.lastIndexOf(",", MAIL_SPEECH_CHUNK_MAX);
      if(cut < 80) cut = s.lastIndexOf(" ", MAIL_SPEECH_CHUNK_MAX);
      if(cut < 1) cut = MAIL_SPEECH_CHUNK_MAX;
      if(cur){ chunks.push(cur); cur = ""; }
      chunks.push(s.slice(0, cut+1).trim());
      s = s.slice(cut+1).trim();
    }
    if(!s) return;
    if(cur && (cur.length + 1 + s.length) > MAIL_SPEECH_CHUNK_MAX){ chunks.push(cur); cur = s; }
    else cur = cur ? cur+" "+s : s;
  });
  if(cur) chunks.push(cur);
  return chunks;
}
// Garde une référence à chaque énoncé en cours : sinon Chrome peut le
// "ramasser" (garbage collector) et ne jamais déclencher sa fin.
const mailLiveUtterances = [];
// Voix qui ont échoué pendant cette session (ex. « Français (France) »
// choisie mais ses données vocales ne sont pas installées sur le téléphone :
// Android répond « synthesis-failed » sans le moindre son).
const mailBadVoices = new Set();
let mailFallbackWarned = false;
// Ordre d'essai : la voix choisie, les autres voix françaises de France,
// puis n'importe quelle voix française (Canada, Belgique…), puis la voix par
// défaut du téléphone. On passe à la suivante dès qu'une voix échoue.
function mailVoiceCandidates(){
  const voices = mailVoicesCache.length ? mailVoicesCache : mailRefreshVoices();
  const list = [];
  const add = v=>{ if(v && !mailBadVoices.has(v.voiceURI) && !list.includes(v)) list.push(v); };
  add(mailGetSelectedVoice());
  mailAllowedVoices().forEach(add);
  voices.filter(v=> String(v.lang||"").toLowerCase().startsWith("fr") && !mailIsMaleVoice(v)).forEach(add);
  voices.filter(v=> String(v.lang||"").toLowerCase().startsWith("fr")).forEach(add);
  if(!mailBadVoices.has("__default_fr")) list.push("__default_fr");   // voix par défaut, en demandant le français
  if(!mailBadVoices.has("__default")) list.push("__default");         // voix par défaut, sans rien imposer
  return list;
}
function mailSpeakOneChunk(text, gen, onDone, opts){
  if(gen !== mailSpeakGeneration) return; // une lecture plus récente (ou un arrêt) a pris le relais
  setTimeout(()=>{
    if(gen !== mailSpeakGeneration) return;
    const synth = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance(text);
    const candidates = mailVoiceCandidates();
    const cand = candidates[0];
    if(!cand){
      // Tout a échoué : on prévient une fois au lieu de rester muet.
      if(!mailFallbackWarned){ mailFallbackWarned = true; alert("Aucune voix de ce téléphone n'arrive à lire le texte. Vérifie dans les réglages Android → Synthèse vocale que le moteur Google est actif et que la langue « Français (France) » est installée, puis recharge la page."); }
      mailBadVoices.clear();
      if(gen===mailSpeakGeneration) onDone();
      return;
    }
    const candKey = typeof cand==="string" ? cand : cand.voiceURI;
    if(cand==="__default_fr") u.lang = "fr-FR";
    else if(cand!=="__default"){ u.voice = cand; u.lang = cand.lang; }
    u.rate = mailSpeechRate;
    u.pitch = 1;
    let settled = false, started = false, idleTicks = 0;
    mailLiveUtterances.push(u);
    function finish(){
      if(settled) return;
      settled = true;
      mailClearKeepAlive();
      const k = mailLiveUtterances.indexOf(u); if(k>=0) mailLiveUtterances.splice(k,1);
      if(gen===mailSpeakGeneration) onDone();
    }
    u.onstart = ()=>{ started = true; };
    u.onend = finish;
    u.onerror = (ev)=>{
      if(settled) return;
      // "interrupted"/"canceled" = arrêt volontaire (autre lecture, bouton stop).
      if(ev.error==="interrupted" || ev.error==="canceled"){ settled = true; mailClearKeepAlive(); return; }
      settled = true; mailClearKeepAlive();
      console.warn("Erreur de lecture vocale ("+candKey+") :", ev.error);
      if(gen !== mailSpeakGeneration) return;
      mailVoiceFailed(cand, candKey);
      mailSpeakOneChunk(text, gen, onDone, opts); // réessaie avec la voix suivante
    };
    mailCurrentUtterance = u;
    synth.speak(u);
    // Surveillance : sur certains Android, "onend" ne se déclenche parfois
    // pas. Si le moteur est redevenu silencieux après avoir parlé, on
    // considère le morceau terminé et on enchaîne quand même.
    mailClearKeepAlive();
    mailSpeakKeepAlive = setInterval(()=>{
      if(settled || gen!==mailSpeakGeneration){ mailClearKeepAlive(); return; }
      if(synth.speaking) started = true;
      if(started && !synth.speaking && !synth.pending){
        idleTicks++;
        if(idleTicks >= 3) finish(); // ~0,9s de silence après la fin sans "onend"
      } else idleTicks = 0;
    }, 300);
    // Filet de sécurité : si rien n'a démarré au bout de 2,5s, on retente
    // une fois avec la voix par défaut de l'appareil.
    setTimeout(()=>{
      if(settled || started || synth.speaking || gen!==mailSpeakGeneration) return;
      settled = true; mailClearKeepAlive();
      synth.cancel();
      mailVoiceFailed(cand, candKey);
      mailSpeakOneChunk(text, gen, onDone, opts);
    }, 2500);
  }, 120);
}
function mailVoiceFailed(cand, candKey){
  mailBadVoices.add(candKey);
  // Prévient une seule fois quand la voix choisie ne marche pas sur ce téléphone.
  if(typeof cand!=="string" && !mailFallbackWarned){
    const sel = mailGetSelectedVoice();
    if(sel && sel.voiceURI===candKey){
      mailFallbackWarned = true;
      setTimeout(()=> alert("La voix « "+cand.name+" » ne fonctionne pas sur ce téléphone (données vocales probablement non installées). La lecture continue avec une autre voix française.\n\nPour l'utiliser : Réglages Android → Synthèse vocale → ⚙️ Moteur Google → Installer les données vocales → Français (France)."), 50);
    }
  }
}
function mailSpeak(text, onEnd, opts){
  opts = opts || {};
  if(!("speechSynthesis" in window)){ alert("La lecture vocale n'est pas prise en charge par ce navigateur."); if(onEnd) onEnd(); return; }
  if(!text || !text.trim()){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  mailClearKeepAlive();
  mailSpeakGeneration++;
  const gen = mailSpeakGeneration;
  const chunks = mailSplitTextForSpeech(text);
  let i = 0;
  function next(){
    if(gen !== mailSpeakGeneration) return;
    if(i >= chunks.length){ if(onEnd) onEnd(); return; }
    const chunkText = chunks[i++];
    mailSpeakOneChunk(chunkText, gen, next, {forceDefaultVoice: opts.forceDefaultVoice});
  }
  next();
}
function mailStopSpeaking(){ mailSpeakGeneration++; mailClearKeepAlive(); if("speechSynthesis" in window) window.speechSynthesis.cancel(); }
// Lit une conversation message par message à partir de startIndex, en
// annonçant "Message X sur N" avant chacun (onProgress permet d'afficher un
// compteur à l'écran) et en enchaînant automatiquement au suivant.
function mailSpeakMessages(messages, startIndex, onAllDone, onProgress){
  let idx = Math.max(0, startIndex||0);
  function step(){
    if(idx >= messages.length){ if(onAllDone) onAllDone(); return; }
    const msg = messages[idx];
    if(onProgress) onProgress(idx+1, messages.length, msg);
    const label = (messages.length>1 ? ("Message "+(idx+1)+" sur "+messages.length+". ") : "")
      + (msg.from ? "De "+msg.from+". " : "")
      + (msg.body && msg.body.trim() ? msg.body : "Ce message n'a pas de contenu texte lisible.");
    idx++;
    mailSpeak(label, step);
  }
  step();
}

function gmailEnsureTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) throw new Error("Google Identity Services pas encore chargé, réessaie dans un instant.");
  if(!mailGmailClientId) throw new Error("Renseigne d'abord l'identifiant client Google.");
  if(!mailGmailTokenClient || mailGmailTokenClient.__clientId !== mailGmailClientId){
    mailGmailTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: mailGmailClientId,
      scope: GMAIL_SCOPE,
      callback: ()=>{}
    });
    mailGmailTokenClient.__clientId = mailGmailClientId;
  }
  return mailGmailTokenClient;
}
function gmailRequestToken(interactive){
  return googleAuthSerial(()=> new Promise((resolve, reject)=>{
    let client;
    try{ client = gmailEnsureTokenClient(); }catch(e){ reject(e); return; }
    let settled = false;
    const guard = setTimeout(()=>{ if(!settled){ settled = true; reject({error:"timeout"}); } }, interactive ? 180000 : 25000);
    client.callback = async (resp)=>{
      if(settled) return;
      settled = true; clearTimeout(guard);
      if(resp.error){ reject(resp); return; }
      try{
        const r = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/profile", {headers:{Authorization:"Bearer "+resp.access_token}});
        if(r.ok){
          const email = ((await r.json()).emailAddress||"").toLowerCase();
          if(email && email !== MAIL_DEFAULT_ACCOUNT.toLowerCase()){
            googleRevokeQuietly(resp.access_token);
            mailWrongAccount = email;
            if(interactive) alert("Ce compte Google ("+email+") n'est pas la boîte mail dédiée.\nReconnecte-toi en choisissant "+MAIL_DEFAULT_ACCOUNT+".");
            reject({error:"wrong_account", email}); return;
          }
        }
      }catch(e){}
      mailWrongAccount = null;
      mailGmailAccessToken = resp.access_token;
      mailGmailTokenExpiry = Date.now() + (resp.expires_in||3600)*1000 - 60000;
      resolve(resp);
    };
    // Présélectionne la boîte Gmail dédiée aux mails transférés, pour ne
    // pas se tromper de compte avec celui utilisé pour les sauvegardes Drive.
    // interactive=false tente une reconnexion silencieuse (sans fenêtre),
    // ce qui marche tant que le compte a déjà donné son accord une fois —
    // utilisé pour ne pas redemander de se connecter à chaque actualisation.
    client.requestAccessToken({prompt: interactive ? "consent" : "", login_hint: MAIL_DEFAULT_ACCOUNT, hint: MAIL_DEFAULT_ACCOUNT});
  }));
}
// Essaie de restaurer la session Gmail au chargement de la page, pour qu'une
// actualisation ou une réouverture de l'appli ne redemande pas de se
// reconnecter à chaque fois (le jeton d'accès ne survit pas à un rechargement
// de la page, seul l'identifiant client est mémorisé).
function attemptMailReconnect(){
  if(!mailGmailClientId) return Promise.resolve(false);
  return gmailRequestToken(false).then(()=> true).catch(()=> false);
}
setTimeout(attemptMailReconnect, 900);

function b64urlDecode(data){
  try{
    const s = String(data||"").replace(/-/g,"+").replace(/_/g,"/");
    return decodeURIComponent(escape(window.atob(s)));
  }catch(e){
    try{ return window.atob(String(data||"").replace(/-/g,"+").replace(/_/g,"/")); }catch(e2){ return ""; }
  }
}
function gmailExtractBody(payload){
  if(!payload) return "";
  function walk(part){
    if(!part) return null;
    if(part.mimeType==="text/plain" && part.body && part.body.data) return {type:"text", data:b64urlDecode(part.body.data)};
    if(part.parts){
      for(const p of part.parts){ const r = walk(p); if(r && r.type==="text") return r; }
      for(const p of part.parts){ const r = walk(p); if(r) return r; }
    }
    if(part.mimeType==="text/html" && part.body && part.body.data) return {type:"html", data:b64urlDecode(part.body.data)};
    return null;
  }
  const found = walk(payload);
  if(!found) return "";
  return found.type==="html" ? htmlToTextKeepLinks(found.data) : found.data;
}
// Version HTML du mail (s'il y en a une), pour récupérer les vrais liens <a href>.
function gmailExtractHtml(payload){
  function walk(part){
    if(!part) return "";
    if(part.mimeType==="text/html" && part.body && part.body.data) return b64urlDecode(part.body.data);
    for(const p of (part.parts||[])){ const r = walk(p); if(r) return r; }
    return "";
  }
  return walk(payload);
}
function gmailHeader(headers, name){
  const h = (headers||[]).find(x=> x.name.toLowerCase()===name.toLowerCase());
  return h ? h.value : "";
}
function parseForwardedBody(text){
  const raw = String(text||"");
  const markers = [/-{2,}\s*(Forwarded message|Message transf[ée]r[ée])\s*-{2,}/i, /Begin forwarded message:/i];
  let idx = -1;
  for(const re of markers){ const m = raw.match(re); if(m){ idx = m.index + m[0].length; break; } }
  if(idx === -1){
    // Outlook/Exchange forwards (Nine) drop straight into the "De : /
    // Envoyé : / À : / Objet :" header block, with no banner text, often
    // right after a plain separator line ("________________________________").
    const withSep = raw.match(/^[ \t]*_{5,}[ \t]*\r?\n(?=[ \t]*(De|From)\s*:)/im);
    const bare = raw.match(/^[ \t]*(De|From)\s*:/im);
    const m = withSep || bare;
    if(m) idx = m.index;
  }
  if(idx === -1) return null;
  const after = text.slice(idx).replace(/^[ \t]*_{5,}[ \t]*\r?\n/, "").replace(/^\s*\n+/, "");
  return parsePastedMail(after);
}
async function gmailFetchInbox(count){
  // Toute la boîte de réception (lus et non lus), pas seulement les mails
  // non encore écoutés dans SensiTâche — le statut "traité" reste affiché
  // comme indication (badge) mais ne masque plus rien.
  const listUrl = "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults="+(count||50)+"&labelIds=INBOX";
  const listRes = await fetch(listUrl, {headers:{Authorization:"Bearer "+mailGmailAccessToken}});
  if(!listRes.ok) throw new Error("Impossible de lister les mails Gmail ("+listRes.status+").");
  const listData = await listRes.json();
  const ids = (listData.messages||[]).map(m=>m.id);
  const mails = [];
  let skipped = 0;
  for(const id of ids){
    try{
      const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/"+id+"?format=full", {headers:{Authorization:"Bearer "+mailGmailAccessToken}});
      if(!res.ok){ skipped++; continue; }
      const m = await res.json();
      const headers = m.payload ? m.payload.headers : [];
      let from = gmailHeader(headers,"From");
      let to = gmailHeader(headers,"To");
      let cc = gmailHeader(headers,"Cc");
      let subject = gmailHeader(headers,"Subject") || "(sans objet)";
      let body = gmailExtractBody(m.payload);
      const links = extractLinks(body, gmailExtractHtml(m.payload));
      const fwd = parseForwardedBody(body);
      if(fwd && (fwd.subject || fwd.from)){
        from = fwd.from || from;
        to = fwd.to || to;
        cc = fwd.cc || cc;
        subject = fwd.subject || subject;
        body = fwd.body;
      }
      mails.push({
        id: id, gmailId: id, source: "gmail",
        from, to, cc, subject: cleanMailSubject(subject),
        date: Date.now(),
        unread: (m.labelIds||[]).includes("UNREAD"),
        links,
        body: stripEmailSignature(body),
        threadMessages: splitMailThreadMessages(body, mailDisplayName(from))
      });
    }catch(e){
      skipped++;
      console.error("Mail Gmail ignoré (id="+id+") :", e);
    }
  }
  if(skipped>0) console.warn(skipped+" mail(s) Gmail n'ont pas pu être chargés et ont été ignorés.");
  return mails;
}
async function gmailTrash(id){
  try{
    await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/"+id+"/trash", {method:"POST", headers:{Authorization:"Bearer "+mailGmailAccessToken}});
  }catch(e){}
}

/* ---------- Ligne de mail réutilisable (modale "coller/Outlook" + onglet Mail) ---------- */
function buildMailRow(mail, opts){
  opts = opts || {};
  const fromName = mailDisplayName(mail.from);
  const mailKey = mail.gmailId || mail.id;
  const row = document.createElement("div");
  row.style.cssText = "border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;background:var(--bg-panel-2);";
  row.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
      <div style="min-width:0;">
        <div style="font-size:13px;font-weight:700;${mail.unread?'':'color:var(--text-sub);'}">${mail.unread?'🔵 ':''}${mail.source==='outlook'?'📨 ':(mail.source==='paste'?'📋 ':'📧 ')}${escapeHtml(fromName||"(expéditeur inconnu)")}</div>
        <div style="font-size:12.5px;color:var(--text-main);margin-top:1px;">${escapeHtml(mail.subject||"(sans objet)")}</div>
      </div>
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
        <div data-taskBadge style="font-size:11px;font-weight:700;color:var(--knowledge);white-space:nowrap;display:${mailHasTaskCreated(mailKey) ? 'block' : 'none'};" title="Une tâche a déjà été créée à partir de ce mail">✅ Tâche créée</div>
        <div style="font-size:11px;color:var(--text-sub);white-space:nowrap;display:${mailGetProcessedIds().has(mailKey) ? 'block' : 'none'};" title="Déjà écouté dans SensiTâche">👂 Déjà écouté</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn small" data-listen>🔊 Écouter</button>
      <button class="btn small" data-reply>✍️ Répondre</button>
      ${opts.allowDelete ? '<button class="btn small danger" data-delete>🗑️ Supprimer</button>' : ''}
      <span data-mailCounter style="font-size:11px;font-weight:700;color:var(--accent);display:none;"></span>
    </div>
    ${mail.threadMessages && mail.threadMessages.length>1 ? `
    <details style="margin-top:8px;">
      <summary style="cursor:pointer;font-size:11.5px;color:var(--text-sub);">🧵 ${mail.threadMessages.length} messages dans cette conversation — touche-en un pour l'écouter</summary>
      <div data-threadList style="display:flex;flex-direction:column;gap:4px;margin-top:6px;"></div>
    </details>` : ''}
    ${mail.links && mail.links.length ? `
    <details style="margin-top:8px;">
      <summary style="cursor:pointer;font-size:11.5px;color:var(--text-sub);">🔗 ${mail.links.length} lien${mail.links.length>1?'s':''} dans ce mail</summary>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">${linksChipsHtml(mail.links)}</div>
    </details>` : ''}
    <div data-replyPane style="display:none;margin-top:8px;">
      <textarea data-replyText placeholder="Dicte ou tape ta réponse ici…" style="width:100%;min-height:80px;border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;background:var(--bg-app);color:var(--text-main);font-size:13px;resize:vertical;"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn small" data-dictate>🎤 Dicter la réponse</button>
        <button class="btn small primary" data-saveTask>💾 Enregistrer comme tâche</button>
        <button class="btn small ghost" data-cancelReply>Annuler</button>
      </div>
      <div data-savedMsg style="font-size:12px;color:var(--knowledge);margin-top:6px;display:none;"></div>
    </div>
  `;
  const replyPane = row.querySelector("[data-replyPane]");
  const textarea = row.querySelector("[data-replyText]");
  function openReply(){
    replyPane.style.display = "block";
    textarea.focus();
  }

  /* ---- Lecture vocale : la conversation entière, message par message ----
     mail.threadMessages contient chaque message du fil séparément (le plus
     récent en premier) — on les enchaîne à l'oral avec un compteur "Message
     X/N", et la liste dépliable permet d'en choisir un précis d'où démarrer
     plutôt que de toujours tout réécouter depuis le début. */
  const mailMessages = (mail.threadMessages && mail.threadMessages.length) ? mail.threadMessages : [{from:fromName, date:"", body:mail.body||""}];
  const counterEl = row.querySelector("[data-mailCounter]");
  function updateMailCounter(idx, total){
    if(!counterEl) return;
    if(total>1){ counterEl.style.display="inline"; counterEl.textContent = "🔊 Message "+idx+"/"+total; }
    else counterEl.style.display="none";
  }
  function hideMailCounter(){ if(counterEl) counterEl.style.display="none"; }
  const threadListEl = row.querySelector("[data-threadList]");
  function startListenFrom(startIndex){
    const withIntro = startIndex===0;
    function playThread(){
      mailSpeakMessages(mailMessages, startIndex, ()=>{
        hideMailCounter();
        mailSpeak("Veux-tu dicter une réponse ? Touche « Répondre », puis « Dicter la réponse » et parle.", ()=> openReply());
      }, updateMailCounter);
    }
    if(withIntro){
      const parts = ["Mail de "+(fromName||"expéditeur inconnu")+"."];
      if(mail.to) parts.push("À "+mailDisplayName(mail.to)+".");
      if(mail.cc) parts.push("Copie à "+mailDisplayName(mail.cc)+".");
      parts.push("Objet : "+(mail.subject||"sans objet")+".");
      mailSpeak(parts.join(" "), playThread);
    } else {
      playThread();
    }
    if(opts.onRead) opts.onRead(mail);
  }
  if(threadListEl){
    mailMessages.forEach((msg,i)=>{
      const item = document.createElement("button");
      item.type = "button";
      item.className = "btn small ghost";
      item.style.cssText = "justify-content:flex-start;text-align:left;width:100%;font-size:11.5px;";
      item.textContent = "▶ "+(i+1)+". "+(msg.from||"Expéditeur inconnu")+(msg.date?" · "+msg.date:"");
      item.addEventListener("click", (e)=>{ e.stopPropagation(); mailStopSpeaking(); startListenFrom(i); });
      threadListEl.appendChild(item);
    });
  }

  /* ---- Dictée vocale de la réponse (reconnaissance de la parole) ----
     Le moteur de reconnaissance s'arrête tout seul au bout d'un moment de
     silence ou de pause, même en mode "continuous" — ce n'est pas voulu ici :
     la dictée ne doit s'arrêter que quand la personne touche explicitement
     "Arrêter la dictée". On relance donc automatiquement la reconnaissance
     tant que l'arrêt n'a pas été demandé à la main. */
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dictateBtn = row.querySelector("[data-dictate]");
  let recognition = null;
  let recognizing = false;
  let dictationStoppedManually = true;
  function stopDictation(){
    dictationStoppedManually = true;
    if(recognition && recognizing){ try{ recognition.stop(); }catch(e){} }
  }
  function startRecognitionInstance(){
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "fr-FR";
    recognition.interimResults = false;
    recognition.continuous = true;
    recognition.onresult = (ev)=>{
      let finalText = "";
      for(let i=ev.resultIndex; i<ev.results.length; i++){
        if(ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
      }
      if(finalText.trim()){
        textarea.value = (textarea.value.trim() ? textarea.value.trim()+" " : "") + finalText.trim();
      }
    };
    recognition.onerror = (ev)=>{
      console.warn("Erreur de dictée vocale :", ev.error);
      if(ev.error==="not-allowed" || ev.error==="service-not-allowed"){
        dictationStoppedManually = true; // pas la peine de relancer si le micro est refusé
        alert("Le micro n'est pas autorisé pour ce site. Autorise-le dans les réglages du navigateur pour dicter ta réponse.");
      }
      // "no-speech", "network", etc. : on laisse onend décider de relancer.
    };
    recognition.onend = ()=>{
      recognizing = false;
      if(dictationStoppedManually){
        dictateBtn.textContent = "🎤 Dicter la réponse";
        dictateBtn.classList.remove("danger");
        return;
      }
      // Arrêt non demandé par la personne (silence, pause, limite du moteur) —
      // on relance tout de suite pour que la dictée continue sans y toucher.
      try{ startRecognitionInstance(); recognition.start(); recognizing = true; }
      catch(e){ console.warn("Relance de la dictée impossible :", e); dictateBtn.textContent = "🎤 Dicter la réponse"; dictateBtn.classList.remove("danger"); }
    };
  }
  if(!SpeechRecognitionCtor){
    dictateBtn.disabled = true;
    dictateBtn.title = "Dictée vocale non prise en charge par ce navigateur — utilise le micro de ton clavier à la place.";
    dictateBtn.style.opacity = "0.5";
  } else {
    dictateBtn.addEventListener("click", ()=>{
      if(recognizing){ stopDictation(); return; }
      mailStopSpeaking(); hideMailCounter();
      dictationStoppedManually = false;
      startRecognitionInstance();
      try{
        recognition.start();
        recognizing = true;
        dictateBtn.textContent = "⏹ Arrêter la dictée";
        dictateBtn.classList.add("danger");
      }catch(e){ console.warn("Impossible de démarrer la dictée :", e); }
    });
  }
  row.querySelector("[data-listen]").addEventListener("click", ()=>{
    startListenFrom(0);
  });
  row.querySelector("[data-reply]").addEventListener("click", ()=>{ mailStopSpeaking(); hideMailCounter(); openReply(); });
  row.querySelector("[data-cancelReply]").addEventListener("click", ()=>{ stopDictation(); replyPane.style.display="none"; textarea.value=""; });
  if(opts.allowDelete){
    row.querySelector("[data-delete]").addEventListener("click", async ()=>{
      if(!confirm("Supprimer ce mail (déplacé dans la corbeille Gmail) ?")) return;
      mailStopSpeaking(); hideMailCounter();
      stopDictation();
      if(opts.onDelete) await opts.onDelete(mail);
      row.remove();
    });
  }
  row.querySelector("[data-saveTask]").addEventListener("click", ()=>{
    stopDictation();
    const reply = textarea.value.trim();
    if(!reply){ alert("Écris ou dicte d'abord une réponse."); return; }
    const t = {
      id: uid("task"), workspaceId: currentWsId, title: mail.subject||"(sans objet)",
      description: reply + (mail.links && mail.links.length ? "\n\nLiens du mail :\n" + mail.links.map(l=> "- " + (l.label && !/^https?:\/\//i.test(l.label) ? l.label+" : " : "") + l.url).join("\n") : ""),
      assignedTo:[DATA.currentUserId], today:false, urgent:false,
      quick:true, knowledge:false, followUp:false, reminderDate:null, recurrence:null,
      done:false, doneAt:null, subtasks:[], attachments:[], process:null,
      createdAt:Date.now(), updatedAt:Date.now()
    };
    DATA.tasks.push(t);
    saveData(); renderSidebar(); renderMain();
    mailMarkTaskCreated(mailKey);
    const badge = row.querySelector("[data-taskBadge]");
    if(badge) badge.style.display = "block";
    row.querySelector("[data-savedMsg]").style.display = "block";
    row.querySelector("[data-savedMsg]").textContent = "✅ Enregistré dans une nouvelle tâche « rapide » « "+(mail.subject||"sans objet")+" ».";
    mailSpeak("Tâche enregistrée.");
    if(opts.onRead) opts.onRead(mail);
  });
  return row;
}

    }
  }
}

function parsePastedMail(raw){
  const lines = String(raw||"").split(/\r?\n/);
  let from="", to="", cc="", subject="", bodyStartIdx=0, headerLinesSeen=0;
  const headerRe = {
    from: /^\s*(De|From)\s*:\s*(.+)$/i,
    date: /^\s*(Envoyé|Sent|Date)\s*:\s*(.+)$/i, // reconnu et ignoré, pour ne pas arrêter la lecture des en-têtes avant À/Objet
    to: /^\s*(À|A|To)\s*:\s*(.+)$/i,
    cc: /^\s*(Cc)\s*:\s*(.+)$/i,
    subject: /^\s*(Objet|Subject)\s*:\s*(.+)$/i
  };
  let i = 0;
  for(; i < Math.min(lines.length, 20); i++){
    const line = lines[i];
    if(!line.trim()){
      if(headerLinesSeen>0){ bodyStartIdx = i+1; i++; break; }
      continue;
    }
    let matched = false;
    for(const key in headerRe){
      const m = line.match(headerRe[key]);
      if(m){
        if(key==="from") from = m[2].trim();
        else if(key==="to") to = m[2].trim();
        else if(key==="cc") cc = m[2].trim();
        else if(key==="subject") subject = m[2].trim();
        matched = true; headerLinesSeen++;
        break;
      }
    }
    bodyStartIdx = i+1;
    if(!matched) break;
  }
  const body = lines.slice(bodyStartIdx).join("\n").trim();
  return { from, to, cc, subject, body };
}

/* =========================================================================
   AI ASSISTANT (spelling correction / rephrasing) — uses your own Anthropic
   API key, called directly from the browser with your own key. I can't run
   this for free inside a plain hosted web page; this key never leaves your
   device except to talk to api.anthropic.com directly.
========================================================================= */
let anthropicApiKey = localStorage.getItem("sensitache.anthropicKey") || "";
async function callClaudeText(text, mode){
  if(!anthropicApiKey) throw new Error("Aucune clé API renseignée. Va dans Paramètres → Assistant IA.");
  const systemPrompt = mode==="fix"
    ? "Tu es un correcteur. Corrige uniquement l'orthographe, la grammaire et la ponctuation du texte fourni, en français. Ne change rien d'autre : ni le sens, ni le ton, ni la longueur. Réponds uniquement avec le texte corrigé, sans aucune explication ni guillemets."
    : "Tu reformules le texte fourni en français pour qu'il soit plus clair et mieux structuré, en conservant exactement le même sens et les mêmes informations. Réponds uniquement avec le texte reformulé, sans aucune explication ni guillemets.";
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicApiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1024,
      system: systemPrompt,
      messages: [{ role: "user", content: text }]
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    throw new Error("Erreur API ("+res.status+") : "+errText.slice(0,200));
  }
  const data = await res.json();
  const out = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!out) throw new Error("Réponse vide de l'IA.");
  return out;
}

async function runDescriptionAI(mode){
  const t = curTask(); if(!t) return;
  const btn = document.getElementById(mode==="fix" ? "btnDescFix" : "btnDescRephrase");
  const textarea = document.getElementById("taskDescInput");
  const text = textarea.value.trim();
  if(!text){ alert("Écris d'abord une description."); return; }
  const originalLabel = btn.textContent;
  btn.textContent = "…"; btn.disabled = true;
  try{
    const result = await callClaudeText(text, mode);
    snapshot();
    textarea.value = result;
    t.description = result;
    t.updatedAt = Date.now();
    saveData();
  }catch(e){
    if(e.message && e.message.includes("Aucune clé API")){
      if(confirm(e.message+"\nOuvrir les paramètres maintenant ?")) showAIModal();
    } else {
      alert("Échec : "+e.message);
    }
  }finally{
    btn.textContent = originalLabel; btn.disabled = false;
  }
}

    </div>`;
  document.body.appendChild(overlay);
  updateDriveIndicator();
  overlay.querySelector("#qaTitle").focus();
  overlay.querySelector("#qaSettingsBtn").addEventListener("click", ()=> showSettingsModal());
  let qaToday=false, qaUrgent=false, qaQuick=false, qaKnowledge=false;
  overlay.querySelector("#qaChipToday").addEventListener("click", e=>{ qaToday=!qaToday; e.currentTarget.classList.toggle("on", qaToday); });
  overlay.querySelector("#qaChipUrgent").addEventListener("click", e=>{ qaUrgent=!qaUrgent; e.currentTarget.classList.toggle("on", qaUrgent); });
  overlay.querySelector("#qaChipQuick").addEventListener("click", e=>{ qaQuick=!qaQuick; e.currentTarget.classList.toggle("on", qaQuick); });
  overlay.querySelector("#qaChipKnowledge").addEventListener("click", e=>{ qaKnowledge=!qaKnowledge; e.currentTarget.classList.toggle("on", qaKnowledge); });
  let qaAssignedTo = [DATA.currentUserId];
  function renderQaAssignChips(){
    const wrap = overlay.querySelector("#qaAssignChips");
    wrap.innerHTML = "";
    qaAssignedTo.map(id=>collabById(id)).filter(Boolean).forEach(c=>{
      const chip = document.createElement("div");
      chip.style.cssText = "display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:20px;padding:4px 10px 4px 4px;font-size:12.5px;";
      chip.innerHTML = `<span class="avatar" style="background:${c.color};width:20px;height:20px;font-size:9px;">${escapeHtml(c.name.slice(0,2).toUpperCase())}</span>${escapeHtml(c.name)}<span data-rm="${c.id}" style="cursor:pointer;color:var(--text-sub);margin-left:2px;">✕</span>`;
      chip.querySelector("[data-rm]").addEventListener("click", ()=>{
        qaAssignedTo = qaAssignedTo.filter(id=>id!==c.id);
        if(qaAssignedTo.length===0) qaAssignedTo=[DATA.currentUserId];
        renderQaAssignChips();
      });
      wrap.appendChild(chip);
    });
  }
  renderQaAssignChips();
  overlay.querySelector("#qaAddAssignee").addEventListener("click", ()=>{
    const pickOverlay = document.createElement("div");
    pickOverlay.className = "modal-overlay";
    pickOverlay.innerHTML = `<div class="modal" style="width:300px;">
      <h2>Affecter</h2>
      <div id="qaPickList" style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-height:240px;overflow-y:auto;"></div>
      <button class="btn small" id="qaPickNew" style="width:100%;justify-content:center;margin-bottom:10px;">+ Nouveau collaborateur</button>
      <div class="modal-actions"><button class="btn primary" id="qaPickDone">OK</button></div>
    </div>`;
    document.body.appendChild(pickOverlay);
    function drawPick(){
      const wrap = pickOverlay.querySelector("#qaPickList");
      wrap.innerHTML = "";
      DATA.collaborators.forEach(c=>{
        const row = document.createElement("label");
        row.style.cssText = "display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px;border-radius:6px;";
        row.innerHTML = `<input type="checkbox" ${qaAssignedTo.includes(c.id)?"checked":""}><span class="avatar" style="background:${c.color};width:20px;height:20px;font-size:9px;">${escapeHtml(c.name.slice(0,2).toUpperCase())}</span>${escapeHtml(c.name)}`;
        row.querySelector("input").addEventListener("change", e=>{
          if(e.target.checked){ if(!qaAssignedTo.includes(c.id)) qaAssignedTo.push(c.id); }
          else { qaAssignedTo = qaAssignedTo.filter(id=>id!==c.id); }
          renderQaAssignChips();
        });
        wrap.appendChild(row);
      });
    }
    drawPick();
    pickOverlay.querySelector("#qaPickNew").addEventListener("click", ()=>{
      const n = prompt("Nom du nouveau collaborateur :"); if(!n||!n.trim()) return;
      const c = {id:uid("collab"), name:n.trim(), color:PALETTE[DATA.collaborators.length % PALETTE.length], updatedAt:Date.now()};
      DATA.collaborators.push(c); qaAssignedTo.push(c.id); saveData(); drawPick(); renderQaAssignChips();
    });
    pickOverlay.querySelector("#qaPickDone").addEventListener("click", ()=>{
      if(qaAssignedTo.length===0) qaAssignedTo=[DATA.currentUserId];
      pickOverlay.remove();
    });
    pickOverlay.addEventListener("click", e=>{ if(e.target===pickOverlay) pickOverlay.remove(); });
  });
  const wsSel = overlay.querySelector("#qaWorkspace");
  wsSel.innerHTML = DATA.workspaces.map(w=>`<option value="${w.id}" ${w.id===currentWsId?"selected":""}>${escapeHtml((w.icon?w.icon+" ":"")+w.name)}</option>`).join("");
  let pendingPhotos = [];
  function renderPreview(){
    const wrap = overlay.querySelector("#qaPhotoPreview");
    wrap.innerHTML = pendingPhotos.map((p,i)=>`<div style="position:relative;"><img src="${p.dataUrl}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;display:block;"><span data-rm="${i}" style="position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;">✕</span></div>`).join("");
    wrap.querySelectorAll("[data-rm]").forEach(b=> b.addEventListener("click", ()=>{ pendingPhotos.splice(Number(b.dataset.rm),1); renderPreview(); }));
  }
  if(prefill.files && prefill.files.length){
    prefill.files.forEach(f=>{
      const reader = new FileReader();
      reader.onload = ()=>{ pendingPhotos.push({name: f.name || ("photo-"+uid("p")+".jpg"), dataUrl: reader.result}); renderPreview(); };
      reader.readAsDataURL(f.blob);
    });
  }
  overlay.querySelector("#qaAddPhoto").addEventListener("click", ()=> overlay.querySelector("#qaPhotoInput").click());
  overlay.querySelector("#qaPhotoInput").addEventListener("change", (e)=>{
    Array.from(e.target.files).forEach(async file=>{
      const dataUrl = await compressImageFile(file);
      if(dataUrl){ pendingPhotos.push({name:file.name, dataUrl}); renderPreview(); }
    });
    e.target.value = "";
  });
  overlay.querySelector("#qaCancel").addEventListener("click", ()=>{
    overlay.remove();
    if(prefill.closeOnCreate) attemptCloseApp();
  });
  overlay.querySelector("#qaCreate").addEventListener("click", async ()=>{
    const title = overlay.querySelector("#qaTitle").value.trim();
    if(!title){ alert("Donne un titre à la tâche."); return; }
    const createBtn = overlay.querySelector("#qaCreate");
    const wsId = wsSel.value;
    const attMetas = pendingPhotos.map(p=>({id:uid("att"), name:p.name, type:"image", driveFileId:null}));
    const t = {
      id: uid("task"), workspaceId: wsId, title, description: overlay.querySelector("#qaDesc").value.trim(),
      assignedTo: qaAssignedTo.length ? qaAssignedTo : [DATA.currentUserId],
      today: qaToday, urgent: qaUrgent, quick: qaQuick, knowledge: qaKnowledge,
      reminderDate: overlay.querySelector("#qaReminder").value || null,
      recurrence:null, done:false, doneAt:null,
      attachments: attMetas,
      process:null, createdAt:Date.now(), updatedAt:Date.now()
    };
    await Promise.all(attMetas.map((meta,i)=> attachPut(meta.id, pendingPhotos[i].dataUrl)));
    attMetas.forEach((meta,i)=> uploadAttachmentToDrive(meta, pendingPhotos[i].dataUrl, t)); // fire-and-forget
    DATA.tasks.push(t);
    currentWsId = wsId; currentTab = "tasks";
    document.querySelectorAll(".tab").forEach(x=> x.classList.toggle("active", x.dataset.tab==="tasks"));
    saveData(); renderSidebar(); renderMain();
    if(prefill.closeOnCreate){
      createBtn.textContent = "Enregistrement…"; createBtn.disabled = true;
      const synced = await flushDriveBackupNow();
      overlay.remove();
      if(!synced){
        const note = document.createElement("div");
        note.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;background:var(--bg-card);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);";
        note.textContent = "⚠️ Tâche enregistrée sur ce téléphone, mais l'envoi vers Drive n'a pas eu le temps de se terminer (connexion lente ?). Elle se synchronisera à la prochaine ouverture connectée.";
        document.body.appendChild(note);
        setTimeout(()=>{ note.remove(); attemptCloseApp(); }, 4000);
        return;
      }
      attemptCloseApp();
    } else {
      overlay.remove();
    }
  });
  overlay.addEventListener("click", e=>{ if(e.target===overlay){ overlay.remove(); if(prefill.closeOnCreate) attemptCloseApp(); } });
}
function isPhoneSize(){ return window.innerWidth <= 860; }
function isStandaloneApp(){
  return !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true);
}
async function flushDriveBackupNow(){
  // On the phone quick-capture flow the app closes itself right after
  // creating a task — if we only relied on the debounced background sync,
  // closing the app too fast could cut it off before it ever reached Drive.
  // So push immediately here and wait for it. The cap is generous because
  // mobile data (vs Wi-Fi) and Android's Data Saver mode can both add real
  // latency to these requests — but capped so a genuinely offline connection
  // never leaves the person stuck unable to close the app.
  if(!(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry)) return true; // nothing to sync, not a failure
  clearTimeout(backupDebounceTimer);
  maybeCreateFrequentSnapshot();
  let finished = false;
  await Promise.race([
    writeDriveBackup().then(()=>{ finished = true; }),
    new Promise(resolve => setTimeout(resolve, 10000))
  ]);
  return finished;
}
function attemptCloseApp(){
  // Browsers only allow window.close() on windows/tabs opened by script,
  // which an installed PWA or a normally-opened tab usually isn't — so this
  // is best-effort. If it's silently refused, tell the person what to do.
  window.close();
  setTimeout(()=>{
    if(!document.hidden){
      const note = document.createElement("div");
      note.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);";
      note.textContent = "Tâche créée ✅ — tu peux fermer l'appli.";
      document.body.appendChild(note);
      setTimeout(()=> note.remove(), 3500);
    }
  }, 300);
}

/* Handle the "Nouvelle tâche" home-screen shortcut and incoming photo shares
   from other apps (both delivered as a redirect with a URL flag, since this
   is a static site — the service worker stashes shared files in Cache
   Storage under a fixed key for the page to pick up right after reload). */
async function checkIncomingQuickAction(){
  const params = new URLSearchParams(location.search);
  if(params.get("quickadd")==="1"){
    history.replaceState(null, "", location.pathname);
    openQuickAddModal({closeOnCreate: isStandaloneApp()});
    return true;
  }
  if(params.get("shared")==="1"){
    history.replaceState(null, "", location.pathname);
    try{
      const cache = await caches.open("sensitache-share-cache");
      const metaRes = await cache.match("/shared-meta");
      if(!metaRes) return false;
      const meta = await metaRes.json();
      const files = [];
      for(let i=0;i<(meta.filesData||[]).length;i++){
        const fRes = await cache.match("/shared-file-"+i);
        if(fRes){ files.push({name:meta.filesData[i].name, blob: await fRes.blob()}); await cache.delete("/shared-file-"+i); }
      }
      await cache.delete("/shared-meta");
      openQuickAddModal({title: meta.title || meta.text || "", files, closeOnCreate: isStandaloneApp()});
      return true;
    }catch(e){ console.warn("Échec de récupération du partage :", e); return false; }
  }
  return false;
}

/* =========================================================
   INIT
========================================================= */
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
});
renderSidebar();
document.querySelectorAll(".tab").forEach(x=> x.classList.toggle("active", x.dataset.tab===currentTab));
if(purgeOldTrash()>0) saveData();
renderMain();
updateDriveIndicator();

// Restore whichever task drawer (and process editor within it) was open
// before the page refreshed, so a reload doesn't kick the person back out
// to the task list while they're in the middle of working on something.
// Intercept the phone's back button (and browser back) so it closes the
// process editor or task drawer — just like clicking their own close
// button — instead of navigating away from the app entirely.
window.addEventListener("popstate", ()=>{
  if(suppressNextPopstate){ suppressNextPopstate = false; return; }
  if(document.getElementById("procOverlay").classList.contains("show")){
    closeProcessEditor();
    return;
  }
  if(openTaskId){
    closeDrawer();
    return;
  }
});

(function restoreOpenTask(){
  const savedTaskId = localStorage.getItem("sensitache.openTaskId");
  if(!savedTaskId) return;
  const t = DATA.tasks.find(x=>x.id===savedTaskId);
  if(!t) { localStorage.removeItem("sensitache.openTaskId"); return; }
  if(t.workspaceId !== currentWsId){
    currentWsId = t.workspaceId; currentTab = "tasks";
    document.querySelectorAll(".tab").forEach(x=> x.classList.toggle("active", x.dataset.tab==="tasks"));
    renderSidebar(); renderMain();
  }
  openTaskDrawer(savedTaskId);
  if(localStorage.getItem("sensitache.procEditorOpen")==="1" && t.process){
    openProcessEditor(t);
  }
})();

// The service worker was causing the app to stop responding for some users
// (a broken service worker can get stuck controlling the page even after
// the underlying files are fixed). Actively remove any existing one so the
// app reliably falls back to loading normally from the network.
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=> reg.unregister());
  }).catch(()=>{});
  if(window.caches && caches.keys){
    caches.keys().then(keys=> keys.forEach(k=> caches.delete(k))).catch(()=>{});
  }
}
checkIncomingQuickAction().then(handled=>{
  if(!handled && isStandaloneApp()){
    openQuickAddModal({closeOnCreate: true});
  }
});

// Try to restore the Google Drive session on load so a page refresh doesn't
// force a manual "Se connecter" every time. Depending on the browser's
// third-party cookie policy this can sometimes show a brief Google window
// instead of staying fully silent — the status dot next to the gear icon
// always reflects the real connection state either way.
function attemptDriveReconnect(){
  if(!driveClientId) return;
  driveRequestToken(false).then(()=>{
    updateDriveIndicator(); updateDriveStatus();
    // A successful reconnect only restores the connection — it doesn't by
    // itself pull in what another device may have added meanwhile. Only
    // making a local change used to trigger that pull, which is exactly why
    // a device sitting untouched never saw the other device's tasks without
    // clicking "Importer depuis Drive" by hand. Do that pull right away too.
    writeDriveBackup();
    maybeCreateFrequentSnapshot();
  }).catch(()=>{ updateDriveIndicator(); });
}
setTimeout(attemptDriveReconnect, 700);
setInterval(updateDriveIndicator, 30000);

/* ---- Renouvellement automatique de l'accès Drive ----
   L'autorisation Google expire au bout d'environ une heure. Avant, rien ne
   la renouvelait tant que la page restait ouverte : le PC ouvert toute la
   journée arrêtait de synchroniser sans prévenir. On la renouvelle donc
   quelques minutes avant l'échéance (et au retour sur l'appli), et si ça
   ne passe pas, un bandeau bien visible propose de relancer en un geste. */
let driveRenewing = false;
function driveSyncBanner(show){
  let b = document.getElementById("driveSyncBanner");
  if(!show){ if(b) b.remove(); return; }
  if(b){
    b.textContent = driveWrongAccount ? ("⚠️ Mauvais compte Google ("+driveWrongAccount+") — touche ici et choisis "+DRIVE_DEFAULT_ACCOUNT) : "⚠️ Synchro Drive interrompue — touche ici pour la relancer";
    return;
  }
  if(!localStorage.getItem("sensitache.driveLastSync")) return; // appareil jamais synchronisé : rien à signaler
  b = document.createElement("div");
  b.id = "driveSyncBanner";
  b.style.cssText = "position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:200;background:var(--danger);color:#fff;font-size:13px;font-weight:700;padding:9px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;max-width:92vw;text-align:center;";
  b.textContent = driveWrongAccount ? ("⚠️ Mauvais compte Google ("+driveWrongAccount+") — touche ici et choisis "+DRIVE_DEFAULT_ACCOUNT) : "⚠️ Synchro Drive interrompue — touche ici pour la relancer";
  b.addEventListener("click", ()=>{
    b.textContent = "Reconnexion…";
    (driveWrongAccount ? driveRequestToken(true) : driveRequestToken(false).catch(()=> driveRequestToken(true))).then(()=>{
      driveSyncBanner(false); updateDriveIndicator(); updateDriveStatus(); writeDriveBackup();
    }).catch(()=>{ b.textContent = "⚠️ Synchro Drive interrompue — touche ici pour la relancer"; });
  });
  document.body.appendChild(b);
}
function driveEnsureFreshToken(){
  if(!driveClientId || driveRenewing) return;
  if(driveAccessToken && Date.now() < driveTokenExpiry - 5*60000){ driveSyncBanner(false); return; }
  driveRenewing = true;
  const giveUp = setTimeout(()=>{ driveRenewing = false; updateDriveIndicator(); if(!(driveAccessToken && Date.now() < driveTokenExpiry)) driveSyncBanner(true); }, 20000);
  driveRequestToken(false).then(()=>{
    clearTimeout(giveUp); driveRenewing = false;
    driveSyncBanner(false); updateDriveIndicator(); updateDriveStatus();
    writeDriveBackup();
  }).catch(()=>{
    clearTimeout(giveUp); driveRenewing = false; updateDriveIndicator();
    if(!(driveAccessToken && Date.now() < driveTokenExpiry)) driveSyncBanner(true);
  });
}
setTimeout(()=> setInterval(driveEnsureFreshToken, 60000), 30000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") setTimeout(driveEnsureFreshToken, 1500); });
// Periodically pull in whatever another device may have synced, and also
// whenever this tab/app comes back to the foreground (e.g. switching back
// from another app on the phone, or back to this browser tab on the PC).
setInterval(()=>{
  if(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry) writeDriveBackup();
}, 15000);
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible"){
    maybeCreateFrequentSnapshot();
    if(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry) writeDriveBackup();
  }
});

})();
