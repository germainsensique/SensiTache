      e.preventDefault();
      dragId = s.id;
      row.style.opacity = "0.5";
      const move = (ev)=>{
        const rows = Array.from(wrap.querySelectorAll(".subtask-row"));
        const overRow = rows.find(r=>{
          const rect = r.getBoundingClientRect();
          return ev.clientY >= rect.top && ev.clientY <= rect.bottom;
        });
        dragOverId = overRow ? overRow.dataset.id : null;
        rows.forEach(r=> r.style.borderTop = (r.dataset.id===dragOverId && dragOverId!==dragId) ? "2px solid var(--accent)" : "1px solid var(--border-soft)");
      };
      const up = ()=>{
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        document.removeEventListener("pointercancel", up);
        endDragSession();
        if(dragOverId && dragOverId!==dragId){
          const list = t.subtasks;
          const fromIdx = list.findIndex(x=>x.id===dragId);
          const toIdx = list.findIndex(x=>x.id===dragOverId);
          if(fromIdx>-1 && toIdx>-1){
            const [moved] = list.splice(fromIdx,1);
            list.splice(toIdx,0,moved);
            t.updatedAt = Date.now(); saveData(); renderMain();
          }
        }
        dragId=null; dragOverId=null;
        renderSubtaskList(t);
      };
      startDragSession(up);
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    });
    wrap.appendChild(row);
  });
}

function renderAttachList(t){

  wrap.innerHTML = "";
  (t.attachments||[]).forEach(a=>{
    const iconMap = {email:"✉️", image:"🖼️", pdf:"📄", app:"💻", other:"📎"};
    const row = document.createElement("div");
    row.className = "attach-item";
    row.innerHTML = `<span class="aicon">${iconMap[a.type]}</span><span class="aname">${escapeHtml(a.name)}</span>
      <span class="astatus" style="font-size:10.5px;color:var(--text-sub);white-space:nowrap;">…</span>
      <button class="btn small" data-open>${a.type==="email" ? "Aperçu" : (a.type==="app" ? "Lancer →" : "Ouvrir")}</button>
      ${a.type==="email" ? '<button class="btn small" data-download title="Télécharger le fichier .eml original">⬇️</button>' : ''}
      ${a.type==="app" ? '<button class="btn small" data-replace title="Remplacer par une version mise à jour du fichier">🔄</button>' : ''}
      <button class="btn small" data-upload title="Sauvegarder sur Google Drive" style="display:none;">☁️↑</button>
      <button class="btn small" data-fetchdrive title="Télécharger depuis Drive sur cet appareil" style="display:none;">⬇️☁️</button>
      <button class="btn small" data-searchdrive title="Chercher ce fichier sur Drive par son nom (si l'identifiant a été perdu)" style="display:none;">🔍☁️</button>
      <button class="btn small danger" data-del>✕</button>`;
    refreshAttachStatus(row, a);
    row.querySelector("[data-upload]").addEventListener("click", async (e)=>{
      const btn = e.currentTarget;
      const cached = await attachGetLocal(a.id);
      if(!cached){ alert("Ce fichier n'est pas non plus présent sur cet appareil — impossible de l'envoyer depuis ici."); return; }
      btn.disabled = true; btn.textContent = "…";
      await uploadAttachmentToDrive(a, cached, t);
      btn.disabled = false; btn.textContent = "☁️↑";
      refreshAttachStatus(row, a);
    });
    row.querySelector("[data-fetchdrive]").addEventListener("click", async (e)=>{
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = "…";
      const dataUrl = await getAttachmentDataUrl(a); // fetches from Drive and caches locally
      btn.disabled = false; btn.textContent = "⬇️☁️";
      if(!dataUrl){ alert("Échec du téléchargement depuis Drive — vérifie ta connexion."); return; }
      refreshAttachStatus(row, a);
    });
    row.querySelector("[data-searchdrive]").addEventListener("click", async (e)=>{
      const btn = e.currentTarget;
      if(!(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry)){ alert("Connecte-toi d'abord à Drive."); return; }
      btn.disabled = true; btn.textContent = "…";
      try{
        const token = await driveGetToken();
        // The attachment's own id is stable and embedded in the Drive file
        // name from the moment it was first uploaded (from any device) —
        // so even with no driveFileId recorded here, searching by that id
        // finds it if it exists anywhere on Drive.
        const q = encodeURIComponent("name contains 'sensitache-attachment-"+a.id+"-' and trashed=false");
        const res = await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,name)", {headers:{Authorization:"Bearer "+token}});
        const data = await res.json();
        if(data.files && data.files.length>0){
          a.driveFileId = data.files[0].id;
          t.updatedAt = Date.now(); saveData();
          const dataUrl = await getAttachmentDataUrl(a);
          if(!dataUrl){ alert("Fichier trouvé sur Drive mais impossible à télécharger — réessaie."); }
        } else {
          alert("Aucun fichier correspondant trouvé sur Drive — il n'a peut-être jamais fini de s'envoyer depuis l'appareil d'origine. Utilise « 🔄 Remplacer » depuis l'appareil qui a encore le fichier en local.");
        }
      }catch(err){ alert("Échec de la recherche : "+err.message); }
      btn.disabled = false; btn.textContent = "🔍☁️";
      refreshAttachStatus(row, a);
    });
    row.querySelector("[data-open]").addEventListener("click", async ()=>{
      if(a.type==="email"){
        showEmailPreviewModal(a);
      } else if(a.type==="image"){
        const w = window.open();
        const dataUrl = await getAttachmentDataUrl(a);
        if(!dataUrl){ w.close(); alert("Impossible de charger cette image (pas encore synchronisée sur cet appareil ?)."); return; }
        w.document.write('<img src="'+dataUrl+'" style="max-width:100%;">');
      } else {
        openAttachmentBlob(a);
      }
      refreshAttachStatus(row, a); // opening it may have just cached it locally — reflect that
    });
    const dlBtn = row.querySelector("[data-download]");
    if(dlBtn) dlBtn.addEventListener("click", async ()=>{
      const dataUrl = await getAttachmentDataUrl(a);
      if(!dataUrl){ alert("Impossible de charger ce fichier."); return; }
      const link = document.createElement("a");
      link.href = dataUrl; link.download = a.name;
      document.body.appendChild(link); link.click(); link.remove();
    });
    const replaceBtn = row.querySelector("[data-replace]");
    if(replaceBtn) replaceBtn.addEventListener("click", ()=> replaceAttachmentFile(t, a));
    row.querySelector("[data-del]").addEventListener("click", ()=>{
      if(!confirm("Supprimer ce document ?")) return;
      snapshot();
      t.attachments = t.attachments.filter(x=>x.id!==a.id);
      attachDeleteLocal(a.id);
      deleteAttachmentFromDrive(a.driveFileId);
      saveData(); renderAttachList(t);
    });
    wrap.appendChild(row);
  });
}
async function refreshAttachStatus(row, a){
  const el = row.querySelector(".astatus");
  const uploadBtn = row.querySelector("[data-upload]");
  const fetchBtn = row.querySelector("[data-fetchdrive]");
  const searchBtn = row.querySelector("[data-searchdrive]");
  if(!el) return;
  if(uploadBtn) uploadBtn.style.display = "none";
  if(fetchBtn) fetchBtn.style.display = "none";
  if(searchBtn) searchBtn.style.display = "none";
  if(a.dataUrl){ el.textContent = "✅ hors ligne"; el.style.color = "var(--knowledge)"; return; }
  const cached = await attachGetLocal(a.id);
  if(cached && !a.driveFileId && uploadBtn) uploadBtn.style.display = "inline-flex";
  if(!cached && a.driveFileId && fetchBtn) fetchBtn.style.display = "inline-flex";
  if(!cached && !a.driveFileId && searchBtn) searchBtn.style.display = "inline-flex";
  if(cached){ el.textContent = "✅ hors ligne"; el.style.color = "var(--knowledge)"; return; }
  if(a.driveFileId){ el.textContent = "☁️ sur Drive"; el.style.color = "var(--text-sub)"; return; }
  el.textContent = "⚠️ pas encore sauvegardé"; el.style.color = "#F0838C";
}
function replaceAttachmentFile(t, a){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = a.type==="app" ? ".html,.htm" : "";
  input.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    let dataUrl;
    if(file.type.startsWith("image/")) dataUrl = await compressImageFile(file);
    if(!dataUrl){
      dataUrl = await new Promise(resolve=>{
        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>resolve(null); r.readAsDataURL(file);
      });
    }
    if(!dataUrl){ alert("Impossible de lire ce fichier."); return; }
    snapshot();
    await attachPut(a.id, dataUrl); // overwrite in place — same attachment, same position in the list
    a.name = file.name;
    t.updatedAt = Date.now();
    saveData(); renderAttachList(t);
    // Push the updated content to the existing Drive copy too (or create one if there wasn't one yet)
    if(a.driveFileId && driveClientId && driveAccessToken && Date.now() < driveTokenExpiry){
      try{
        const token = await driveGetToken();
        const blob = await (await fetch(dataUrl)).blob();
        await fetch("https://www.googleapis.com/upload/drive/v3/files/"+a.driveFileId+"?uploadType=media", {
          method:"PATCH", headers:{Authorization:"Bearer "+token, "Content-Type": blob.type||"application/octet-stream"},
          body: blob
        });
      }catch(err){ console.warn("Échec de la mise à jour Drive de la pièce jointe :", err); }
    } else {
      uploadAttachmentToDrive(a, dataUrl, t);
    }
  };
  input.click();
}

/* ---- reliable file opening: browsers block navigating a new tab straight to a

async function openAttachmentBlob(a){

  }).catch(err=> alert("Impossible d'ouvrir ce fichier : "+err.message));
}

/* ---- .eml parsing: decode the stored data URL back to raw text, then parse
   RFC 822 headers + (multipart) body so we can show the email's content directly
   instead of forcing an external mail client ---- */
function dataUrlToText(dataUrl){
  const i = dataUrl.indexOf("base64,");
  const b64 = i>=0 ? dataUrl.slice(i+7) : decodeURIComponent(dataUrl.split(",")[1]||"");
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  try{ return new TextDecoder("utf-8").decode(bytes); }
  catch(e){ return bin; }
}
function decodeMimeWord(val){
  if(!val) return val;
  return val.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=\s*/g, (m,charset,enc,data)=>{
    try{
      if(enc.toUpperCase()==="B"){
        const bin = atob(data.replace(/\s+/g,""));
        const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
        return new TextDecoder(charset).decode(bytes);
      } else {
        const withSpaces = data.replace(/_/g," ");
        const bytes = [];
        for(let i=0;i<withSpaces.length;i++){
          if(withSpaces[i]==="=" ){ bytes.push(parseInt(withSpaces.substr(i+1,2),16)); i+=2; }
          else bytes.push(withSpaces.charCodeAt(i));
        }
        return new TextDecoder(charset).decode(Uint8Array.from(bytes));
      }
    }catch(e){ return data; }
  });
}
function decodeBodyPart(str, cte){
  cte = (cte||"").toLowerCase().trim();
  if(cte==="base64"){
    try{
      const bin = atob(str.replace(/[\r\n\s]+/g,""));
      const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }catch(e){ return str; }
  }
  if(cte==="quoted-printable"){
    return str.replace(/=\r?\n/g,"").replace(/=([0-9A-F]{2})/gi,(m,hex)=>String.fromCharCode(parseInt(hex,16)));
  }
  return str;
}
function parseHeaderBlock(headerBlock){
  const unfolded = headerBlock.replace(/\n[ \t]+/g," ");
  const headers = {};
  unfolded.split("\n").forEach(line=>{
    const m = line.match(/^([\w-]+):\s*(.*)$/);
    if(m) headers[m[1].toLowerCase()] = m[2];
  });
  return headers;
}
function splitMimeParts(body, boundary){
  const marker = "--"+boundary;
  const segments = body.split(marker);
  // segments[0] = preamble, last segment = closing "--" + epilogue; keep only real parts between
  return segments.slice(1, -1).map(s=> s.replace(/^\n/, ""));
}
function extractTextFromBody(body, contentType){
  // Recursively walk (possibly nested) multipart bodies to find the first
  // text/plain and text/html parts, skipping attachments and inline images.
  // Outlook commonly nests multipart/mixed > multipart/related > multipart/alternative.
  const boundaryMatch = (contentType||"").match(/boundary="?([^";]+)"?/i);
  if(!boundaryMatch) return {plain:null, html:null};
  const parts = splitMimeParts(body, boundaryMatch[1]);
  let plain = null, html = null;
  parts.forEach(partRaw=>{
    const pSep = partRaw.indexOf("\n\n");
    if(pSep<0) return;
    const pHeaders = parseHeaderBlock(partRaw.slice(0,pSep));
    const pBodyRaw = partRaw.slice(pSep+2);
    const pType = pHeaders["content-type"] || "";
    const disposition = pHeaders["content-disposition"] || "";
    if(/attachment/i.test(disposition)) return; // skip real attachments
    if(/multipart\//i.test(pType)){
      const nested = extractTextFromBody(pBodyRaw, pType);
      if(plain===null && nested.plain!==null) plain = nested.plain;
      if(html===null && nested.html!==null) html = nested.html;
    } else if(/text\/plain/i.test(pType)){
      if(plain===null) plain = decodeBodyPart(pBodyRaw, pHeaders["content-transfer-encoding"]);
    } else if(/text\/html/i.test(pType)){
      if(html===null) html = decodeBodyPart(pBodyRaw, pHeaders["content-transfer-encoding"]);
    }
    // anything else (image/*, application/*, etc.) is an inline image or file — skipped
  });
  return {plain, html};
}
function parseEml(raw){
  const text = raw.replace(/\r\n/g,"\n");
  const sep = text.indexOf("\n\n");
  let headerBlock = sep>=0 ? text.slice(0,sep) : text;
  let body = sep>=0 ? text.slice(sep+2) : "";
  const headers = parseHeaderBlock(headerBlock);
  const contentType = headers["content-type"] || "";
  let plain, html;
  if(/multipart\//i.test(contentType)){
    const found = extractTextFromBody(body, contentType);
    plain = found.plain; html = found.html;
  } else {
    const decoded = decodeBodyPart(body, headers["content-transfer-encoding"]);
    if(/text\/html/i.test(contentType)){ html = decoded; plain = null; }
    else { plain = decoded; html = null; }
  }
  function cleanEmailBody(s){
    return s
      .replace(/\[cid:[^\]]*\]/gi, "")           // inline-image placeholders Outlook leaves in plain text
      .split("\n")
      .map(line => line.replace(/^\s*<(https?:\/\/\S+)>\s*$/i, "$1")) // lien seul sur sa ligne : on le garde, sans les chevrons
      .join("\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  const finalBody = cleanEmailBody((plain!==null && plain!==undefined ? plain : (html ? htmlToTextKeepLinks(html) : "")).replace(/\r/g,""));
  const links = extractLinks(finalBody, html);
  return {
    subject: decodeMimeWord(headers["subject"]) || "(sans objet)",
    from: decodeMimeWord(headers["from"]) || "—",
    to: decodeMimeWord(headers["to"]) || "—",
    cc: decodeMimeWord(headers["cc"]) || "",
    date: headers["date"] || "",
    body: finalBody || "(message vide ou format non reconnu)",
    links
  };
}

  const dataUrl = await getAttachmentDataUrl(a);

function procBoardSize(){
  let maxX=1600, maxY=1000;
  PROC.shapes.forEach(s=>{ maxX=Math.max(maxX, s.x+s.w+300); maxY=Math.max(maxY, s.y+s.h+300); });
  return {w:maxX, h:maxY};
}
function procApplyBoardSize(){
  const sz = procBoardSize();
  const board = document.getElementById("procBoard");
  board.style.width=sz.w+"px"; board.style.height=sz.h+"px";
  document.getElementById("procArrowSvg").setAttribute("width", sz.w);
  document.getElementById("procArrowSvg").setAttribute("height", sz.h);
  document.getElementById("procArrowSvg").setAttribute("viewBox","0 0 "+sz.w+" "+sz.h);
}
function renderProcBoard(){
  procApplyBoardSize();

}
function procAutoArrange(){
  if(!PROC.shapes.length) return;
  if(!confirm("Réorganiser automatiquement toutes les formes du processus selon le sens des flèches ? Les positions actuelles seront perdues.")) return;
  snapshot();
  const ids = PROC.shapes.map(s=>s.id);
  const level = {}; ids.forEach(id=> level[id]=0);
  for(let iter=0; iter<ids.length+1; iter++){
    let changed=false;
    PROC.arrows.forEach(a=>{
      if(level[a.from.shapeId]===undefined || level[a.to.shapeId]===undefined) return;
      if(level[a.to.shapeId] < level[a.from.shapeId]+1){ level[a.to.shapeId]=level[a.from.shapeId]+1; changed=true; }
    });
    if(!changed) break;
  }
  const byLevel = {};
  ids.forEach(id=>{ (byLevel[level[id]] = byLevel[level[id]]||[]).push(id); });
  const levelKeys = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
  const GAP_X=50, GAP_Y=70, START_X=60, START_Y=40;
  let curY = START_Y;
  levelKeys.forEach(lv=>{
    const idsAtLevel = byLevel[lv].slice().sort((a,b)=> PROC.shapes.find(s=>s.id===a).x - PROC.shapes.find(s=>s.id===b).x);
    let curX = START_X, rowH = 0;
    idsAtLevel.forEach(id=>{
      const s = PROC.shapes.find(x=>x.id===id);
      s.x = curX; s.y = curY;
      curX += s.w + GAP_X;
      rowH = Math.max(rowH, s.h);
    });
    curY += rowH + GAP_Y;
  });
  saveData(); procClearSelection(); renderProcBoard();
}
function procAnchorPoint(shape, side){
  switch(side){
    case "top": return {x:shape.x+shape.w/2, y:shape.y};
    case "bottom": return {x:shape.x+shape.w/2, y:shape.y+shape.h};
    case "left": return {x:shape.x, y:shape.y+shape.h/2};
    case "right": return {x:shape.x+shape.w, y:shape.y+shape.h/2};
  }
}
const procSideDir = {top:{x:0,y:-1}, bottom:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};

/* ---- auto-alignment (snap to other shapes' edges/centers) ---- */
const PROC_SNAP_THRESHOLD = 6;
function procComputeSnap(shape, nx, ny){
  let bestX=null, bestY=null;
  const candX = [nx, nx+shape.w/2, nx+shape.w];
  const candY = [ny, ny+shape.h/2, ny+shape.h];
  PROC.shapes.forEach(other=>{
    if(other.id===shape.id) return;
    const oxs = [other.x, other.x+other.w/2, other.x+other.w];
    const oys = [other.y, other.y+other.h/2, other.y+other.h];
    candX.forEach(cx=>{ oxs.forEach(ox=>{ const diff=Math.abs(cx-ox); if(diff<PROC_SNAP_THRESHOLD && (!bestX||diff<bestX.diff)) bestX={diff, adjust:ox-cx, guide:ox}; }); });
    candY.forEach(cy=>{ oys.forEach(oy=>{ const diff=Math.abs(cy-oy); if(diff<PROC_SNAP_THRESHOLD && (!bestY||diff<bestY.diff)) bestY={diff, adjust:oy-cy, guide:oy}; }); });
  });
  const guides=[]; let outX=nx, outY=ny;
  if(bestX){ outX=nx+bestX.adjust; guides.push({type:"v", pos:bestX.guide}); }
  if(bestY){ outY=ny+bestY.adjust; guides.push({type:"h", pos:bestY.guide}); }
  return {x:Math.max(0,outX), y:Math.max(0,outY), guides};
}
function procDrawSnapGuides(guides){
  procRemoveSnapGuides();
  if(!guides || guides.length===0) return;
  const svg = document.getElementById("procArrowSvg");
  const sz = procBoardSize();
  guides.forEach(g=>{
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.classList.add("procSnapGuideLine");
    if(g.type==="v"){ line.setAttribute("x1",g.pos); line.setAttribute("x2",g.pos); line.setAttribute("y1",0); line.setAttribute("y2",sz.h); }
    else { line.setAttribute("y1",g.pos); line.setAttribute("y2",g.pos); line.setAttribute("x1",0); line.setAttribute("x2",sz.w); }
    line.setAttribute("stroke","#FF4D8D"); line.setAttribute("stroke-width","1"); line.setAttribute("stroke-dasharray","4,4");
    line.style.pointerEvents="none";
    svg.appendChild(line);
  });
}
function procRemoveSnapGuides(){ document.querySelectorAll(".procSnapGuideLine").forEach(l=>l.remove()); }
function procRouteOrthogonal(p0,dir0,p1,dir1){
  const stub=26;
  const s0={x:p0.x+dir0.x*stub,y:p0.y+dir0.y*stub};
  const s1={x:p1.x+dir1.x*stub,y:p1.y+dir1.y*stub};
  const axis0 = dir0.x!==0?"h":"v", axis1 = dir1.x!==0?"h":"v";
  let pts=[p0,s0];
  if(axis0==="h"&&axis1==="h"){ const midX=(s0.x+s1.x)/2; pts.push({x:midX,y:s0.y},{x:midX,y:s1.y}); }
  else if(axis0==="v"&&axis1==="v"){ const midY=(s0.y+s1.y)/2; pts.push({x:s0.x,y:midY},{x:s1.x,y:midY}); }
  else if(axis0==="h"&&axis1==="v"){ pts.push({x:s1.x,y:s0.y}); }
  else { pts.push({x:s0.x,y:s1.y}); }
  pts.push(s1,p1);
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){ const a=out[out.length-1],b=pts[i]; if(Math.abs(a.x-b.x)>0.5||Math.abs(a.y-b.y)>0.5) out.push(b); }
  return out;
}
function procPointsToPath(pts){ return "M "+pts.map(p=>p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" L "); }
function procContrastText(hex){
  if(!hex || hex[0]!=="#" || hex.length<7) return "#1B1D23";
  const r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)) return "#1B1D23";
  const toLin = c=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const L = 0.2126*toLin(r) + 0.7152*toLin(g) + 0.0722*toLin(b);
  return L > 0.45 ? "#1B1D23" : "#FFFFFF";
}
const procArrowColorVar = {positive:"var(--green)", negative:"var(--orange)", neutral:"var(--grey-arrow)"};
const procArrowMarker = {positive:"url(#parrow-green)", negative:"url(#parrow-orange)", neutral:"url(#parrow-grey)"};
function procArrowPathPoints(arrow){
  const fs = PROC.shapes.find(s=>s.id===arrow.from.shapeId), ts = PROC.shapes.find(s=>s.id===arrow.to.shapeId);
  if(!fs||!ts) return null;
  return procRouteOrthogonal(procAnchorPoint(fs,arrow.from.side), procSideDir[arrow.from.side], procAnchorPoint(ts,arrow.to.side), procSideDir[arrow.to.side]);
}
function renderProcShapes(){
  const layer = document.getElementById("procShapesLayer");
  layer.innerHTML = "";
  PROC.shapes.forEach(shape=>{
    const isMulti = procMultiSelectedIds.has(shape.id) && procMultiSelectedIds.size>1;
    const el = document.createElement("div");
    el.className = "pshape "+shape.type+(shape.id===procSelectedShapeId?" selected":"")+(isMulti?" multiselected":"");
    el.dataset.id = shape.id;
    el.style.left=shape.x+"px"; el.style.top=shape.y+"px"; el.style.width=shape.w+"px"; el.style.height=shape.h+"px";
    const bg = document.createElement("div"); bg.className="pshapeBg"; bg.style.background = shape.color||"#FFD966";
    el.appendChild(bg);
    if(shape.collabTag){
      const c = collabById(shape.collabTag);
      if(c){ const tag=document.createElement("div"); tag.className="collabtag"; tag.style.background=c.color; tag.textContent=(shape.linkedTaskId?"📋 ":"")+c.name; el.appendChild(tag); }
    }
    if(shape.description && shape.description.trim()){
      const dtag = document.createElement("div"); dtag.className="desctag"; dtag.textContent="📝";
      dtag.title = shape.description;
      el.appendChild(dtag);
    }
    if(shape.duration && shape.duration.trim()){
      const durtag = document.createElement("div"); durtag.className="durtag"; durtag.textContent="⏱ "+shape.duration;
      durtag.title = "Durée estimée de cette étape";
      el.appendChild(durtag);
    }
    const content = document.createElement("div");
    content.className = "pshapeContent";
    content.style.color = procContrastText(shape.color);
    content.innerHTML = shape.content||"";
    content.addEventListener("dblclick", e=>{ e.stopPropagation(); content.setAttribute("contenteditable","true"); content.focus(); });
    content.addEventListener("keydown", e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        document.execCommand("insertLineBreak");
      }
    });
    content.addEventListener("blur", ()=>{
      content.removeAttribute("contenteditable");
      shape.content = content.innerHTML;
      if(shape.linkedTaskId){
        const lt = DATA.tasks.find(t=>t.id===shape.linkedTaskId);
        if(lt){ lt.title = stripHtml(shape.content) || lt.title; lt.updatedAt = Date.now(); }
      }
      saveData();
    });
    content.addEventListener("pointerdown", e=>{ if(content.getAttribute("contenteditable")==="true") e.stopPropagation(); });
    el.appendChild(content);
    ["top","bottom","left","right"].forEach(side=>{
      const a = document.createElement("div"); a.className="panchor "+side; a.dataset.side=side;
      a.addEventListener("pointerdown", e=>{ e.stopPropagation(); e.preventDefault(); procStartArrowDraft(shape.id, side); });
      el.appendChild(a);
    });
    const rh = document.createElement("div"); rh.className="presizeHandle";
    rh.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      e.stopPropagation(); e.preventDefault();
      procSelectShape(shape.id);
      procDragState = {mode:"resize", shapeId:shape.id, startX:e.clientX, startY:e.clientY, startW:shape.w, startH:shape.h};
    });
    el.appendChild(rh);
    el.addEventListener("pointerdown", e=>{
      if(procActiveTool!=="select") return;
      if(e.pointerType==="mouse" && e.button!==0) return;
      if(content.getAttribute("contenteditable")==="true") return;
      e.stopPropagation();
      if(procMultiSelectedIds.has(shape.id) && procMultiSelectedIds.size>1){
        procGroupDragState = {
          startX:e.clientX, startY:e.clientY,
          items: Array.from(procMultiSelectedIds).map(id=>{
            const s = PROC.shapes.find(x=>x.id===id);
            return {id, startLeft:s.x, startTop:s.y};
          })
        };
      } else {
        procMultiSelectedIds.clear();
        procSelectShape(shape.id);
        procDragState = {mode:"move", shapeId:shape.id, startX:e.clientX, startY:e.clientY, startLeft:shape.x, startTop:shape.y};
      }
    });
    layer.appendChild(el);
  });
}
function renderProcArrows(){
  const svg = document.getElementById("procArrowSvg");
  Array.from(svg.querySelectorAll("g[data-arrow]")).forEach(g=>g.remove());
  PROC.arrows.forEach(arrow=>{
    const pts = procArrowPathPoints(arrow); if(!pts) return;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("data-arrow", arrow.id);
    const hit = document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("d", procPointsToPath(pts)); hit.setAttribute("fill","none"); hit.setAttribute("stroke","transparent"); hit.setAttribute("stroke-width","16");
    hit.style.pointerEvents="stroke"; hit.addEventListener("pointerdown", e=>{ e.stopPropagation(); procSelectArrow(arrow.id); });
    g.appendChild(hit);
    const line = document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("d", procPointsToPath(pts)); line.setAttribute("fill","none");
    line.setAttribute("stroke", procArrowColorVar[arrow.kind||"neutral"]);
    line.setAttribute("stroke-width", arrow.id===procSelectedArrowId?3.4:2.4);
    line.setAttribute("stroke-linejoin","round"); line.setAttribute("marker-end", procArrowMarker[arrow.kind||"neutral"]);
    line.style.pointerEvents="none"; g.appendChild(line);
    if(arrow.duration && arrow.duration.trim()){
      const mid = pts[Math.floor(pts.length/2)];
      const label = arrow.duration.trim();
      const textW = Math.max(30, label.length*6.6+14);
      const lg = document.createElementNS("http://www.w3.org/2000/svg","g");
      lg.style.pointerEvents="none";
      const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x", mid.x-textW/2); rect.setAttribute("y", mid.y-10);
      rect.setAttribute("width", textW); rect.setAttribute("height", 20);
      rect.setAttribute("rx", 10);
      rect.setAttribute("fill", "var(--bg-panel)"); rect.setAttribute("stroke", "rgba(0,0,0,.18)"); rect.setAttribute("stroke-width","1");
      lg.appendChild(rect);
      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x", mid.x); text.setAttribute("y", mid.y+4);
      text.setAttribute("text-anchor","middle");
      text.setAttribute("font-size","10.5"); text.setAttribute("font-weight","700");
      text.setAttribute("fill","var(--text)");
      text.textContent = "⏱ "+label;
      lg.appendChild(text);
      g.appendChild(lg);
    }
    svg.appendChild(g);
  });
}
function procUpdateArrowsForShape(shapeId){
  PROC.arrows.forEach(arrow=>{
    if(arrow.from.shapeId!==shapeId && arrow.to.shapeId!==shapeId) return;
    const pts = procArrowPathPoints(arrow); if(!pts) return;
    const g = document.querySelector('#procArrowSvg g[data-arrow="'+arrow.id+'"]'); if(!g) return;
    const d = procPointsToPath(pts);
    g.querySelectorAll("path").forEach(p=>p.setAttribute("d", d));
  });
}

/* ---------- Liens (URL) dans les descriptions et les mails ---------- */
const LINK_URL_RE = /\b((?:https?:\/\/|www\.)[^\s<>"'`]+[^\s<>"'`.,;:!?)\]}»])/gi;
// Outlook réécrit souvent les liens en « safelinks » illisibles : on remet l'adresse réelle.
function unwrapSafeLink(url){
  try{
    const u = new URL(url.startsWith("www.") ? "https://"+url : url);
    if(/safelinks\.protection\.outlook\.com$/i.test(u.hostname) && u.searchParams.get("url")) return u.searchParams.get("url");
    if(/^(www\.)?google\.[a-z.]+$/i.test(u.hostname) && u.pathname==="/url" && u.searchParams.get("q")) return u.searchParams.get("q");
  }catch(e){}
  return url;
}
function linkIsNoise(url){
  return /^(cid:|data:|javascript:)/i.test(url) || /\.(png|jpe?g|gif|bmp|ico)(\?|$)/i.test(url);
}
// HTML → texte en gardant les liens : <a href="URL">libellé</a> devient « libellé (URL) ».
function htmlToTextKeepLinks(html){
  const d = document.createElement("div");
  d.innerHTML = String(html||"").replace(/<(script|style|head)[\s\S]*?<\/\1>/gi, "");
  d.querySelectorAll("a[href]").forEach(a=>{
    const href = unwrapSafeLink(a.getAttribute("href")||"").trim();
    const label = (a.textContent||"").trim();
    if(!href || linkIsNoise(href) || /^mailto:/i.test(href)){ return; }
    const same = !label || label.replace(/^https?:\/\//i,"").replace(/\/$/,"") === href.replace(/^https?:\/\//i,"").replace(/\/$/,"");
    a.textContent = same ? href : label+" ("+href+")";
  });
  d.querySelectorAll("br").forEach(b=> b.replaceWith("\n"));
  d.querySelectorAll("p,div,li,tr,h1,h2,h3,h4,h5,h6").forEach(el=> el.append("\n"));
  d.querySelectorAll("li").forEach(li=> li.prepend("• "));
  return (d.textContent||"").replace(/ /g," ").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
// Liste des liens d'un texte (et d'un éventuel HTML d'origine), sans doublons.
function extractLinks(text, html){
  const out = [], seen = new Set();
  const add = (url, label)=>{
    url = unwrapSafeLink(String(url||"").trim());
    if(!url || linkIsNoise(url)) return;
    if(url.startsWith("www.")) url = "https://"+url;
    const key = url.replace(/\/$/,"");
    if(seen.has(key)) return;
    seen.add(key);
    out.push({url, label: (label||"").trim()});
  };
  if(html){
    const d = document.createElement("div");
    d.innerHTML = html;
    d.querySelectorAll("a[href]").forEach(a=>{ const h = a.getAttribute("href")||""; if(/^(https?:|www\.)/i.test(h)) add(h, a.textContent); });
  }
  const t = String(text||"");
  // « libellé <https://…> » (texte brut Outlook) et <a href> collés dans une description
  t.replace(/([^\n<>]{2,80}?)\s*<((?:https?:\/\/)[^>\s]+)>/g, (m, label, url)=>{ add(url, label.replace(/^[\s:–-]+|[\s:–-]+$/g,"")); return m; });
  t.replace(/<a\s[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (m, url, label)=>{ add(url, label.replace(/<[^>]+>/g,"")); return m; });
  (t.match(LINK_URL_RE)||[]).forEach(u=> add(u, ""));
  return out;
}
function linkLabel(l){
  if(l.label && !/^https?:\/\//i.test(l.label)) return l.label;
  try{ const u = new URL(l.url); return u.hostname.replace(/^www\./,"") + (u.pathname.length>1 ? u.pathname.slice(0,28)+(u.pathname.length>28?"…":"") : ""); }catch(e){ return l.url; }
}
function linksChipsHtml(links){
  return links.map(l=> `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" title="${escapeHtml(l.url)}" style="display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 10px;border-radius:14px;border:1px solid var(--border-soft);background:var(--bg-panel-2);color:var(--accent);font-size:12px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🔗 ${escapeHtml(linkLabel(l))}</a>`).join("");
}
// Texte → HTML échappé avec les adresses cliquables.
function linkifyText(text){
  return escapeHtml(String(text||"")).replace(LINK_URL_RE, (m)=>{
    const raw = m.replace(/&amp;/g,"&");
    let url = unwrapSafeLink(raw); if(url.startsWith("www.")) url = "https://"+url;
    return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all;">${m}</a>`;
  });
}

const procCanvasScroll = document.getElementById("procCanvasScroll");

function procToBoardCoords(clientX, clientY){
  const rect = procBoardEl.getBoundingClientRect();

function procIsBackgroundTarget(t){ return t===procBoardEl || t.id==="procShapesLayer" || t.tagName==="svg" || t.id==="procArrowSvg"; }
procBoardEl.addEventListener("pointerdown", e=>{
  if(!procIsBackgroundTarget(e.target)) return;
  if(procActiveTool==="rect"||procActiveTool==="diamond"){
    const pos = procToBoardCoords(e.clientX, e.clientY);
    const isRect = procActiveTool==="rect";
    const shape = {id:uid("shape"), type:isRect?"rect":"diamond",
      x:Math.max(0,pos.x-(isRect?80:90)), y:Math.max(0,pos.y-(isRect?35:55)),

    PROC.shapes.push(shape); procSyncLegendWithColors(); saveData(); renderProcBoard(); renderProcLegend(); procSelectShape(shape.id);
    setProcTool("select");
    return;
  }
  if(e.pointerType==="mouse" && (e.button===1 || procSpaceDown)){
    e.preventDefault();
    procPanState = {startX:e.clientX, startY:e.clientY, startScrollLeft:procCanvasScroll.scrollLeft, startScrollTop:procCanvasScroll.scrollTop, moved:false};
    return;
  }
  if(procActiveTool==="select" && e.pointerType==="mouse" && e.button===0){
    const pos = procToBoardCoords(e.clientX, e.clientY);
    procLassoState = {startX:pos.x, startY:pos.y, curX:pos.x, curY:pos.y, additive: e.shiftKey||e.ctrlKey||e.metaKey, moved:false};
    if(!procLassoState.additive){ procMultiSelectedIds.clear(); procSelectedShapeId=null; procRemoveFloatToolbar(); procApplyMultiSelectionClasses(); }
    return;
  }
  if(e.pointerType==="mouse"){
    procPanState = {startX:e.clientX, startY:e.clientY, startScrollLeft:procCanvasScroll.scrollLeft, startScrollTop:procCanvasScroll.scrollTop, moved:false};
  }
});
document.addEventListener("pointermove", e=>{

    if(bar){
      const shapesSel = procGroupDragState.items.map(it=>PROC.shapes.find(s=>s.id===it.id)).filter(Boolean);
      const minX = Math.min(...shapesSel.map(s=>s.x)), minY = Math.min(...shapesSel.map(s=>s.y));
      bar.style.left=minX+"px"; bar.style.top=(minY-48)+"px";
    }
    return;
  }
  if(procLassoState){
    const pos = procToBoardCoords(e.clientX, e.clientY);
    procLassoState.curX = pos.x; procLassoState.curY = pos.y;
    if(!procLassoState.moved && Math.hypot(pos.x-procLassoState.startX, pos.y-procLassoState.startY)>3) procLassoState.moved=true;
    procDrawLassoBox();
    return;
  }
  if(procArrowDraft){ const pos=procToBoardCoords(e.clientX,e.clientY); procDrawDraftLine(procArrowDraft.origin, pos); return; }
  if(procPanState){
    const dx=e.clientX-procPanState.startX, dy=e.clientY-procPanState.startY;
    if(!procPanState.moved && Math.hypot(dx,dy)>4){ procPanState.moved=true; procCanvasScroll.style.cursor="grabbing"; }
    if(procPanState.moved){ procCanvasScroll.scrollLeft=procPanState.startScrollLeft-dx; procCanvasScroll.scrollTop=procPanState.startScrollTop-dy; }
  }
});
function procLassoRect(){
  const x1=Math.min(procLassoState.startX, procLassoState.curX), x2=Math.max(procLassoState.startX, procLassoState.curX);
  const y1=Math.min(procLassoState.startY, procLassoState.curY), y2=Math.max(procLassoState.startY, procLassoState.curY);
  return {x1,y1,x2,y2};
}
function procDrawLassoBox(){
  let box = document.getElementById("procLassoBox");
  if(!box){ box=document.createElement("div"); box.id="procLassoBox"; document.getElementById("procShapesLayer").appendChild(box); }
  const r = procLassoRect();
  box.style.left=r.x1+"px"; box.style.top=r.y1+"px"; box.style.width=(r.x2-r.x1)+"px"; box.style.height=(r.y2-r.y1)+"px";
}
function procRemoveLassoBox(){ const b=document.getElementById("procLassoBox"); if(b) b.remove(); }
function procEndPointerInteractions(e){
  if(procDragState){ procApplyBoardSize(); saveData(); procDragState=null; procRemoveSnapGuides(); }
  if(procGroupDragState){ procApplyBoardSize(); saveData(); procGroupDragState=null; }
  if(procLassoState){
    if(procLassoState.moved){
      const r = procLassoRect();
      const hit = PROC.shapes.filter(s=> s.x < r.x2 && s.x+s.w > r.x1 && s.y < r.y2 && s.y+s.h > r.y1).map(s=>s.id);
      if(procLassoState.additive){ hit.forEach(id=> procMultiSelectedIds.add(id)); }
      else { procMultiSelectedIds = new Set(hit); }
      procRemoveFloatToolbar();
      if(procMultiSelectedIds.size===1){ procSelectShape(Array.from(procMultiSelectedIds)[0]); }
      else if(procMultiSelectedIds.size>1){ procSelectedShapeId=null; procApplyMultiSelectionClasses(); procShowMultiFloatToolbar(); renderProcArrows(); }
      else { procApplyMultiSelectionClasses(); renderProcArrows(); }
    } else {
      if(!procLassoState.additive) procClearSelection();
    }
    procRemoveLassoBox();
    procLassoState=null;
  }
  if(procArrowDraft){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const anchorEl = el && el.closest ? el.closest(".panchor") : null;
    if(anchorEl){ const shapeEl = anchorEl.closest(".pshape"); if(shapeEl) procFinishArrowDraft(shapeEl.dataset.id, anchorEl.dataset.side); }
    procArrowDraft=null; document.querySelectorAll(".panchor").forEach(a=>a.classList.remove("forceShow")); procRemoveDraftLine();
  }
  if(procPanState){ if(!procPanState.moved) procClearSelection(); procCanvasScroll.style.cursor="default"; procPanState=null; }
}

/* pinch zoom + wheel zoom */
const procPinchPointers = new Map();
let procPinchStartDist=null, procPinchStartZoom=1;
procCanvasScroll.addEventListener("pointerdown", e=>{
  if(e.pointerType!=="touch") return;
  procPinchPointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(procPinchPointers.size===2){ const pts=[...procPinchPointers.values()]; procPinchStartDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); procPinchStartZoom=procZoom; }
});
procCanvasScroll.addEventListener("pointermove", e=>{
  if(!procPinchPointers.has(e.pointerId)) return;
  procPinchPointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(procPinchPointers.size===2 && procPinchStartDist){
    const pts=[...procPinchPointers.values()];
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    const midX=(pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    procSetZoomAtPoint(procPinchStartZoom*(dist/procPinchStartDist), midX, midY);
  }
});
function procEndPinch(e){ procPinchPointers.delete(e.pointerId); if(procPinchPointers.size<2) procPinchStartDist=null; }
procCanvasScroll.addEventListener("pointerup", procEndPinch);
procCanvasScroll.addEventListener("pointercancel", procEndPinch);
procCanvasScroll.addEventListener("wheel", e=>{ if(!e.ctrlKey) return; e.preventDefault(); procSetZoomAtPoint(procZoom-e.deltaY*0.01, e.clientX, e.clientY); }, {passive:false});

function procSetZoomAtPoint(newZoom, clientX, clientY){
  newZoom = Math.min(2.5, Math.max(0.3, newZoom));
  const rect = procCanvasScroll.getBoundingClientRect();
  const offsetX = (clientX-rect.left)+procCanvasScroll.scrollLeft, offsetY=(clientY-rect.top)+procCanvasScroll.scrollTop;
  const ratio = newZoom/procZoom; procZoom = newZoom;
  procBoardEl.style.transform = "scale("+procZoom+")";
  procCanvasScroll.scrollLeft = offsetX*ratio-(clientX-rect.left);
  procCanvasScroll.scrollTop = offsetY*ratio-(clientY-rect.top);
  document.getElementById("procZoomLabel").textContent = Math.round(procZoom*100)+"%";
}
function procSetZoom(z){ const rect = procCanvasScroll.getBoundingClientRect(); procSetZoomAtPoint(z, rect.left+rect.width/2, rect.top+rect.height/2); }
document.getElementById("btnProcZoomIn").addEventListener("click", ()=> procSetZoom(procZoom+0.1));
document.getElementById("btnProcZoomOut").addEventListener("click", ()=> procSetZoom(procZoom-0.1));

/* Follows the arrows to produce a natural "step 1, step 2…" reading order
   (starting from shapes with no incoming arrow), falling back to a simple
   top-to-bottom / left-to-right position order for anything disconnected. */
function computeFlowOrder(shapes, arrows){
  if(!shapes || shapes.length===0) return [];
  const incoming = {}; shapes.forEach(s=> incoming[s.id]=0);
  (arrows||[]).forEach(a=>{ if(incoming[a.to.shapeId]!==undefined) incoming[a.to.shapeId]++; });
  const outgoingMap = {};
  (arrows||[]).forEach(a=>{ (outgoingMap[a.from.shapeId] = outgoingMap[a.from.shapeId]||[]).push(a.to.shapeId); });
  const byPos = (a,b)=> (a.y-b.y) || (a.x-b.x);
  const visited = new Set(), order = [];
  function visit(id){
    if(visited.has(id)) return;
    visited.add(id);
    const shape = shapes.find(s=>s.id===id);
    if(shape) order.push(shape);
    const nexts = (outgoingMap[id]||[]).map(nid=>shapes.find(s=>s.id===nid)).filter(Boolean).sort(byPos);
    nexts.forEach(s=> visit(s.id));
  }
  const starts = shapes.filter(s=> incoming[s.id]===0).sort(byPos);
  (starts.length?starts:shapes.slice().sort(byPos)).forEach(s=> visit(s.id));
  shapes.slice().sort(byPos).forEach(s=>{ if(!visited.has(s.id)) visit(s.id); }); // leftover cycles/isolated shapes
  return order;
}
function renderProcSummary(){
  const wrap = document.getElementById("procSummaryList");
  if(!wrap) return;
  const order = computeFlowOrder(PROC.shapes, PROC.arrows);
  if(order.length===0){ wrap.innerHTML = '<div style="font-size:12px;color:var(--text-dim);">Aucune étape dans ce processus.</div>'; return; }

}

function procBoundingBox(){
  if(PROC.shapes.length===0) return {x:0,y:0,w:900,h:500};
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  PROC.shapes.forEach(s=>{ minX=Math.min(minX,s.x); minY=Math.min(minY,s.y); maxX=Math.max(maxX,s.x+s.w); maxY=Math.max(maxY,s.y+s.h); });
  const pad=60; return {x:Math.max(0,minX-pad), y:Math.max(0,minY-pad), w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2};
}

async function procExport(kind, sections){
  sections = Object.assign({legend:true, tasks:true, summary:true, descriptions:true}, sections||{});
  procRemoveFloatToolbar();
  document.querySelectorAll(".panchor").forEach(a=>a.style.opacity=0);
  const saved = procBoardEl.style.transform; procBoardEl.style.transform="none";
  // The little 📝 badge is a screen-only hint; html2canvas can't render
  // emoji glyphs (they come out as a blank/broken tofu box in the capture),
  // and it's redundant anyway once the description callouts are drawn.
  const hiddenDescTags = Array.from(document.querySelectorAll(".desctag"));
  hiddenDescTags.forEach(el=> el.style.visibility="hidden");

  // html2canvas can't render a CSS clip-path — a diamond's .pshapeBg would
  // just come out as its full rectangular box. Swap in an equivalent
  // inline SVG polygon for the capture only, then put the live DOM back
  // exactly as it was (see finally{} below).
  const diamondSwaps = [];
  PROC.shapes.forEach(shape=>{
    if(shape.type!=="diamond") return;
    const shapeEl = document.querySelector('.pshape[data-id="'+shape.id+'"]');
    const bgEl = shapeEl && shapeEl.querySelector(".pshapeBg");
    if(!bgEl) return;
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS,"svg");
    svg.setAttribute("viewBox","0 0 100 100");
    svg.setAttribute("preserveAspectRatio","none");
    svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
    const poly = document.createElementNS(svgNS,"polygon");
    poly.setAttribute("points","50,1 99,50 50,99 1,50");
    poly.setAttribute("fill", shape.color||"#FFD966");
    poly.setAttribute("stroke","rgba(0,0,0,.35)");
    poly.setAttribute("stroke-width","1.2");
    svg.appendChild(poly);
    bgEl.style.visibility = "hidden";
    shapeEl.insertBefore(svg, bgEl);
    diamondSwaps.push({svg, bgEl});
  });

  // When "Afficher les descriptions" is on, attach each shape's actual
  // description text on the diagram itself — not only listed separately
  // in the side panel — so it's clear which note belongs to which step
  // once the image is out of the app. The notes are stacked in a blank
  // column to the right of the diagram (never on top of another shape).
  //
  // Earlier versions drew a computed arrow from each note back to its
  // shape — but that meant recomputing, on every export, where two
  // independent elements would end up on screen, and any small drift
  // between that computation and the real layout made the arrow miss.
  // Numbering is a completely different (and foolproof) way to link them:
  // the same number appears once on the shape and once on its note — like
  // a footnote — so there's no line to compute or draw, and therefore
  // nothing that can end up misaligned.
  const descLabels = [];
  const numberTags = [];

    }
  }

  try{
    const boardCanvas = await html2canvas(procBoardEl, {backgroundColor:"#EFEEE8", x:box.x, y:box.y, width:box.w, height:box.h, scale:2, useCORS:true});

    const totalH = Math.max(boardCanvas.height, panelCanvas.height);
    const canvas = document.createElement("canvas");
    canvas.width = totalW; canvas.height = totalH;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#EFEEE8"; ctx.fillRect(0,0,totalW,totalH);

    ctx.drawImage(panelCanvas, boardCanvas.width, 0);
    const name = (curTask()? curTask().title : "processus") || "processus";
    if(kind==="png"){
      canvas.toBlob(blob=>{ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name+".png"; a.click(); URL.revokeObjectURL(url); });
    } else {

      const orientation = canvas.width>canvas.height ? "l":"p";
      const pdf = new jsPDF({orientation, unit:"pt", format:[canvas.width/2, canvas.height/2]});

      pdf.save(name+".pdf");

  }catch(err){ alert("Export impossible : "+err.message); }
  finally{
    procBoardEl.style.transform=saved;
    diamondSwaps.forEach(({svg,bgEl})=>{ svg.remove(); bgEl.style.visibility=""; });

   AUTO-BACKUP TRIGGER (Drive-only)
========================================================================= */
function scheduleAutoBackup(){
  const driveOk = driveClientId && driveAccessToken && Date.now() < driveTokenExpiry;
  if(!driveOk) return;
  clearTimeout(backupDebounceTimer);
  backupDebounceTimer = setTimeout(writeDriveBackup, 500);

/* =========================================================================
   GOOGLE DRIVE SYNC
   Uses your own Google Cloud OAuth client (set up once by you — I can't
   create this on your behalf, it must be tied to your Google account) via
   Google Identity Services. The app only ever touches the single backup
   file it creates itself (scope drive.file), never the rest of your Drive.
   IMPORTANT: Google OAuth does not work from a file:// page — this only
   works when SensiTâche is opened via http:// or https:// (local server
   or online hosting). See the in-app setup guide for details.
========================================================================= */

function driveEnsureTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    throw new Error("La librairie Google ne s'est pas chargée (connexion internet ? bloqueur de scripts ?).");
  }
  if(!driveClientId){
    throw new Error("Renseigne d'abord ton identifiant client OAuth Google.");
  }
  if(!driveTokenClient || driveTokenClient.__clientId !== driveClientId){
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: driveClientId,
      scope: DRIVE_SCOPE,
      callback: ()=>{}
    });
    driveTokenClient.__clientId = driveClientId;
  }
  return driveTokenClient;
}
/* ---- Deux comptes Google, deux accès séparés ----
   Sauvegardes Drive = germain.sensique@gmail.com ; boîte mail = compte
   eufy. Le navigateur étant connecté aux deux comptes, une demande d'accès
   silencieuse pouvait revenir avec le MAUVAIS compte : Drive créait alors
   une sauvegarde vide dans l'autre compte (deux « clouds » séparés, d'où
   des appareils qui n'affichent plus la même chose), ou l'onglet Mail
   ouvrait la mauvaise boîte. Désormais : les deux demandes ne partent
   jamais en même temps, le compte est présélectionné (login_hint), puis
   VÉRIFIÉ ; un jeton du mauvais compte est refusé et révoqué. */
let googleAuthChain = Promise.resolve();
function googleAuthSerial(fn){
  const p = googleAuthChain.then(fn, fn);
  googleAuthChain = p.catch(()=>{});
  return p;
}
let driveWrongAccount = null, mailWrongAccount = null, driveCreateDeclinedToken = null;
function googleRevokeQuietly(token){
  try{ google.accounts.oauth2.revoke(token, ()=>{}); }catch(e){}
}
function driveRequestToken(interactive){
  return googleAuthSerial(()=> new Promise((resolve, reject)=>{
    let client;
    try{ client = driveEnsureTokenClient(); }catch(e){ reject(e); return; }
    let settled = false;
    const guard = setTimeout(()=>{ if(!settled){ settled = true; reject({error:"timeout"}); } }, interactive ? 180000 : 25000);
    client.callback = async (resp)=>{
      if(settled) return;
      settled = true; clearTimeout(guard);
      if(resp.error){ reject(resp); return; }
      try{
        const r = await fetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)", {headers:{Authorization:"Bearer "+resp.access_token}});
        if(r.ok){
          const email = (((await r.json()).user||{}).emailAddress||"").toLowerCase();
          if(email && email !== DRIVE_DEFAULT_ACCOUNT.toLowerCase()){
            googleRevokeQuietly(resp.access_token);
            driveWrongAccount = email;
            if(interactive) alert("Ce compte Google ("+email+") n'est pas celui des sauvegardes.\nReconnecte-toi en choisissant "+DRIVE_DEFAULT_ACCOUNT+".");
            reject({error:"wrong_account", email}); return;
          }
        }
      }catch(e){ /* vérification impossible (hors ligne) : le garde-fou de création de fichier prend le relais */ }
      driveWrongAccount = null;
      driveAccessToken = resp.access_token;
      driveTokenExpiry = Date.now() + (resp.expires_in*1000 - 60000);
      resolve(driveAccessToken);
    };
    // Présélectionne le compte des sauvegardes (login_hint ; hint gardé pour compatibilité).
    client.requestAccessToken({prompt: interactive ? "consent" : "", login_hint: DRIVE_DEFAULT_ACCOUNT, hint: DRIVE_DEFAULT_ACCOUNT});
  }));
}
async function driveGetToken(){
  if(driveAccessToken && Date.now() < driveTokenExpiry) return driveAccessToken;
  throw new Error("Session Google expirée — clique sur « Se connecter ».");
}
async function moveFileToRoot(token, fileId, currentParents){
  const oldParents = (currentParents||[]).join(",");
  if(!oldParents) return; // already at root
  try{
    await fetch("https://www.googleapis.com/drive/v3/files/"+fileId+"?addParents=root&removeParents="+oldParents, {
      method:"PATCH", headers:{Authorization:"Bearer "+token}
    });
  }catch(e){ /* not critical — the file still syncs fine wherever it is, found by name */ }
}
async function driveFindOrCreateFile(token){
  if(driveFileId){
    // Don't blindly trust a cached id — if it was deleted or made
    // inaccessible (e.g. during the recent folder cleanup), every write
    // would otherwise fail silently forever with no visible sign why.
    try{
      const check = await fetch("https://www.googleapis.com/drive/v3/files/"+driveFileId+"?fields=id,trashed", {headers:{Authorization:"Bearer "+token}});
      if(check.ok){
        const info = await check.json();
        if(!info.trashed) return driveFileId;
      }
    }catch(e){ /* fall through to a fresh search below */ }
    driveFileId = null;
    localStorage.removeItem("sensitache.driveFileId");
  }
  // Searching by name with no folder restriction finds the file wherever it
  // currently is (including inside a leftover SensiTache folder from
  // before), so nothing is lost — it's just tidied back to root once found.
  const q = encodeURIComponent("name='"+DRIVE_FILENAME+"' and trashed=false");
  const res = await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,name,parents)", {
    headers: {Authorization:"Bearer "+token}
  });
  const data = await res.json();
  if(data.files && data.files.length>0){
    driveFileId = data.files[0].id;
    moveFileToRoot(token, driveFileId, data.files[0].parents); // best-effort tidy-up, fire-and-forget
  } else {
    // Garde-fou : un appareil qui a déjà synchronisé ne devrait jamais
    // « perdre » son fichier — si on ne le trouve pas, c'est très
    // probablement le mauvais compte Google. On ne crée pas de sauvegarde
    // vide en silence, on demande.
    if(localStorage.getItem("sensitache.driveLastSync") && (driveCreateDeclinedToken===token ||
       !confirm("Aucune sauvegarde SensiTâche trouvée sur ce compte Google.\nTu es peut-être connecté au mauvais compte (les sauvegardes sont sur "+DRIVE_DEFAULT_ACCOUNT+").\n\nCréer quand même une nouvelle sauvegarde sur ce compte ?"))){
      driveCreateDeclinedToken = token; // ne pas redemander toutes les 15 s avec le même accès
      throw new Error("Sauvegarde introuvable sur ce compte Google — vérifie le compte ("+DRIVE_DEFAULT_ACCOUNT+").");
    }
    const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
      method:"POST",
      headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify({name: DRIVE_FILENAME, mimeType:"application/json"})
    });
    const created = await createRes.json();
    if(!created.id) throw new Error("Création du fichier Drive impossible.");
    driveFileId = created.id;
  }
  localStorage.setItem("sensitache.driveFileId", driveFileId);
  return driveFileId;
}
/* =========================================================================
   SYNCHRO FINE (v2) — horodatage par champ et par sous-tâche
   Chaque enregistrement compare la tâche à sa dernière version connue sur
   cet appareil et date précisément ce qui a changé (_ft[champ], _u sur
   chaque sous-tâche / pièce jointe, _subDel pour celles supprimées). La
   fusion avec Drive garde ainsi, champ par champ, la modification la plus
   récente — deux modifications faites en parallèle sur le téléphone et le
   PC dans la même tâche ne s'écrasent plus.
   _stampedAt = updatedAt au moment du dernier horodatage : si un appareil
   encore sur l'ancienne version modifie la tâche (sans horodater), son
   updatedAt dépasse _stampedAt et la fusion retombe sur « tâche la plus
   récente » pour ne rien ignorer.
========================================================================= */
const SYNC_META_KEYS = new Set(["updatedAt","_ft","_subDel","_stampedAt","subtasks","attachments"]);
const SYNC_KEYED_ARRAYS = ["subtasks","attachments"];
let syncBaseline = new Map();          // id de tâche -> dernière version connue (JSON par champ)
let syncLocalTouch = new Map();        // id de tâche -> dernière modification faite SUR CET APPAREIL
let syncClockOffset = 0;               // décalage de l'horloge locale par rapport à celle de Google
function syncNow(){ return Date.now() + syncClockOffset; }
function syncSnapshotTask(t){
  const fields = {};
  Object.keys(t).forEach(k=>{ if(!SYNC_META_KEYS.has(k)) fields[k] = JSON.stringify(t[k]===undefined ? null : t[k]); });
  const arrays = {}, orders = {};
  SYNC_KEYED_ARRAYS.forEach(name=>{
    const arr = Array.isArray(t[name]) ? t[name] : [];
    const m = {};
    arr.forEach(x=>{ if(x && x.id) m[x.id] = JSON.stringify(Object.assign({}, x, {_u:undefined})); });
    arrays[name] = m;
    orders[name] = arr.map(x=> x && x.id).join(",");
  });
  return {fields, arrays, orders};
}
function syncResetBaseline(){
  syncBaseline = new Map();
  (DATA.tasks||[]).forEach(t=>{
    syncBaseline.set(t.id, syncSnapshotTask(t));
    if(!t._stampedAt || (t.updatedAt||0) > t._stampedAt) t._stampedAt = t.updatedAt||0;
  });
}
function syncStampLocalChanges(){
  const now = syncNow();
  const present = new Set();
  (DATA.tasks||[]).forEach(t=>{
    present.add(t.id);
    const prev = syncBaseline.get(t.id);
    const cur = syncSnapshotTask(t);
    if(!prev){
      // Nouvelle sur cet appareil (créée ici, ou restaurée).
      t.updatedAt = Math.max(t.updatedAt||0, now);
      t._stampedAt = t.updatedAt;
      syncBaseline.set(t.id, cur);
      syncLocalTouch.set(t.id, Date.now());
      return;
    }
    let changed = false;
    const ft = Object.assign({}, t._ft||{});
    const keys = new Set(Object.keys(cur.fields).concat(Object.keys(prev.fields)));
    keys.forEach(k=>{ if(cur.fields[k] !== prev.fields[k]){ ft[k] = now; changed = true; } });
    SYNC_KEYED_ARRAYS.forEach(name=>{
      const arr = Array.isArray(t[name]) ? t[name] : [];
      const pa = prev.arrays[name]||{}, ca = cur.arrays[name]||{};
      arr.forEach(x=>{ if(x && x.id && ca[x.id] !== pa[x.id]){ x._u = now; changed = true; } });
      Object.keys(pa).forEach(id=>{ if(!(id in ca)){ t._subDel = Object.assign({}, t._subDel||{}); t._subDel[id] = now; changed = true; } });
      if(cur.orders[name] !== prev.orders[name]){ ft["_order_"+name] = now; changed = true; }
    });
    if(changed){
      t._ft = ft;
      t.updatedAt = Math.max(now, t.updatedAt||0);
      syncBaseline.set(t.id, cur);
      syncLocalTouch.set(t.id, Date.now());
    }
    // Cet appareil horodate tout : un updatedAt avancé sans changement de
    // champ (ex. éditeur de processus ouvert) n'est pas une modif « non datée ».
    t._stampedAt = t.updatedAt||0;
  });
  // Tâches disparues localement depuis la dernière version connue = suppressions faites ici.
  Array.from(syncBaseline.keys()).forEach(id=>{
    if(!present.has(id)){ syncBaseline.delete(id); syncLocalTouch.set(id, Date.now()); }
  });
}
syncResetBaseline();
// Fusionne la copie distante r DANS la copie locale l (en place, pour garder
// les références utilisées par l'interface) et renvoie l.
function syncMergeTask(l, r){
  if(l === r) return l;
  const lU = l.updatedAt||0, rU = r.updatedAt||0;
  const lft = l._ft||{}, rft = r._ft||{};
  // Modifs non datées (ancienne version de l'appli) : toute la tâche compte à son updatedAt.
  const lLoose = lU > (l._stampedAt||0), rLoose = rU > (r._stampedAt||0);
  const tl = k=> lLoose ? lU : (lft[k] || lU);
  const tr = k=> rLoose ? rU : (rft[k] || rU);
  const ft = Object.assign({}, lft);
  Object.keys(rft).forEach(k=>{ if(!ft[k] || rft[k] > ft[k]) ft[k] = rft[k]; });
  const keys = new Set(Object.keys(l).concat(Object.keys(r)));
  keys.forEach(k=>{
    if(SYNC_META_KEYS.has(k)) return;
    const a = tl(k), b = tr(k);
    if(b > a){
      if(k in r) l[k] = r[k]; else delete l[k];
      ft[k] = b;
    } else if(a > (ft[k]||0)) ft[k] = a;
  });
  // Sous-tâches et pièces jointes : union par identifiant, la version la
  // plus récente de chacune gagne, les suppressions datées sont respectées.
  const del = Object.assign({}, r._subDel||{});
  Object.keys(l._subDel||{}).forEach(id=>{ if(!del[id] || l._subDel[id] > del[id]) del[id] = l._subDel[id]; });
  SYNC_KEYED_ARRAYS.forEach(name=>{
    const la = Array.isArray(l[name]) ? l[name] : [], ra = Array.isArray(r[name]) ? r[name] : [];
    if(!la.length && !ra.length) return;
    const lm = new Map(la.filter(x=> x && x.id).map(x=>[x.id, x]));
    const rm = new Map(ra.filter(x=> x && x.id).map(x=>[x.id, x]));
    const pick = new Map(lm);
    rm.forEach((x,id)=>{
      const cur = pick.get(id);
      if(!cur){ pick.set(id, x); return; }
      const lt = rLoose || lLoose ? (cur._u || lU) : (cur._u || 0);
      const rt = rLoose || lLoose ? (x._u || rU) : (x._u || 0);
      if(rt > lt) pick.set(id, x);
    });
    const orderLocal = tl("_order_"+name) >= tr("_order_"+name);
    const primary = orderLocal ? la : ra, secondary = orderLocal ? ra : la;
    const out = [], seen = new Set();
    primary.concat(secondary).forEach(x=>{
      if(!x || !x.id || seen.has(x.id)) return;
      seen.add(x.id);
      const chosen = pick.get(x.id);
      if(del[x.id] && del[x.id] >= (chosen._u||0)) return;
      out.push(chosen);
    });
    const noId = (lU >= rU ? la : ra).filter(x=> !x || !x.id);
    l[name] = out.concat(noId);
  });
  if(Object.keys(del).length) l._subDel = del;
  l._ft = ft;
  l.updatedAt = Math.max(lU, rU);
  l._stampedAt = l.updatedAt;
  return l;
}

function mergeAppData(local, remote){
  if(!remote || !remote.workspaces || !remote.tasks) return local;
  // Shallow-clone the top level and the three record arrays only — each
  // individual task/workspace/collaborator object stays the exact same
  // reference from `local` unless a remote copy genuinely wins below. This
  // used to deep-clone the whole tree (JSON.parse(JSON.stringify(local)))
  // on every sync, even when nothing on the remote side had actually
  // changed — which silently orphaned anything bound to a "live" object
  // elsewhere, most notably PROC in the process editor: its legend/shape
  // inputs stay wired (via closures) to the pre-clone objects, so further
  // typing quietly lands on a disconnected copy that's discarded on the
  // very next save, and the edit appears to "revert to the default" the
  // next time the page reloads.
  const merged = Object.assign({}, local);
  merged.tasks = (local.tasks||[]).slice();
  merged.workspaces = (local.workspaces||[]).slice();
  merged.collaborators = (local.collaborators||[]).slice();
  const lt0 = local.tombstones || {};
  merged.tombstones = {
    workspaces: Object.assign({}, lt0.workspaces||{}),
    tasks: Object.assign({}, lt0.tasks||{}),
    collaborators: Object.assign({}, lt0.collaborators||{})
  };

  // Reconcile "Moi" across devices. Each device generates its own random
  // collaborator id for "Moi" the very first time it's ever opened, before
  // it has any idea another device exists. Once two devices sync through
  // the same Google account, they need to agree on a single id for "you" —
  // otherwise a task you created shows up as assigned to "someone else"
  // (a different "Moi") on your other device, landing in Collaboration
  // instead of Tâches. Whichever id is already on the remote copy wins, so
  // every device converges onto the same one from here on.
  if(remote.currentUserId && remote.currentUserId !== merged.currentUserId){
    const oldId = merged.currentUserId, newId = remote.currentUserId;
    merged.tasks.forEach(t=>{ t.assignedTo = (t.assignedTo||[]).map(id=> id===oldId ? newId : id); });
    merged.collaborators = merged.collaborators.filter(c=> c.id!==oldId);
    merged.currentUserId = newId;
  }

  merged.tombstones = merged.tombstones || {workspaces:{}, tasks:{}, collaborators:{}};
  const remoteTomb = remote.tombstones || {workspaces:{}, tasks:{}, collaborators:{}};

  // Merge the deletion records themselves first (union, keep the latest timestamp per id).
  ["workspaces","tasks","collaborators"].forEach(kind=>{
    merged.tombstones[kind] = merged.tombstones[kind] || {};
    Object.keys(remoteTomb[kind]||{}).forEach(id=>{
      const rTime = remoteTomb[kind][id];
      const lTime = merged.tombstones[kind][id];
      if(!lTime || rTime > lTime) merged.tombstones[kind][id] = rTime;
    });
  });
  // An item only "wins" over a deletion if it was genuinely modified after
  // the delete happened (i.e. deliberately recreated) — otherwise a device
  // that hasn't caught up yet would just bring a deleted item back to life.
  function deletedAfter(kind, id, itemUpdatedAt){
    const t = merged.tombstones[kind][id];
    if(!t) return false;
    return !(itemUpdatedAt && itemUpdatedAt > t);
  }

  // Collaborators: union by id, keep whichever copy (name/color) was
  // updated most recently — otherwise a rename on one device never
  // reaches the other, since "already exists locally" used to mean
  // "ignore the incoming version" even when it was the newer one.
  const collabMap = new Map(merged.collaborators.map(c=>[c.id, c]));
  (remote.collaborators||[]).forEach(rc=>{
    if(deletedAfter("collaborators", rc.id, rc.updatedAt)) return;
    const lc = collabMap.get(rc.id);
    if(!lc || (rc.updatedAt||0) > (lc.updatedAt||0)) collabMap.set(rc.id, rc);
  });
  merged.collaborators = Array.from(collabMap.values()).filter(c=> !deletedAfter("collaborators", c.id, c.updatedAt));

  // Workspaces: same "most recently updated copy wins" treatment, so a
  // rename or icon change actually propagates instead of being silently
  // dropped whenever the workspace already existed on the other side.
  const wsMap = new Map(merged.workspaces.map(w=>[w.id, w]));
  (remote.workspaces||[]).forEach(rw=>{
    if(deletedAfter("workspaces", rw.id, rw.updatedAt)) return;
    const lw = wsMap.get(rw.id);
    if(!lw || (rw.updatedAt||0) > (lw.updatedAt||0)) wsMap.set(rw.id, rw);
  });
  merged.workspaces = Array.from(wsMap.values()).filter(w=> !deletedAfter("workspaces", w.id, w.updatedAt));

  // Tasks: union by id, keep whichever copy was modified most recently, respecting deletions.
  const taskMap = new Map(merged.tasks.map(t=>[t.id, t]));
  (remote.tasks||[]).forEach(rt=>{
    if(deletedAfter("tasks", rt.id, rt.updatedAt)) return;
    const lt = taskMap.get(rt.id);
    if(!lt){ taskMap.set(rt.id, rt); return; }
    // Fusion champ par champ (voir SYNCHRO FINE) au lieu de « la tâche la
    // plus récente remplace l'autre en entier ».
    syncMergeTask(lt, rt);
  });
  merged.tasks = Array.from(taskMap.values()).filter(t=> !deletedAfter("tasks", t.id, t.updatedAt));
  merged.tasks.forEach(t=>{ if(!Array.isArray(t.assignedTo)) t.assignedTo = t.assignedTo ? [t.assignedTo] : [merged.currentUserId]; });
  return merged;
}
/* =========================================================================
   PERIODIC POINT-IN-TIME BACKUPS
   Separate from both the undo stack (short-term, in-memory) and Google
   Drive (continuous sync) — these are timestamped snapshots kept in this
   browser's storage, so you can roll back to "how things were a few hours
   ago" even after closing and reopening the app.
========================================================================= */
function loadBackupsList(){
  try{ return JSON.parse(localStorage.getItem(BACKUPS_KEY)) || []; }
  catch(e){ return []; }
}
function saveBackupsList(list){
  try{ localStorage.setItem(BACKUPS_KEY, JSON.stringify(list)); return true; }
  catch(e){
    // Likely a storage quota issue (base64 attachments add up) — drop the
    // oldest half and try once more rather than losing the backup silently.
    if(list.length>1){
      const trimmed = list.slice(Math.ceil(list.length/2));
      try{ localStorage.setItem(BACKUPS_KEY, JSON.stringify(trimmed)); return true; }catch(e2){ return false; }
    }
    return false;
  }
}
const DAILY_BACKUPS_KEY = "sensitache.dailyBackupsList";
const DAILY_RETENTION = 7; // 1 snapshot/day kept for 1 week
const DAILY_INTERVAL_MS = 24*60*60*1000;
function loadDailyBackupsList(){

}
function saveDailyBackupsList(list){

    if(list.length>1){

  }
}
function maybeCreateDailySnapshot(){
  const list = loadDailyBackupsList();
  const last = list.length ? list[list.length-1].ts : 0;
  if(Date.now() - last < DAILY_INTERVAL_MS) return;
  const entry = {ts: Date.now(), data: JSON.stringify(DATA)};

function createBackupSnapshotNow(){

  list.push(entry);

function maybeCreateFrequentSnapshot(){
  // A plain setInterval only fires while the app stays open — but on the
  // phone quick-capture flow the app closes itself almost immediately, so
  // that interval never gets a real chance to run. Checking "has enough
  // time actually elapsed since the last one?" at every natural checkpoint
  // (app open, reconnect, coming back to the foreground, not just the
  // timer) means a backup still happens even if the app is only ever
  // opened briefly.
  const list = loadBackupsList();
  const last = list.length ? list[list.length-1].ts : 0;
  if(Date.now() - last < backupRecurrenceMin*60000) return;
  createBackupSnapshotNow();
  maybeCreateDailySnapshot();
  maybeCreateWeeklySnapshot();
}
async function uploadBackupToDriveAsFile(entry, prefix, keepCount){
  if(!(driveClientId && driveAccessToken && Date.now() < driveTokenExpiry)) return;
  try{
    const token = await driveGetToken();
    const name = prefix+new Date(entry.ts).toISOString().replace(/[:.]/g,"-")+".json";
    const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
      method:"POST", headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify({name, mimeType:"application/json"})
    });
    const created = await createRes.json();
    if(!created.id) return;
    await fetch("https://www.googleapis.com/upload/drive/v3/files/"+created.id+"?uploadType=media", {
      method:"PATCH", headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"},
      body: entry.data
    });
    cleanupOldDriveBackups(token, prefix, keepCount);
  }catch(e){ console.warn("Échec de la copie de sauvegarde vers Drive :", e); }
}
async function cleanupOldDriveBackups(token, prefix, keepCount){
  try{
    const q = encodeURIComponent("name contains '"+prefix+"' and trashed=false");
    const res = await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,name,createdTime)&orderBy=createdTime desc", {headers:{Authorization:"Bearer "+token}});
    const data = await res.json();
    const files = data.files||[];
    const toDelete = files.slice(keepCount);
    for(const f of toDelete){
      await fetch("https://www.googleapis.com/drive/v3/files/"+f.id, {method:"DELETE", headers:{Authorization:"Bearer "+token}});
    }
  }catch(e){ /* cleanup is best-effort, never critical */ }
}
function scheduleBackupTimer(){
  if(backupTimerHandle) clearInterval(backupTimerHandle);
  backupTimerHandle = setInterval(maybeCreateFrequentSnapshot, Math.min(backupRecurrenceMin*60000, 5*60000));
}
scheduleBackupTimer();
maybeCreateFrequentSnapshot();
function restoreBackupSnapshot(entry){
  if(!confirm("Restaurer la sauvegarde du "+new Date(entry.ts).toLocaleString("fr-FR")+" ?\nL'état actuel sera d'abord mis de côté (tu pourras toujours faire « Annuler » juste après si tu changes d'avis).")) return;
  snapshot();
  try{
    const restored = JSON.parse(entry.data);
    restored.tasks = (restored.tasks||[]).map(t=>{
      if(!Array.isArray(t.assignedTo)) t.assignedTo = t.assignedTo ? [t.assignedTo] : [restored.currentUserId];
      return t;
    });
    if(!restored.tombstones) restored.tombstones = {workspaces:{}, tasks:{}, collaborators:{}};
    DATA = restored;
    if(!DATA.workspaces.find(w=>w.id===currentWsId)) currentWsId = DATA.workspaces[0] ? DATA.workspaces[0].id : null;
    saveData(); renderSidebar(); renderMain();
    alert("Sauvegarde restaurée.");
  }catch(e){ alert("Cette sauvegarde est illisible ou corrompue : "+e.message); }
}

function isUserCurrentlyTyping(){
  const el = document.activeElement;
  return !!(el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || (el.getAttribute && el.getAttribute("contenteditable")==="true")));
}
async function writeDriveBackup(){
  if(!driveClientId) return;
  if(isUserCurrentlyTyping() || (Date.now() - lastLocalEditAt < 2000)){
    // Merging too soon after any local change — not just mid-keystroke, but
    // also right after clicking a checkbox, an assignment avatar, etc. —
    // can pull in a remote copy that doesn't yet reflect what was just
    // changed here, making the edit appear to silently revert. Give the
    // debounced push a couple of seconds to actually land on Drive first.
    clearTimeout(backupDebounceTimer);
    backupDebounceTimer = setTimeout(writeDriveBackup, 1500);
    return;
  }
  try{
    const token = await driveGetToken();
    const fileId = await driveFindOrCreateFile(token);
    // Pull the current Drive copy first and merge it into what's local, so
    // creating tasks on different devices accumulates instead of the last
    // device to sync silently overwriting what another device had added.
    try{
      const res = await fetch("https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media", {headers:{Authorization:"Bearer "+token}});
      // Recale l'horloge sur celle de Google si l'appareil est décalé (> 2 s),
      // pour que « le plus récent gagne » compare des heures comparables.
      try{
        const srv = Date.parse(res.headers.get("date")||"");
        if(srv){ const off = srv - Date.now(); syncClockOffset = Math.abs(off) > 2000 ? off : 0; }
      }catch(e){}
      if(res.ok){
        const text = await res.text();
        if(text.trim()){
          const remote = JSON.parse(text);
          // Filet de sécurité : une copie locale complète avant la toute
          // première fusion avec la nouvelle synchro (récupérable dans les
          // sauvegardes de l'appli).
          if(!localStorage.getItem("sensitache.syncV2Ready")){
            try{ createBackupSnapshotNow(); }catch(e){}
            localStorage.setItem("sensitache.syncV2Ready", String(Date.now()));
          }
          try{ syncStampLocalChanges(); }catch(e){}
          const merged = mergeAppData(DATA, remote);
          DATA = merged;
          syncResetBaseline();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
          if(!DATA.workspaces.find(w=>w.id===currentWsId)) currentWsId = DATA.workspaces[0] ? DATA.workspaces[0].id : null;
          if(document.getElementById("procOverlay").classList.contains("show") && openTaskId){
            const stillOpenTask = DATA.tasks.find(x=>x.id===openTaskId);
            if(stillOpenTask && stillOpenTask.process && stillOpenTask.process !== PROC){
              // The merge above only swaps this task's object in when a
              // genuinely newer remote copy won (see mergeAppData) — the
              // normal case (nothing else changed) keeps the exact same
              // reference and skips this whole block. When it does swap,
              // every DOM control in the process editor (legend inputs,
              // shape toolbar, tasks pane) is still wired to the old
              // objects, so re-render everything now rather than let
              // further edits quietly land on a disconnected copy.
              PROC = stillOpenTask.process;
              procSelectedShapeId = null; procSelectedArrowId = null;
              procMultiSelectedIds.clear();
              procRemoveFloatToolbar();
              document.getElementById("procNameInput").value = PROC.name || "Processus";
              renderProcBoard(); renderProcLegend(); renderProcTasksList();
            }
          }
          renderSidebar(); renderMain();
        }
      }
    }catch(e){ /* couldn't read remote (offline, empty file, etc.) — push local as-is */ }
    await fetch("https://www.googleapis.com/upload/drive/v3/files/"+fileId+"?uploadType=media", {
      method:"PATCH",
      headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify(DATA)
    });
    driveLastSyncAt = Date.now();
    localStorage.setItem("sensitache.driveLastSync", String(driveLastSyncAt));
    driveLastSyncError = null;
  }catch(e){ driveLastSyncError = e.message||String(e); console.warn("Échec de la sauvegarde Drive :", e); }
  updateDriveStatus();
}
async function driveImport(){
  if(!confirm("Fusionner les données de Google Drive avec celles de cet appareil (rien n'est perdu des deux côtés) ?")) return;
  try{
    const token = await driveGetToken();
    const fileId = await driveFindOrCreateFile(token);
    const res = await fetch("https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media", {headers:{Authorization:"Bearer "+token}});
    if(!res.ok) throw new Error("Fichier introuvable sur Drive.");
    const text = await res.text();
    if(!text.trim()){ alert("Le fichier sur Drive est vide (aucune sauvegarde envoyée pour l'instant)."); return; }
    const remote = JSON.parse(text);
    if(!remote.workspaces || !remote.tasks) throw new Error("Contenu du fichier Drive invalide.");
    snapshot();
    try{ syncStampLocalChanges(); }catch(e){}
    DATA = mergeAppData(DATA, remote);
    syncResetBaseline();
    if(!DATA.workspaces.find(w=>w.id===currentWsId)) currentWsId = DATA.workspaces[0] ? DATA.workspaces[0].id : null;
    saveData(); renderSidebar(); renderMain();
    alert("Fusion avec Google Drive terminée.");
  }catch(e){ alert("Échec de l'import : "+e.message); }
}
